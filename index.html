<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Admin V5.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg: #050508; --card: rgba(14, 14, 20, 0.7); --nav: rgba(22, 22, 33, 0.85); 
            --accent: #00e5ff; --text: #ffffff; --muted: #94a3b8; 
            --border: rgba(255, 255, 255, 0.08); 
            --green: #00ff9d; --red: #ff0055;
            --glass: blur(16px) saturate(180%);
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        /* --- THEMES --- */
        /* Standard */
        [data-theme="cyberpunk"] { --bg:#050508; --accent:#00e5ff; }
        [data-theme="blood"] { --bg:#0f0202; --card:rgba(30, 5, 5, 0.7); --nav:rgba(40, 5, 5, 0.9); --accent:#ff0033; --green:#ff3333; --red:#ff0033; }
        [data-theme="matrix"] { --bg:#000000; --card:rgba(0, 20, 0, 0.8); --nav:rgba(0, 30, 0, 0.95); --accent:#00ff00; --green:#00ff00; --red:#008800; }
        [data-theme="cherry"] { --bg:#1a0f14; --card:rgba(38, 22, 28, 0.7); --nav:rgba(51, 30, 38, 0.9); --accent:#ff66b2; --green:#ff99cc; --red:#ff3366; }
        
        /* Anime */
        [data-theme="naruto"] { --bg:#0a0500; --card:rgba(40, 20, 0, 0.7); --nav:rgba(60, 30, 0, 0.9); --accent:#ff9100; --green:#ffae00; --red:#ff4500; }
        [data-theme="itachi"] { --bg:#050000; --card:rgba(20, 0, 0, 0.8); --nav:rgba(30, 0, 0, 0.95); --accent:#ff0000; --green:#ff3333; --red:#880000; }
        
        /* New Animated Contexts */
        [data-theme="ocean"] { --bg:#00111a; --card:rgba(0, 20, 30, 0.7); --nav:rgba(0, 30, 40, 0.9); --accent:#00aaff; --green:#00ffcc; --red:#ff0066; }
        [data-theme="galaxy"] { --bg:#070014; --card:rgba(20, 10, 40, 0.7); --nav:rgba(30, 20, 60, 0.9); --accent:#d400ff; --green:#00ff9d; --red:#ff0055; }
        [data-theme="sunset"] { --bg: linear-gradient(45deg, #2b0b30, #1a0820); --card:rgba(40, 10, 30, 0.7); --accent:#ffaa00; --nav:rgba(50, 20, 40, 0.9); }

        /* --- GLOBAL RESETS --- */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 110px; overflow-x: hidden; transition: background 0.4s ease, color 0.4s ease; }
        
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* --- HEADER --- */
        header { 
            position: sticky; top: 0; z-index: 50; 
            background: rgba(0,0,0,0.4); backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .brand i { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); transition: 0.3s; }
        
        .icon-btn { 
            width: 38px; height: 38px; border-radius: 10px; 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--muted);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .icon-btn:active { transform: scale(0.92); background: var(--accent); color: #000; }
        
        /* --- LAYOUT --- */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CONTROLS --- */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .search { position: relative; flex: 1; }
        .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.8rem; }
        .input-std { 
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); 
            padding: 12px 12px 12px 40px; color: var(--text); border-radius: 12px; 
            font-family: 'Inter', sans-serif; font-size: 0.9rem; backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .input-std:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        
        .btn-main { 
            background: var(--accent); color: #000; border: none; padding: 0 20px; 
            border-radius: 12px; font-weight: 700; cursor: pointer; 
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
            box-shadow: var(--shadow); transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.96); opacity: 0.9; }

        /* --- FILTER CHIPS --- */
        .chips { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .chip { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .chip.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }

        /* --- CARDS --- */
        .item-card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 18px; padding: 18px; margin-bottom: 12px; 
            display: flex; flex-direction: column; gap: 12px;
            backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden;
        }
        .item-card::before { content:''; position: absolute; top:0; left:0; width:4px; height:100%; background: var(--border); transition: 0.3s; }
        .item-card.active-card::before { background: var(--green); box-shadow: 2px 0 10px var(--green); }
        .item-card.banned-card::before { background: var(--red); box-shadow: 2px 0 10px var(--red); }
        
        .row-top { display: flex; justify-content: space-between; align-items: center; padding-left: 10px; }
        .mono-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text); font-size: 0.95rem; word-break: break-all; opacity: 0.9; }
        .meta-row { 
            border-top: 1px solid var(--border); padding: 10px 0 0 10px; 
            display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted);
            align-items: center;
        }
        .badge { font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; font-size: 0.6rem; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 5px; }
        .badge.active { background: rgba(0, 255, 157, 0.1); color: var(--green); border: 1px solid rgba(0, 255, 157, 0.2); }
        .badge.banned { background: rgba(255, 0, 85, 0.1); color: var(--red); border: 1px solid rgba(255, 0, 85, 0.2); }

        /* --- DEVICE SPECIFIC --- */
        .device-info { display: flex; align-items: center; gap: 12px; }
        .device-icon { 
            width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.03); 
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--muted); 
            border: 1px solid var(--border);
        }
        .active-card .device-icon { color: var(--green); border-color: rgba(0,255,157,0.3); }
        .banned-card .device-icon { color: var(--red); border-color: rgba(255,0,85,0.3); }
        .time-badge {
            background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
            display: inline-flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace;
        }

        /* --- SWITCH --- */
        .switch { position: relative; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #111; border-radius: 24px; transition: .3s; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #555; border-radius: 50%; transition: .3s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        input:checked + .slider { background: rgba(255, 0, 85, 0.15); border-color: var(--red); }
        input:checked + .slider:before { transform: translateX(22px); background: var(--red); box-shadow: 0 0 10px var(--red); }
        input:not(:checked) + .slider { background: rgba(0, 255, 157, 0.15); border-color: var(--green); }
        input:not(:checked) + .slider:before { background: var(--green); box-shadow: 0 0 10px var(--green); }

        /* --- NAV BAR --- */
        .nav-fixed { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 99; pointer-events: none; }
        .nav-inner { 
            background: var(--nav); border: 1px solid var(--border); 
            padding: 0 10px; height: 65px; border-radius: 20px; width: 90%; max-width: 380px;
            display: flex; justify-content: space-around; align-items: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: var(--glass);
            pointer-events: auto;
        }
        .nav-btn { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: var(--muted); font-size: 1.1rem; transition: 0.3s; cursor: pointer; height: 100%; border-radius: 12px;
        }
        .nav-btn:hover { color: #fff; }
        .nav-btn.active { color: var(--accent); transform: translateY(-2px); }
        .nav-lbl { font-size: 0.6rem; margin-top: 4px; font-weight: 700; letter-spacing: 0.5px; opacity: 0.8; }

        /* --- SETUP / ERROR SCREENS --- */
        .setup-box { 
            text-align: center; padding: 40px 25px; border: 1px solid var(--border); 
            border-radius: 24px; background: var(--card); margin-top: 40px; 
            backdrop-filter: blur(10px); box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }
        .btn-block { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 800; margin-top: 15px; cursor: pointer; letter-spacing: 0.5px; font-size: 0.9rem; transition: 0.2s; }
        .btn-block:active { transform: scale(0.98); }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.3s; opacity: 0; pointer-events: none; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content { background: #111; width: 90%; max-width: 340px; padding: 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 0 40px rgba(0,0,0,0.8); transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.open .modal-content { transform: scale(1); }
        .inp-group { margin-bottom: 18px; text-align: left; }
        .inp-label { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        /* --- TOAST --- */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--nav); border: 1px solid var(--accent); color: var(--text); padding: 12px 25px; border-radius: 50px; z-index: 300; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.85rem; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* --- DPMODS PANEL --- */
        .dp-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border); border-radius: 18px; padding: 25px; 
            text-align: center; margin-top: 20px; position: relative; overflow: hidden;
        }
        .dp-card::after {
            content: ''; position: absolute; top:0; left:0; width:100%; height:4px; 
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="brand"><i class="fas fa-cube"></i> <span id="brandName">...</span></div>
        <div style="display:flex; gap:10px">
            <div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-palette"></i></div>
            <div class="icon-btn" onclick="appInit(true)"><i class="fas fa-sync-alt"></i></div>
        </div>
    </header>

    <div class="container">
        <div id="viewLoader" style="text-align: center; padding: 100px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent);"></i>
            <p style="color: var(--muted); margin-top: 20px; font-weight: 600; letter-spacing: 2px; font-size: 0.8rem;">ESTABLISHING UPLINK...</p>
        </div>

        <div id="viewSetup" class="hidden setup-box">
            <div style="width: 60px; height: 60px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; border: 1px solid var(--border);">
                <i class="fas fa-database" style="font-size: 1.5rem; color: var(--accent);"></i>
            </div>
            <h2 style="margin: 0 0 10px 0;">Connect Database</h2>
            <div class="inp-group">
                <label class="inp-label">FIREBASE URL</label>
                <input type="text" class="input-std" id="inputDbUrl" placeholder="https://..." style="padding-left: 15px;">
            </div>
            <button class="btn-block" onclick="saveUrlAndConnect()">ESTABLISH CONNECTION</button>
        </div>

        <div id="viewDashboard" class="hidden fade-in">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
                <div class="item-card" style="align-items:center; padding:15px; margin:0; border-color: rgba(0,229,255,0.2);">
                    <span style="font-size:1.8rem; font-weight:800; color:var(--accent);" id="statKeys">0</span>
                    <span style="font-size:0.65rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing: 1px;">Valid Keys</span>
                </div>
                <div class="item-card" style="align-items:center; padding:15px; margin:0; border-color: rgba(0,255,157,0.2);">
                    <span style="font-size:1.8rem; font-weight:800; color:var(--green);" id="statDevs">0</span>
                    <span style="font-size:0.65rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing: 1px;">Devices</span>
                </div>
            </div>

            <div id="tabKeys">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchKeys" placeholder="Search Keys..." onkeyup="renderKeys()"></div>
                    <button class="btn-main" onclick="openModal('modalKey')"><i class="fas fa-plus"></i> NEW</button>
                </div>
                <div id="listKeys"></div>
            </div>

            <div id="tabDevices" class="hidden">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchDevs" placeholder="Search Device ID..." onkeyup="renderDevices()"></div>
                </div>
                <div class="chips">
                    <div class="chip active" onclick="setDevFilter('all', this)">All Devices</div>
                    <div class="chip" onclick="setDevFilter('allowed', this)">Allowed Only</div>
                    <div class="chip" onclick="setDevFilter('banned', this)">Banned Only</div>
                </div>
                <div id="listDevices"></div>
            </div>

            <div id="tabConfig" class="hidden">
                <h3 style="margin-bottom:20px; color:var(--text); font-weight:800; display:flex; align-items:center; gap:10px;">
                    <i class="fas fa-cogs" style="color:var(--accent)"></i> System Config
                </h3>
                <div class="item-card">
                    <div class="inp-group"><label class="inp-label">APP TITLE</label><input type="text" class="input-std" id="confTitle" style="padding-left:15px"></div>
                    <div class="inp-group"><label class="inp-label">SUBTITLE</label><input type="text" class="input-std" id="confSub" style="padding-left:15px"></div>
                    <div class="inp-group"><label class="inp-label">ADMIN CONTACT</label><input type="text" class="input-std" id="confUrl" style="padding-left:15px"></div>
                    <div style="height:1px; background:var(--border); margin:15px 0 20px 0;"></div>
                    <h4 style="margin:0 0 15px 0; color:var(--accent); font-size:0.85rem;">EXTERNAL API LINKAGE</h4>
                    <div class="inp-group"><label class="inp-label">API BASE URL</label><input type="text" class="input-std" id="confApiUrl" placeholder="https://api.example.com" style="padding-left:15px"></div>
                    <div class="inp-group"><label class="inp-label">API TOKEN</label><input type="text" class="input-std" id="confApiToken" placeholder="sk_live_..." style="padding-left:15px"></div>
                    <button class="btn-block" onclick="saveConfig()">SAVE CONFIGURATION</button>
                </div>

                <div class="dp-card" id="aboutPanel">
                    <i class="fas fa-code-branch" style="font-size:2rem; color:var(--accent); margin-bottom:15px;"></i>
                    <h4 style="margin:0; font-size:1.1rem; color:var(--text);" id="panelTitle">...</h4>
                    <p style="color:var(--muted); font-size:0.8rem; margin:5px 0 20px 0;">Secure Device Management System</p>
                    <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; border:1px solid var(--border); display:inline-block; min-width: 200px;">
                        <span style="font-size:0.65rem; color:var(--muted); font-weight:800; letter-spacing:1px; text-transform:uppercase;">Developed By</span><br>
                        <span style="font-size:1.3rem; font-weight:800; color:var(--accent); text-shadow: 0 0 15px var(--accent); letter-spacing:-0.5px;" id="panelDev">...</span>
                    </div>
                </div>

                <div class="item-card" style="border-color: rgba(255,0,85,0.3); margin-top: 20px;">
                    <h4 style="margin:0 0 10px 0; color:var(--red);">DANGER ZONE</h4>
                    <button class="btn-block" style="background: rgba(255,0,85,0.1); color: var(--red); border: 1px solid var(--red); margin-top:10px;" onclick="hardReset()">DISCONNECT DATABASE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalKey" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Generate Keys</h3>
            <div class="inp-group"><label class="inp-label">PREFIX</label><input type="text" class="input-std" id="keyPrefix" value="VIP" style="padding-left:15px"></div>
            <div class="inp-group"><label class="inp-label">QUANTITY</label><input type="number" class="input-std" id="keyQty" value="1" style="padding-left:15px"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-block" style="margin-top:0" onclick="generateKeys()">GENERATE</button>
                <button class="btn-block" style="margin-top:0; background:transparent; border:1px solid var(--border); color:var(--muted)" onclick="closeModal('modalKey')">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="modalEdit" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Edit Key</h3>
            <input type="hidden" id="editOld">
            <div class="inp-group"><label class="inp-label">KEY STRING</label><input type="text" class="input-std" id="editNew" style="padding-left:15px"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-block" style="margin-top:0" onclick="saveKeyEdit()">SAVE</button>
                <button class="btn-block" style="margin-top:0; background:transparent; border:1px solid var(--border); color:var(--muted)" onclick="closeModal('modalEdit')">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="modalEditDevice" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Edit Device ID</h3>
            <input type="hidden" id="editDeviceOld">
            <input type="hidden" id="editDeviceType">
            <div class="inp-group"><label class="inp-label">DEVICE ID</label><input type="text" class="input-std" id="editDeviceNew" style="padding-left:15px"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-block" style="margin-top:0" onclick="saveDeviceEdit()">UPDATE</button>
                <button class="btn-block" style="margin-top:0; background:transparent; border:1px solid var(--border); color:var(--muted)" onclick="closeModal('modalEditDevice')">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle" style="color:var(--green)"></i><span>Action Successful</span></div>

    <div class="nav-fixed">
        <div class="nav-inner">
            <div class="nav-btn active" id="navKey" onclick="switchTab('keys')"><i class="fas fa-key"></i><span class="nav-lbl">KEYS</span></div>
            <div class="nav-btn" id="navDev" onclick="switchTab('devices')"><i class="fas fa-mobile-alt"></i><span class="nav-lbl">DEVICES</span></div>
            <div class="nav-btn" id="navConf" onclick="switchTab('config')"><i class="fas fa-sliders-h"></i><span class="nav-lbl">CONFIG</span></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIG & INIT
        // ==========================================
        let dbUrl = localStorage.getItem("gateway_db_url") || "";
        let dbData = null;
        let devFilter = 'all';
        
        // Themes list
        let themes = [
            'cyberpunk', 'matrix', 'blood', 'ocean', 
            'galaxy', 'sunset', 'cherry', 'naruto', 'itachi'
        ];
        let curThemeIdx = 0;

        const DEFAULT_DATA = { 
            "Config": { 
                "Title": "Gateway Panel", "Subtitle": "ONLINE", "AdminUrl": "", 
                "Api": { "BaseUrl": "", "Token": "" } 
            }, 
            "BannedDevices": {}, "ActivatedUsers": {}, "ValidKeys": {} 
        };

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        // ENCRYPTED STRINGS (To protect credits)
        // Base64 Encoded to prevent casual editing
        const _s1 = "R2F0ZXdheSBQYW5lbCBWNS4z"; // Gateway Panel V5.3
        const _s2 = "RFBNb2Rz"; // DPMods

        // ==========================================
        // 2. MAIN APP
        // ==========================================
        function initDecryption() {
            // Decrypts and injects the text at runtime
            try {
                document.getElementById('brandName').innerText = atob(_s1);
                document.getElementById('panelTitle').innerText = atob(_s1);
                document.getElementById('panelDev').innerText = atob(_s2);
            } catch(e) { console.log("Integrity Check Failed"); }
        }

        async function appInit(isManual = false) {
            initDecryption();
            document.getElementById('viewLoader').classList.remove('hidden');
            document.getElementById('viewSetup').classList.add('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');
            document.querySelector('.nav-fixed').classList.add('hidden');

            if (!dbUrl) {
                setTimeout(() => {
                    document.getElementById('viewLoader').classList.add('hidden');
                    document.getElementById('viewSetup').classList.remove('hidden');
                }, 800);
                return;
            }

            const finalUrl = sanitizeUrl(dbUrl);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            try {
                const response = await fetch(finalUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error("Connection failed");
                let data = await response.json();

                if (!data) {
                    await fetch(finalUrl, { method: 'PUT', body: JSON.stringify(DEFAULT_DATA) });
                    data = DEFAULT_DATA;
                }

                dbData = data;
                ensureDataStructure();
                renderAll();

                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewDashboard').classList.remove('hidden');
                document.querySelector('.nav-fixed').classList.remove('hidden');
                if(isManual) showToast("System Reloaded");

            } catch (err) {
                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewSetup').classList.remove('hidden');
                showToast("Connection Error");
            }
        }

        function saveUrlAndConnect() {
            let inp = document.getElementById('inputDbUrl').value.trim();
            if(!inp) return showToast("Invalid URL");
            if(!inp.startsWith("http")) inp = "https://" + inp;
            if(!inp.includes("firebaseio.com")) inp += ".firebaseio.com";
            localStorage.setItem("gateway_db_url", inp);
            dbUrl = inp;
            appInit();
        }

        function sanitizeUrl(url) { return url.endsWith("/") ? url + ".json" : url + "/.json"; }

        function ensureDataStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_DATA.Config;
            if(!dbData.Config.Api) dbData.Config.Api = { BaseUrl: "", Token: "" };
        }

        async function syncDB() {
            try {
                await fetch(sanitizeUrl(dbUrl), { method: 'PUT', body: JSON.stringify(dbData) });
                showToast("Saved");
                renderAll();
            } catch (e) { showToast("Save Failed"); }
        }

        function hardReset() {
            if(confirm("Disconnect?")) { localStorage.removeItem("gateway_db_url"); location.reload(); }
        }

        // ==========================================
        // 3. RENDERERS
        // ==========================================
        function renderAll() {
            renderKeys();
            renderDevices();
            document.getElementById('statKeys').innerText = Object.keys(dbData.ValidKeys).length;
            document.getElementById('statDevs').innerText = Object.keys(dbData.ActivatedUsers).length + Object.keys(dbData.BannedDevices).length;
            document.getElementById('confTitle').value = dbData.Config.Title || "";
            document.getElementById('confSub').value = dbData.Config.Subtitle || "";
            document.getElementById('confUrl').value = dbData.Config.AdminUrl || "";
            document.getElementById('confApiUrl').value = dbData.Config.Api.BaseUrl || "";
            document.getElementById('confApiToken').value = dbData.Config.Api.Token || "";
        }

        function renderKeys() {
            const list = document.getElementById('listKeys');
            const search = document.getElementById('searchKeys').value.toLowerCase();
            list.innerHTML = "";
            Object.keys(dbData.ValidKeys).reverse().forEach(key => {
                if (search && !key.toLowerCase().includes(search)) return;
                list.innerHTML += `
                <div class="item-card active-card">
                    <div class="row-top">
                        <span class="mono-text" onclick="copy('${key}')">${key}</span>
                        <div style="display:flex; gap:8px">
                            <div class="icon-btn" style="width:32px; height:32px;" onclick="editKey('${key}')"><i class="fas fa-pen" style="font-size:0.8rem"></i></div>
                            <div class="icon-btn" style="width:32px; height:32px; border-color:var(--red); color:var(--red);" onclick="delKey('${key}')"><i class="fas fa-trash" style="font-size:0.8rem;"></i></div>
                        </div>
                    </div>
                    <div class="meta-row">
                        <span><i class="far fa-clock"></i> ${formatDate(dbData.ValidKeys[key])}</span>
                        <span class="badge active"><i class="fas fa-check"></i> VALID</span>
                    </div>
                </div>`;
            });
        }

        function renderDevices() {
            const list = document.getElementById('listDevices');
            const search = document.getElementById('searchDevs').value.toLowerCase();
            list.innerHTML = "";
            const allDevs = [...new Set([...Object.keys(dbData.ActivatedUsers), ...Object.keys(dbData.BannedDevices)])];
            
            allDevs.forEach(dev => {
                if(!dev) return;
                if(search && !dev.toLowerCase().includes(search)) return;
                const isBanned = dbData.BannedDevices[dev] !== undefined;
                if (devFilter === 'allowed' && isBanned) return;
                if (devFilter === 'banned' && !isBanned) return;

                const timeStr = formatDate(isBanned ? dbData.BannedDevices[dev] : dbData.ActivatedUsers[dev]);
                const statusClass = isBanned ? 'banned-card' : 'active-card';
                const statusText = isBanned ? 'BANNED' : 'AUTHORIZED';
                const badgeClass = isBanned ? 'banned' : 'active';
                const icon = isBanned ? 'fa-ban' : 'fa-mobile-alt';

                list.innerHTML += `
                <div class="item-card ${statusClass}">
                    <div class="row-top" style="padding:0">
                        <div class="device-info">
                            <div class="device-icon"><i class="fas ${icon}"></i></div>
                            <div style="display:flex; flex-direction:column;">
                                <span class="mono-text" style="font-size:0.85rem;" onclick="copy('${dev}')">${dev}</span>
                                <span style="font-size:0.65rem; color:var(--muted); font-weight:600; margin-top:2px;">ID: ${dev.substring(0,8)}...</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${dev}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="meta-row" style="margin-top:5px;">
                        <span class="badge ${badgeClass}">${statusText}</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="time-badge"><i class="fas fa-clock" style="font-size:0.7rem"></i> ${timeStr}</span>
                            <div class="icon-btn" style="width:28px; height:28px; border:none; background:transparent;" onclick="editDevice('${dev}', ${isBanned})">
                                <i class="fas fa-pen" style="font-size:0.8rem"></i>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            if(list.innerHTML === "") list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted); font-size:0.8rem;">No Devices Found</div>`;
        }

        function formatDate(isoStr) {
            try {
                const d = new Date(isoStr);
                return isNaN(d) ? "Unknown" : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ", " + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
            } catch(e) { return "Unknown"; }
        }

        // ==========================================
        // 4. ACTIONS
        // ==========================================
        function generateKeys() {
            const qty = document.getElementById('keyQty').value;
            const prefix = document.getElementById('keyPrefix').value.toUpperCase();
            for(let i=0; i<qty; i++) {
                const rnd = Math.random().toString(36).substring(2, 8).toUpperCase();
                const k = prefix ? `${prefix}-${rnd}` : rnd;
                dbData.ValidKeys[k] = new Date().toISOString();
            }
            closeModal('modalKey');
            syncDB();
        }

        function toggleBan(dev) {
            const now = new Date().toISOString();
            if (dbData.BannedDevices[dev]) {
                dbData.ActivatedUsers[dev] = dbData.BannedDevices[dev] || now;
                delete dbData.BannedDevices[dev];
            } else {
                dbData.BannedDevices[dev] = dbData.ActivatedUsers[dev] || now;
                delete dbData.ActivatedUsers[dev];
            }
            syncDB();
        }

        function saveConfig() {
            dbData.Config.Title = document.getElementById('confTitle').value;
            dbData.Config.Subtitle = document.getElementById('confSub').value;
            dbData.Config.AdminUrl = document.getElementById('confUrl').value;
            dbData.Config.Api.BaseUrl = document.getElementById('confApiUrl').value;
            dbData.Config.Api.Token = document.getElementById('confApiToken').value;
            syncDB();
        }

        function saveKeyEdit() {
            const oldK = document.getElementById('editOld').value;
            const newK = document.getElementById('editNew').value;
            if(newK && newK !== oldK) {
                dbData.ValidKeys[newK] = dbData.ValidKeys[oldK];
                delete dbData.ValidKeys[oldK];
                syncDB();
            }
            closeModal('modalEdit');
        }

        function saveDeviceEdit() {
            const oldDev = document.getElementById('editDeviceOld').value;
            const newDev = document.getElementById('editDeviceNew').value.trim();
            const type = document.getElementById('editDeviceType').value;
            if(newDev && newDev !== oldDev) {
                if(type === 'banned') {
                    dbData.BannedDevices[newDev] = dbData.BannedDevices[oldDev];
                    delete dbData.BannedDevices[oldDev];
                } else {
                    dbData.ActivatedUsers[newDev] = dbData.ActivatedUsers[oldDev];
                    delete dbData.ActivatedUsers[oldDev];
                }
                syncDB();
            }
            closeModal('modalEditDevice');
        }

        function delKey(key) { if(confirm("Delete key?")) { delete dbData.ValidKeys[key]; syncDB(); } }

        // ==========================================
        // 5. UI & THEME ANIMATIONS
        // ==========================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.querySelector('span').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function copy(txt) { navigator.clipboard.writeText(txt).then(() => showToast("Copied")); }
        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        function editKey(key) { document.getElementById('editOld').value=key; document.getElementById('editNew').value=key; openModal('modalEdit'); }
        function editDevice(dev, isBanned) {
            document.getElementById('editDeviceOld').value = dev;
            document.getElementById('editDeviceNew').value = dev;
            document.getElementById('editDeviceType').value = isBanned ? 'banned' : 'allowed';
            openModal('modalEditDevice');
        }
        function setDevFilter(f, el) {
            devFilter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderDevices();
        }
        function switchTab(tab) {
            ['Keys', 'Devices', 'Config'].forEach(t => document.getElementById(`tab${t}`).classList.add('hidden'));
            ['Key', 'Dev', 'Conf'].forEach(n => document.getElementById(`nav${n}`).classList.remove('active'));
            if(tab === 'keys') { document.getElementById('tabKeys').classList.remove('hidden'); document.getElementById('navKey').classList.add('active'); }
            else if(tab === 'devices') { document.getElementById('tabDevices').classList.remove('hidden'); document.getElementById('navDev').classList.add('active'); }
            else { document.getElementById('tabConfig').classList.remove('hidden'); document.getElementById('navConf').classList.add('active'); }
        }

        function toggleTheme() {
            curThemeIdx = (curThemeIdx + 1) % themes.length;
            const theme = themes[curThemeIdx];
            document.documentElement.setAttribute('data-theme', theme);
            showToast(`Theme: ${theme.toUpperCase()}`);
            setAnimation(theme);
        }

        // ==========================================
        // 6. ANIMATION ENGINE
        // ==========================================
        function setAnimation(theme) {
            if(animationId) cancelAnimationFrame(animationId);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            if (theme === 'matrix') initMatrix();
            else if (theme === 'galaxy') initStars();
            else initParticles(theme);
        }

        // Standard Particles
        function initParticles(theme) {
            particles = [];
            const color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            for(let i=0; i<60; i++) {
                particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, v: Math.random()*0.5+0.1, s: Math.random()*2 });
            }
            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.4;
                particles.forEach(p => {
                    p.y -= p.v;
                    if(p.y < 0) p.y = canvas.height;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                });
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // Matrix Rain
        function initMatrix() {
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            ctx.font = fontSize + "px monospace";
            
            function loop() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#0F0";
                drops.forEach((y, i) => {
                    const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                    ctx.fillText(text, i * fontSize, y * fontSize);
                    if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // Galaxy Stars
        function initStars() {
            particles = [];
            for(let i=0; i<100; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*1.5 });
            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#FFF";
                particles.forEach(p => {
                    ctx.globalAlpha = Math.random();
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                });
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        
        // BOOT
        document.documentElement.setAttribute('data-theme', 'cyberpunk');
        setAnimation('cyberpunk');
        appInit();
    </script>
</body>
</html>
