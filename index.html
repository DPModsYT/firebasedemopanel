<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods V5 Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;  
            --card-bg: rgba(20, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --grad-main: linear-gradient(135deg, #7000ff 0%, #00e5ff 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px; /* Space for Nav */
            overflow-x: hidden;
        }

        /* --- BACKGROUND --- */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 10%, #1a0b2e 0%, #000000 90%);
        }

        .container { max-width: 720px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; 
            display: flex; align-items: center; gap: 12px; letter-spacing: 1px;
        }
        .status-dot { 
            width: 10px; height: 10px; background: #00ff99; border-radius: 50%; 
            box-shadow: 0 0 15px #00ff99; animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.6; transform: scale(0.9); } }

        /* --- SECTIONS --- */
        .section-title {
            font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700;
            margin: 25px 0 15px; display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; color: var(--text-main);
        }
        .section-title i { color: var(--primary); }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: linear-gradient(160deg, rgba(30, 30, 45, 0.6) 0%, rgba(10, 10, 20, 0.8) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 20px; margin-bottom: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
        }
        .glass-card:hover { border-color: rgba(112, 0, 255, 0.3); transform: translateY(-2px); }

        /* --- USER LIST ITEMS --- */
        .user-item {
            display: flex; flex-direction: column; gap: 12px;
            border-left: 4px solid var(--primary);
            position: relative; overflow: hidden;
        }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.85; }
        .user-item.banned::after {
            content: 'BANNED'; position: absolute; right: -10px; top: 10px;
            background: var(--accent); color: white; font-size: 0.6rem;
            padding: 2px 15px; transform: rotate(45deg); font-weight: bold;
            box-shadow: 0 0 10px var(--accent);
        }

        .user-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .user-info h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; }
        .user-info .sub-text { color: var(--text-muted); font-size: 0.85rem; display: block; margin-top: 4px; font-family: monospace; }
        
        .user-badges { display: flex; gap: 8px; margin-top: 5px; }
        .badge { 
            font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; 
            background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid transparent;
        }
        .badge.exp { border-color: var(--primary); color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .badge.pass { border-color: #666; }

        /* --- ACTIONS ROW --- */
        .action-row { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); 
        }

        .btn-group { display: flex; gap: 10px; }
        .btn-icon {
            width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
            background: rgba(255,255,255,0.05); color: #fff; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .btn-edit:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        .btn-delete:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); }

        /* --- TOGGLE SWITCH --- */
        .switch-container { display: flex; align-items: center; gap: 10px; }
        .switch-label { font-size: 0.75rem; color: #888; font-weight: 600; text-transform: uppercase; }
        
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a2a35; transition: .4s; border-radius: 34px; border: 1px solid #444;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: #aaa; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* --- FORMS & MODALS --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 200;
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal.show { opacity: 1; }
        
        .modal-content {
            background: #151520; border: 1px solid rgba(112, 0, 255, 0.3);
            width: 90%; max-width: 400px; padding: 25px; border-radius: 20px;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.15); transform: scale(0.95); transition: transform 0.3s;
        }
        .modal.show .modal-content { transform: scale(1); }

        label { display: block; color: var(--primary); margin: 15px 0 5px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, textarea {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            padding: 14px; border-radius: 10px; color: #fff; font-family: 'Poppins', sans-serif;
            transition: 0.3s; font-size: 0.95rem;
        }
        input:focus, textarea:focus { border-color: var(--secondary); box-shadow: 0 0 15px rgba(112, 0, 255, 0.2); }

        .btn-main {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--grad-main); color: #fff; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; margin-top: 25px;
            box-shadow: 0 8px 20px rgba(112, 0, 255, 0.3); transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.98); }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; padding: 10px 30px;
            display: flex; gap: 40px; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 90;
        }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 15px var(--primary); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; background: var(--primary); border-radius: 50%;
        }

        .fab-add {
            background: var(--grad-main); color: #fff; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; cursor: pointer; margin-top: -40px; border: 5px solid var(--bg-deep);
            box-shadow: 0 0 25px rgba(112, 0, 255, 0.6); transition: 0.3s;
        }
        .fab-add:hover { transform: scale(1.1) rotate(90deg); }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V5</div>
        <div style="font-size: 0.75rem; color: #aaa; font-weight: 600; letter-spacing: 1px;">ADMIN PANEL</div>
    </header>

    <div class="container">
        
        <div id="tabDevices">
            <div class="section-title">
                <i class="fas fa-users"></i> User Management
            </div>
            
            <div id="userList">
                <div class="glass-card" style="text-align: center; color: #888; padding: 50px 20px;">
                    <div class="loader"></div>
                    <div>Connecting to Firebase...</div>
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <div class="section-title">
                <i class="fas fa-sliders-h"></i> System Config
            </div>
            <div class="glass-card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl" placeholder="https://t.me/...">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout" placeholder="e.g. 1m, 30s">

                <div style="margin-top: 20px; display:flex; align-items:center; gap:10px;">
                    <label class="switch" style="width: 50px; height: 26px;">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color:#fff; font-size:0.9rem;">Show Announcement</span>
                </div>

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3" placeholder="Enter message..."></textarea>

                <button class="btn-main" onclick="saveSettings()">Update Config</button>
            </div>
        </div>

    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #fff; margin: 0 0 20px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;">USER DETAILS</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label>
            <input type="text" id="inpUser" placeholder="Enter username">

            <label>Password</label>
            <input type="text" id="inpPass" placeholder="Enter password">

            <label>Device ID</label>
            <input type="text" id="inpDevice" placeholder="Hardware ID">

            <label>Expiry Date</label>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button onclick="setExpiry(30)" style="flex:1; padding:8px; background:#2a2a35; color:#fff; border:1px solid #444; border-radius:6px; cursor:pointer;">+30 Days</button>
                <button onclick="setExpiry(365)" style="flex:1; padding:8px; background:#2a2a35; color:#fff; border:1px solid #444; border-radius:6px; cursor:pointer;">+1 Year</button>
            </div>
            <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-main" style="background:#222; margin-top:0;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" style="margin-top:0;" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-user-shield"></i></div>
        <div class="fab-add" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-cog"></i></div>
    </nav>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // Using the .json endpoint is crucial for REST API
        const DATABASE_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        let dbData = {
            AdminUrl: "",
            DialogTimeout: "1m",
            ShowAnnouncement: false,
            Announcement: "",
            BannedDevices: [],
            Users: []
        };
        
        let lastJsonString = "";
        let isModalOpen = false;

        // ==========================================
        // PARTICLE BACKGROUND
        // ==========================================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; 
                this.speedX = (Math.random() * 0.4) - 0.2; this.speedY = (Math.random() * 0.4) - 0.2;
                this.color = Math.random() > 0.5 ? '#7000ff' : '#00e5ff';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function initParticles() { particlesArray = []; for (let i=0; i<50; i++) particlesArray.push(new Particle()); }
        function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particlesArray.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initParticles(); });
        initParticles(); animateParticles();

        // ==========================================
        // LOGIC
        // ==========================================
        async function fetchData() {
            if(isModalOpen) return; // Don't refresh if user is editing

            try {
                const response = await fetch(DATABASE_URL);
                if (!response.ok) throw new Error("Network Error");
                const val = await response.json();

                // HANDLE EMPTY DB
                if (!val) {
                    dbData.Users = []; // Ensure array exists
                    renderUsers();
                    return;
                }

                // CHECK FOR CHANGES
                const newJson = JSON.stringify(val);
                if (newJson === lastJsonString) return;
                lastJsonString = newJson;

                // --- DATA NORMALIZATION (BACKEND IMPROVEMENT) ---
                // Fills in missing fields if your DB structure is old
                
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";
                dbData.BannedDevices = val.BannedDevices || [];

                // Handle Users: Convert Object/Array and fix missing keys
                let usersRaw = val.Users || [];
                if (typeof usersRaw === 'object' && !Array.isArray(usersRaw)) {
                    usersRaw = Object.values(usersRaw);
                }

                dbData.Users = usersRaw.map(u => ({
                    Username: u.Username || "User_" + (u.ID ? u.ID.substring(0,4) : "Unknown"),
                    Password: u.Password || "---",
                    // Fix: Read 'ID' if 'DeviceID' is missing (Backwards compatibility)
                    DeviceID: u.DeviceID || u.ID || "No Device ID", 
                    Expiry: u.Expiry || ""
                }));

                renderUsers();
                fillSettings();

            } catch (error) {
                console.error("Fetch Error:", error);
                // Don't show error immediately to avoid flickering, console log is enough
            }
        }

        // Poll every 2 seconds
        setInterval(fetchData, 2000);
        fetchData();

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (!dbData.Users || dbData.Users.length === 0) {
                list.innerHTML = `
                <div class="glass-card" style="text-align: center; padding: 40px; color: #888;">
                    <i class="fas fa-ghost" style="font-size: 2rem; margin-bottom: 10px; opacity:0.5;"></i><br>
                    No Active Users Found
                </div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);

                const div = document.createElement('div');
                div.className = `glass-card user-item ${isBanned ? 'banned' : ''}`;
                
                div.innerHTML = `
                    <div class="user-header">
                        <div class="user-info">
                            <h4>${u.Username}</h4>
                            <span class="sub-text">${u.DeviceID}</span>
                            <div class="user-badges">
                                <span class="badge pass"><i class="fas fa-key"></i> ${u.Password}</span>
                                <span class="badge exp"><i class="far fa-clock"></i> ${u.Expiry}</span>
                            </div>
                        </div>
                    </d
