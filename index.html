<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods Admin V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;  
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --grad-main: linear-gradient(135deg, #7000ff 0%, #00e5ff 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* --- PARTICLES & HEADER --- */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 10%, #1a0b2e 0%, #000000 90%); }

        .container { max-width: 720px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; background: #00ff99; border-radius: 50%; box-shadow: 0 0 15px #00ff99; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* --- CARDS & LIST --- */
        .glass-card {
            background: linear-gradient(160deg, rgba(30, 30, 45, 0.6) 0%, rgba(10, 10, 20, 0.8) 100%);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px; margin-bottom: 16px;
            backdrop-filter: blur(20px); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }

        .user-item { display: flex; flex-direction: column; gap: 12px; border-left: 4px solid var(--primary); position: relative; }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.8; }
        .user-item.banned::after {
            content: 'BANNED'; position: absolute; right: -10px; top: 10px; background: var(--accent);
            color: white; font-size: 0.6rem; padding: 2px 15px; transform: rotate(45deg); font-weight: bold;
        }

        .user-header h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; }
        .user-header .device-id { color: var(--text-muted); font-size: 0.85rem; font-family: monospace; display: block; margin-top: 4px; }

        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        .btn-icon { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; background: rgba(255,255,255,0.05); color: #fff; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-edit:hover { background: var(--primary); color: #000; } .btn-delete:hover { background: var(--accent); }

        /* --- TOGGLE SWITCH --- */
        .switch-container { display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a2a35; transition: .4s; border-radius: 34px; border: 1px solid #444; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #aaa; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* --- MODAL & FORM --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #151520; border: 1px solid rgba(112, 0, 255, 0.3); width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; }
        
        label { display: block; color: var(--primary); margin: 15px 0 5px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        input, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 14px; border-radius: 10px; color: #fff; font-family: 'Poppins', sans-serif; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--grad-main); color: #fff; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 25px; }

        /* --- NAV --- */
        nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 35, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 10px 30px; display: flex; gap: 40px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 90; }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 15px var(--primary); }
        .fab-add { background: var(--grad-main); color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; margin-top: -40px; border: 5px solid var(--bg-deep); box-shadow: 0 0 25px rgba(112, 0, 255, 0.6); }

        /* --- LOADING & ERROR STATE --- */
        .status-msg { text-align: center; color: #888; padding: 40px; }
        .status-msg i { font-size: 2rem; margin-bottom: 15px; display: block; }
        .error-text { color: var(--accent); background: rgba(255, 0, 85, 0.1); padding: 10px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V5</div>
        <div style="font-size: 0.75rem; color: #aaa; font-weight: 600;">ADMIN PANEL</div>
    </header>

    <div class="container">
        
        <div id="tabDevices">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-users" style="color: var(--primary)"></i> User Database
            </h2>
            
            <div id="userList">
                <div class="glass-card status-msg">
                    <i class="fas fa-circle-notch fa-spin" style="color: var(--primary);"></i>
                    <div>Connecting to Database...</div>
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-sliders-h" style="color: var(--secondary)"></i> Configuration
            </h2>
            <div class="glass-card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl" placeholder="https://t.me/...">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout" placeholder="e.g. 1m, 30s">

                <div style="margin-top: 20px; display:flex; align-items:center; gap:10px;">
                    <label class="switch" style="margin:0;">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color:#fff; font-size:0.9rem;">Show Announcement Dialog</span>
                </div>

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3" placeholder="Enter message..."></textarea>

                <button class="btn-main" onclick="saveSettings()">Save Config</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #fff; margin: 0 0 20px; font-family: 'Orbitron', sans-serif;">USER DETAILS</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label>
            <input type="text" id="inpUser" placeholder="Username">

            <label>Password</label>
            <input type="text" id="inpPass" placeholder="Password">

            <label>Device ID</label>
            <input type="text" id="inpDevice" placeholder="Hardware ID">

            <label>Expiry Date</label>
            <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-main" style="background:#222; margin-top:0;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" style="margin-top:0;" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-user-shield"></i></div>
        <div class="fab-add" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-cog"></i></div>
    </nav>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIG (REST API)
        // ==========================================
        // Added .json to the end. This is REQUIRED for it to work.
        const BASE_URL = "https://awesome-6004e.firebaseio.com";
        const ENDPOINT = `${BASE_URL}/.json`;
        
        let dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
        let lastJsonString = "";
        let isModalOpen = false;

        // ==========================================
        // 2. LOGIC
        // ==========================================
        async function fetchData() {
            if(isModalOpen) return;

            try {
                const response = await fetch(ENDPOINT);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const val = await response.json();

                // If DB is empty, initialize it
                if (!val) {
                    renderUsers();
                    return;
                }

                const newJson = JSON.stringify(val);
                if (newJson === lastJsonString) return; // Prevent loop
                lastJsonString = newJson;

                // --- DATA NORMALIZATION ---
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";
                dbData.BannedDevices = val.BannedDevices || [];

                // Handle 'Users' as Object or Array
                let usersRaw = val.Users || [];
                if (typeof usersRaw === 'object' && !Array.isArray(usersRaw)) {
                    usersRaw = Object.values(usersRaw);
                }

                // Map 'ID' (from your screenshot) to 'DeviceID' (for panel logic)
                dbData.Users = usersRaw.map(u => ({
                    Username: u.Username || "User",
                    Password: u.Password || "---",
                    DeviceID: u.DeviceID || u.ID || "No_ID", 
                    Expiry: u.Expiry || ""
                }));

                renderUsers();
                fillSettings();

            } catch (error) {
                console.error(error);
                document.getElementById('userList').innerHTML = `
                <div class="glass-card status-msg">
                    <i class="fas fa-exclamation-triangle" style="color: var(--accent);"></i>
                    <div>Connection Failed</div>
                    <div class="error-text">${error.message}<br>Check Database Rules to be true</div>
                </div>`;
            }
        }

        // Poll every 3 seconds
        setInterval(fetchData, 3000);
        fetchData();

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (!dbData.Users || dbData.Users.length === 0) {
                list.innerHTML = `
                <div class="glass-card status-msg">
                    <i class="fas fa-folder-open"></i>
                    <div>Database is Empty</div>
                </div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);

                const div = document.createElement('div');
                div.className = `glass-card user-item ${isBanned ? 'banned' : ''}`;
                
                div.innerHTML = `
                    <div class="user-header">
                        <div class="user-info">
                            <h4>${u.Username}</h4>
                            <span class="device-id"><i class="fas fa-microchip"></i> ${u.DeviceID}</span>
                        </div>
                    </div>
                    
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <small style="color:#aaa;"><i class="fas fa-key"></i> ${u.Password}</small>
                        <small style="color:var(--primary);"><i class="far fa-clock"></i> ${u.Expiry}</small>
                    </div>
                    
                    <div class="action-row">
                        <div class="switch-container">
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                            <span class="switch-label">${isBanned ? 'Banned' : 'Active'}</span>
                        </div>
                        
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon btn-edit" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-delete" onclick="deleteUser(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- SAVE FUNCTIONS ---
        async function saveData(newData) {
            try {
                await fetch(ENDPOINT, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(newData)
                });
                lastJsonString = ""; 
                fetchData();
            } catch (e) { alert("Save Error: " + e); }
        }

        async function toggleBan(deviceID) {
            const index = dbData.BannedDevices.indexOf(deviceID);
            if (index > -1) dbData.BannedDevices.splice(index, 1);
            else dbData.BannedDevices.push(deviceID);
            
            // Optimistic Update
            renderUsers();
            await saveData(dbData);
        }

        async function saveUser() {
            const user = document.getElementById('inpUser').value;
            const pass = document.getElementById('inpPass').value;
            const device = document.getElementById('inpDevice').value;
            const dateVal = document.getElementById('inpExpiry').value;
            const index = document.getElementById('editIndex').value;

            if (!user || !device || !dateVal) return alert("Username, Device ID and Expiry required.");

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}/${month}/${year}`;

            // Create user object matching your requested structure
            const userObj = {
                Username: user,
                Password: pass,
                DeviceID: device, // For internal panel logic
                ID: device,       // For your App/Screenshot logic
                Expiry: formattedDate
            };

            let newList = [...dbData.Users];
            if (index !== "") newList[parseInt(index)] = userObj;
            else newList.push(userObj);

            dbData.Users = newList;
            await saveData(dbData);
            closeModal();
        }

        async function deleteUser(index) {
            if(confirm("Delete this user?")) {
                let newList = [...dbData.Users];
                newList.splice(index, 1);
                dbData.Users = newList;
                await saveData(dbData);
            }
        }

        async function saveSettings() {
            dbData.AdminUrl = document.getElementById('confAdminUrl').value;
            dbData.DialogTimeout = document.getElementById('confTimeout').value;
            dbData.ShowAnnouncement = document.getElementById('confShowAnnounce').checked;
            dbData.Announcement = document.getElementById('confAnnounceMsg').value;
            await saveData(dbData);
            alert("Settings Saved!");
        }

        // --- UI HELPERS ---
        function switchTab(tab) {
            document.getElementById('tabDevices').style.display = tab === 'Devices' ? 'block' : 'none';
            document.getElementById('tabSettings').style.display = tab === 'Settings' ? 'block' : 'none';
            document.getElementById('navDevices').classList.toggle('active', tab === 'Devices');
            document.getElementById('navSettings').classList.toggle('active', tab === 'Settings');
        }

        function fillSettings() {
            const adminInput = document.getElementById('confAdminUrl');
            if(document.activeElement !== adminInput) {
                adminInput.value = dbData.AdminUrl;
                document.getElementById('confTimeout').value = dbData.DialogTimeout;
                document.getElementById('confShowAnnounce').checked = dbData.ShowAnnouncement;
                document.getElementById('confAnnounceMsg').value = dbData.Announcement;
            }
        }

        function openModal(index = null) {
            isModalOpen = true;
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            
            const idxInput = document.getElementById('editIndex');
            
            if (index !== null) {
                const u = dbData.Users[index];
                idxInput.value = index;
                document.getElementById('inpUser').value = u.Username;
                document.getElementById('inpPass').value = u.Password;
                document.getElementById('inpDevice').value = u.DeviceID;
                const parts = u.Expiry.split('/'); 
                if(parts.length===3) document.getElementById('inpExpiry').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            } else {
                idxInput.value = "";
                document.getElementById('inpUser').value = "";
                document.getElementById('inpPass').value = "";
                document.getElementById('inpDevice').value = "";
            }
        }

        function closeModal() {
            isModalOpen = false;
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        // --- PARTICLES ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; 
                this.speedX = (Math.random() * 0.4) - 0.2; this.speedY = (Math.random() * 0.4) - 0.2;
                this.color = Math.random() > 0.5 ? '#7000ff' : '#00e5ff';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function initParticles() { particlesArray = []; for (let i=0; i<50; i++) particlesArray.push(new Particle()); }
        function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particlesArray.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initParticles(); });
        initParticles(); animateParticles();
    </script>
</body>
</html>
