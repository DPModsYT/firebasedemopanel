<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods Admin V9 (Stable)</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME --- */
        :root {
            --bg-body: #050508;
            --bg-card: #0f0f16;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --danger: #ff0055;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #00ff9d; border-radius: 50%; box-shadow: 0 0 10px #00ff9d; }
        .status-dot.error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        /* --- CONTAINER --- */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* --- SEARCH & CHIPS --- */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        .search-input { width: 100%; background: #12121a; border: 1px solid #333; padding: 15px 15px 15px 45px; border-radius: 12px; color: white; outline: none; }
        .search-input:focus { border-color: var(--primary); }

        .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .chip { padding: 6px 16px; background: #1a1a24; border-radius: 20px; font-size: 0.8rem; color: #888; border: 1px solid #333; white-space: nowrap; }
        .chip.active { background: var(--primary); color: #000; font-weight: 600; border-color: var(--primary); }

        /* --- CARDS --- */
        .card { background: #101018; border: 1px solid #222; border-radius: 16px; padding: 18px; margin-bottom: 15px; position: relative; }
        .card.active { border-left: 3px solid #00ff9d; }
        .card.banned { border-left: 3px solid #ff0055; }
        .card.expired { border-left: 3px solid #ffb700; }
        .card.noid { border-left: 3px solid #555; }

        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .u-name { font-weight: 700; font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; }
        .u-id { font-size: 0.75rem; color: var(--primary); font-family: monospace; }
        
        .info-row { background: #08080c; padding: 8px; border-radius: 8px; font-size: 0.8rem; color: #aaa; margin-bottom: 12px; display: flex; gap: 15px; }
        
        .actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222; padding-top: 10px; }
        .status-text { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        /* --- BUTTONS --- */
        .btn-icon { width: 32px; height: 32px; background: #222; border-radius: 8px; color: white; border: none; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
        
        /* --- SWITCH --- */
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background: var(--danger); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- NAV & MODAL --- */
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #151520; border: 1px solid #333; padding: 0 30px; height: 60px; border-radius: 50px; display: flex; align-items: center; justify-content: space-between; width: 85%; max-width: 350px; z-index: 99; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-item { color: #555; font-size: 1.2rem; }
        .nav-item.active { color: var(--primary); }
        
        .fab { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #000; position: absolute; left: 50%; top: -20px; transform: translateX(-50%); border: 4px solid var(--bg-body); cursor: pointer; }

        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1a1a24; width: 80%; max-width: 300px; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .inp { width: 100%; background: #0a0a10; border: 1px solid #333; padding: 10px; color: white; border-radius: 8px; margin-bottom: 10px; }
        .btn-main { width: 100%; padding: 12px; background: var(--primary); border: none; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }

        .hidden { display: none !important; }
        
        /* DEBUG TEXT */
        #debug-log { font-family: monospace; font-size: 10px; color: #555; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><div id="statusDot" class="status-dot"></div> DPMODS V9</div>
    </header>

    <div class="container">
        <div id="loader" style="text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            <p style="color: #666; margin-top: 10px;">Connecting...</p>
        </div>

        <div id="errorMsg" class="hidden" style="background: rgba(255,0,85,0.1); border: 1px solid var(--danger); padding: 15px; border-radius: 10px; text-align: center; color: var(--danger);">
            <i class="fas fa-wifi"></i><br>Connection Failed<br>
            <small id="errorDetail">Check URL or Internet</small>
            <button onclick="window.location.reload()" style="background: #333; color: white; border: none; padding: 5px 10px; margin-top: 10px; border-radius: 5px;">Retry</button>
        </div>

        <div id="contentArea" class="hidden">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search" class="search-input" placeholder="Search..." onkeyup="render()">
            </div>

            <div class="chips">
                <div class="chip active" onclick="setFilter('all', this)">All</div>
                <div class="chip" onclick="setFilter('active', this)">Active</div>
                <div class="chip" onclick="setFilter('banned', this)">Banned</div>
            </div>

            <div id="list"></div>
        </div>

        <div id="settingsArea" class="hidden">
            <h3 style="color:white">Config</h3>
            <div class="card">
                <label style="font-size:0.8rem; color:var(--primary);">Firebase URL</label>
                <input type="text" class="inp" id="confUrl">
                <label style="font-size:0.8rem; color:var(--primary);">Timeout</label>
                <input type="text" class="inp" id="confTime">
                <button class="btn-main" onclick="saveSettings()">Save</button>
            </div>
        </div>

        <div id="debug-log">System Ready</div>
    </div>

    <div id="modal" class="modal-wrap">
        <div class="modal-box">
            <h3 style="margin-top:0; color:white;">User</h3>
            <input type="hidden" id="editIdx">
            <input type="text" class="inp" id="uName" placeholder="Username">
            <input type="text" class="inp" id="uPass" placeholder="Password">
            <input type="text" class="inp" id="uDev" placeholder="Device ID">
            <input type="date" class="inp" id="uExp">
            <button class="btn-main" onclick="saveUser()">Save</button>
            <button class="btn-main" style="background:#333; color:white;" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fas fa-home"></i></div>
        <div class="fab" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        // --- 1. CONFIG & STATE ---
        // DEFAULT URL (Change this if needed, but this one is from your file)
        const DEFAULT_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        let localData = { users: [], banned: [] };
        let currentFilter = 'all';

        // --- 2. ROBUST DATA FETCHING ---
        async function fetchData() {
            log("Fetching...");
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusDot').classList.remove('error');

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5s Timeout

                const response = await fetch(dbUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                processData(data); // Parse whatever we get
                
                // Success: Show Content
                document.getElementById('loader').style.display = 'none';
                document.getElementById('contentArea').classList.remove('hidden');
                document.getElementById('errorMsg').classList.add('hidden');
                log("Sync Complete");

            } catch (error) {
                console.error(error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('contentArea').classList.add('hidden');
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('errorDetail').innerText = error.message;
                document.getElementById('statusDot').classList.add('error');
                log("Error: " + error.message);
            }
        }

        // --- 3. BULLETPROOF PARSING (Fixes the Array Issue) ---
        function processData(data) {
            if (!data) {
                localData.users = [];
                localData.banned = [];
                return;
            }

            // 1. Fix Banned Devices (Ensure Array)
            let bans = data.BannedDevices;
            if (bans) {
                // If it's an object {id1: "val", id2: "val"}, convert to array ["val", "val"]
                if (typeof bans === 'object' && !Array.isArray(bans)) bans = Object.values(bans);
                // Filter out nulls
                localData.banned = bans.filter(item => item != null);
            } else {
                localData.banned = [];
            }

            // 2. Fix Users (Ensure Array)
            let users = data.Users;
            if (users) {
                // If it's an object {key1: {User...}, key2: {User...}}, convert to Array
                if (typeof users === 'object' && !Array.isArray(users)) users = Object.values(users);
                
                // Map cleanly
                localData.users = users.map(u => ({
                    username: u.Username || u.name || "Unknown",
                    password: u.Password || u.pass || "---",
                    deviceID: u.DeviceID || u.ID || u.id || "",
                    expiry: u.Expiry || u.expiry || ""
                }));
            } else {
                localData.users = [];
            }

            // Update Inputs in Settings
            document.getElementById('confUrl').value = dbUrl;
            
            render();
        }

        // --- 4. RENDER UI ---
        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const search = document.getElementById('search').value.toLowerCase();

            localData.users.forEach((u, index) => {
                // Determine Status
                const isBanned = localData.banned.includes(u.deviceID);
                const hasID = u.deviceID && u.deviceID.length > 2;
                
                // Filter Logic
                if (currentFilter === 'banned' && !isBanned) return;
                if (currentFilter === 'active' && (isBanned || !hasID)) return;
                
                // Search Logic
                if (search && !u.username.toLowerCase().includes(search)) return;

                // Styling Classes
                let cardClass = 'active';
                let statusTxt = 'ACTIVE';
                let statusColor = '#00ff9d';

                if (isBanned) { cardClass = 'banned'; statusTxt = 'BANNED'; statusColor = '#ff0055'; }
                else if (!hasID) { cardClass = 'noid'; statusTxt = 'NO ID'; statusColor = '#555'; }

                const html = `
                <div class="card ${cardClass}">
                    <div class="user-row">
                        <div>
                            <div class="u-name">${u.username}</div>
                            <div class="u-id">${u.deviceID || "Waiting..."}</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.deviceID}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="info-row">
                        <span><i class="fas fa-key"></i> ${u.password}</span>
                        <span><i class="fas fa-clock"></i> ${u.expiry}</span>
                    </div>

                    <div class="actions">
                        <span class="status-text" style="color:${statusColor}">${statusTxt}</span>
                        <div style="display:flex">
                            <button class="btn-icon" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon" onclick="delUser(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
                list.innerHTML += html;
            });

            if (list.innerHTML === "") list.innerHTML = "<div style='text-align:center; color:#555; margin-top:20px;'>No Users Found</div>";
        }

        // --- 5. ACTIONS ---
        async function saveData() {
            log("Saving...");
            // Convert back to Firebase Structure
            const payload = {
                BannedDevices: localData.banned,
                Users: localData.users.map(u => ({
                    Username: u.username,
                    Password: u.password,
                    DeviceID: u.deviceID,
                    ID: u.deviceID, // Backwards compatibility
                    Expiry: u.expiry
                }))
            };

            try {
                await fetch(dbUrl, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                fetchData(); // Refresh on success
            } catch (e) {
                alert("Save Failed: " + e.message);
            }
        }

        function toggleBan(id) {
            if(!id) return alert("No Device ID");
            const idx = localData.banned.indexOf(id);
            if(idx > -1) localData.banned.splice(idx, 1);
            else localData.banned.push(id);
            saveData();
        }

        function delUser(idx) {
            if(confirm("Delete User?")) {
                localData.users.splice(idx, 1);
                saveData();
            }
        }

        function saveUser() {
            const idx = document.getElementById('editIdx').value;
            const u = {
                username: document.getElementById('uName').value,
                password: document.getElementById('uPass').value,
                deviceID: document.getElementById('uDev').value,
                expiry: formatDate(document.getElementById('uExp').value)
            };

            if(!u.username) return alert("Username Required");

            if(idx !== "") localData.users[idx] = u;
            else localData.users.push(u);

            document.getElementById('modal').style.display = 'none';
            saveData();
        }

        function saveSettings() {
            const newUrl = document.getElementById('confUrl').value;
            if(newUrl) {
                dbUrl = newUrl;
                localStorage.setItem("dbUrl", newUrl);
                fetchData();
                alert("URL Saved");
            }
        }

        // --- 6. UTILS ---
        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function switchTab(t) {
            const home = document.getElementById('contentArea');
            const sett = document.getElementById('settingsArea');
            if(t === 'home') { home.classList.remove('hidden'); sett.classList.add('hidden'); }
            else { home.classList.add('hidden'); sett.classList.remove('hidden'); }
        }

        function openModal(idx = null) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('editIdx').value = "";
            document.getElementById('uName').value = "";
            document.getElementById('uPass').value = "";
            document.getElementById('uDev').value = "";
            document.getElementById('uExp').value = "";

            if(idx !== null) {
                const u = localData.users[idx];
                document.getElementById('editIdx').value = idx;
                document.getElementById('uName').value = u.username;
                document.getElementById('uPass').value = u.password;
                document.getElementById('uDev').value = u.deviceID;
                // Parse date for input (DD/MM/YYYY -> YYYY-MM-DD)
                if(u.expiry.includes('/')) {
                    const [d,m,y] = u.expiry.split('/');
                    document.getElementById('uExp').value = `${y}-${m}-${d}`;
                }
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return "";
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function log(msg) {
            document.getElementById('debug-log').innerText = msg;
            console.log(msg);
        }

        // Init
        fetchData();
        // Auto-refresh every 10s
        setInterval(() => {
            if(document.getElementById('modal').style.display === 'none') fetchData();
        }, 10000);

    </script>
</body>
</html>
