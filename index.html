<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods V12 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;
            --text-main: #ffffff;
            --glass-bg: rgba(20, 20, 35, 0.95);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --grad-main: linear-gradient(135deg, #7000ff 0%, #00e5ff 100%);
            --nav-height: 80px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 20px);
            overflow-x: hidden;
        }

        /* --- PARTICLES --- */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: rgba(10, 10, 20, 0.95);
            border-bottom: var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .status-dot { height: 8px; width: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .container { max-width: 700px; margin: 0 auto; padding: 15px; }

        /* --- SEARCH & FILTER --- */
        .search-container { position: relative; margin-bottom: 15px; }
        .search-box {
            width: 100%; background: rgba(255,255,255,0.05); border: var(--glass-border);
            padding: 14px 14px 14px 45px; border-radius: 12px; color: white;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }

        .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; scrollbar-width: none; }
        .filter-chip {
            white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem;
            background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #aaa; cursor: pointer; transition: 0.3s;
        }
        .filter-chip.active { background: rgba(0, 229, 255, 0.15); border-color: var(--primary); color: var(--primary); font-weight: 600; }
        .filter-chip.banned-filter.active { background: rgba(255, 0, 85, 0.15); border-color: var(--accent); color: var(--accent); }

        /* --- CARDS --- */
        .card {
            background: var(--glass-bg); border: var(--glass-border); border-radius: 16px;
            padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden;
            transition: transform 0.2s;
        }
        
        .user-item { border-left: 3px solid var(--primary); }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.9; }
        
        .user-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .user-name { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff; }
        .user-device { font-family: monospace; font-size: 0.8rem; color: var(--primary); margin-top: 2px; display: block; opacity: 0.8; word-break: break-all; }
        .user-item.banned .user-device { color: var(--accent); text-decoration: line-through; }
        
        .badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .badge { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 5px; font-size: 0.75rem; color: #ccc; display: flex; align-items: center; gap: 5px; }

        /* --- CONTROLS --- */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        .btn-icon { width: 36px; height: 36px; border-radius: 8px; border: none; cursor: pointer; background: rgba(255,255,255,0.08); color: #fff; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-edit:hover { background: var(--primary); color: #000; } 
        .btn-del:hover { background: var(--accent); color: #fff; }

        /* --- SWITCH --- */
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a2a35; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 4px; bottom: 4px; background-color: #888; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); background-color: #fff; }

        /* --- NAV & FAB (Mobile Optimized) --- */
        nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(15, 15, 25, 0.95); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 99; backdrop-filter: blur(10px);
            padding: 0 40px;
        }
        .nav-item { color: #666; font-size: 1.5rem; cursor: pointer; transition: 0.3s; width: 50px; text-align: center; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 10px var(--primary); }

        .fab-wrapper { 
            position: absolute; left: 50%; top: -30px; transform: translateX(-50%);
            width: 70px; height: 70px;
        }
        .fab-btn {
            width: 100%; height: 100%; border-radius: 50%;
            background: var(--grad-main); border: 5px solid var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff; cursor: pointer;
            box-shadow: 0 0 25px rgba(112, 0, 255, 0.6);
            transition: 0.3s;
        }
        .fab-btn:active { transform: scale(0.9); }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #151520; border: 1px solid rgba(112, 0, 255, 0.3); width: 90%; max-width: 380px; padding: 25px; border-radius: 20px; }
        
        label { font-size: 0.75rem; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; display: block; }
        input, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 12px; color: white; border-radius: 8px; font-family: monospace; margin-bottom: 15px; }
        
        .tool-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-tool {
            flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333;
            background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s;
        }
        .btn-tool:hover { background: var(--secondary); color: white; border-color: var(--secondary); }
        .btn-main { width: 100%; padding: 14px; background: var(--grad-main); border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 1rem; }

        /* --- ERROR BOX --- */
        #errorBox {
            display: none; background: rgba(255, 0, 85, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 15px; border-radius: 10px; margin-top: 20px;
            font-size: 0.8rem; font-family: monospace; word-break: break-all;
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V12</div>
        <div style="font-size: 0.7rem; color: #666; font-weight: bold;">ADMIN</div>
    </header>

    <div class="container">
        
        <div id="tabDevices">
            <h2 style="color: white; margin-bottom: 15px; font-size: 1.2rem;">User Database</h2>
            
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-box" placeholder="Search username, ID..." onkeyup="filterUsers()">
            </div>

            <div class="filter-row">
                <div class="filter-chip active" onclick="setFilter('all', this)">All</div>
                <div class="filter-chip" onclick="setFilter('active', this)">Active</div>
                <div class="filter-chip banned-filter" onclick="setFilter('banned', this)">Banned</div>
                <div class="filter-chip" onclick="setFilter('nodevice', this)">No Device</div>
            </div>

            <div id="loadingState" style="text-align: center; padding: 40px; color: #666;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                <div id="loadingText">Connecting to Firebase...</div>
                <div id="errorBox"></div>
                <button onclick="fetchData()" style="margin-top: 15px; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 6px;">Retry Connection</button>
            </div>

            <div id="userList"></div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="color: white; margin-bottom: 15px; font-size: 1.2rem;">System Config</h2>
            <div class="card">
                <label>Admin Contact URL</label> <input type="text" id="confAdminUrl">
                <label>Dialog Timeout</label> <input type="text" id="confTimeout">
                <label>Announcement</label> <textarea id="confAnnounceMsg" rows="3"></textarea>
                
                <div style="display: flex; align-items: center; margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <label class="switch" style="margin: 0 10px 0 0;">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color: white; font-size: 0.9rem;">Show Announcement Dialog</span>
                </div>

                <button class="btn-main" onclick="saveSettings()" style="margin-top: 20px;">Update Config</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: white; margin: 0 0 15px;">Manage Access</h3>
            <input type="hidden" id="editIndex">
            
            <div class="tool-row">
                <button class="btn-tool" onclick="generateRandom()"><i class="fas fa-dice"></i> Random</button>
                <button class="btn-tool" onclick="copyUserToPass()"><i class="fas fa-copy"></i> Same Pass</button>
            </div>

            <label>Username</label> <input type="text" id="inpUser" placeholder="Enter Username">
            <label>Password</label> <input type="text" id="inpPass" placeholder="Enter Password">
            <label>Device ID</label> <input type="text" id="inpDevice" placeholder="Hardware ID (Optional)">
            <label>Expiry Date</label> <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-main" style="background: #222;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-users"></i></div>
        <div class="fab-wrapper" onclick="openModal()"><div class="fab-btn"><i class="fas fa-plus"></i></div></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-sliders-h"></i></div>
    </nav>

    <script>
        const API_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        let dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
        let isModalOpen = false;
        let currentFilter = 'all';

        // --- ROBUST FETCH ---
        async function fetchData() {
            if(isModalOpen) return;
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const val = await res.json();
                
                // If DB is empty or null, initialize defaults
                if(!val) {
                    console.log("DB is empty");
                    document.getElementById('loadingState').style.display = 'none';
                    renderUI(); 
                    return; 
                }

                // --- DATA SANITIZATION (THE FIX) ---
                // Force everything to be valid arrays, handling Firebase Objects
                
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";

                // Fix BannedDevices: Convert Object {"0":"id"} to Array ["id"]
                let bans = val.BannedDevices || [];
                if(typeof bans === 'object' && !Array.isArray(bans)) bans = Object.values(bans);
                dbData.BannedDevices = bans.filter(x => x != null && x !== ""); // Remove nulls/empties

                // Fix Users: Convert Object {"0":{...}} to Array [{...}]
                let users = val.Users || [];
                if(typeof users === 'object' && !Array.isArray(users)) users = Object.values(users);
                
                // Map Users safely (Handle missing fields)
                dbData.Users = users.map(u => ({
                    Username: u.Username || "Unknown",
                    Password: u.Password || "---",
                    DeviceID: u.DeviceID || u.ID || "", // Handle empty ID
                    Expiry: u.Expiry || ""
                }));

                document.getElementById('loadingState').style.display = 'none';
                renderUI();

            } catch (e) { 
                console.error(e); 
                document.getElementById('loadingText').innerText = "Connection Failed";
                const errBox = document.getElementById('errorBox');
                errBox.style.display = 'block';
                errBox.innerText = e.message + "\nCheck Internet & Database Rules";
            }
        }

        setInterval(fetchData, 4000); // Poll every 4s
        fetchData(); // Initial load

        // --- RENDER ---
        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderUI();
        }

        function filterUsers() { renderUI(); }

        function renderUI() {
            const list = document.getElementById('userList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = "";

            // Fill Settings inputs
            if(document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                document.getElementById('confAdminUrl').value = dbData.AdminUrl;
                document.getElementById('confTimeout').value = dbData.DialogTimeout;
                document.getElementById('confShowAnnounce').checked = dbData.ShowAnnouncement;
                document.getElementById('confAnnounceMsg').value = dbData.Announcement;
            }

            // Filtering
            let filtered = dbData.Users.filter(u => {
                const id = u.DeviceID ? u.DeviceID.toLowerCase() : "";
                const name = u.Username ? u.Username.toLowerCase() : "";
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);
                const hasDevice = u.DeviceID && u.DeviceID !== "";
                
                if(!name.includes(search) && !id.includes(search)) return false;

                if(currentFilter === 'active') return !isBanned && hasDevice;
                if(currentFilter === 'banned') return isBanned;
                if(currentFilter === 'nodevice') return !hasDevice;
                return true;
            });

            if(filtered.length === 0) {
                list.innerHTML = `<div class="card" style="text-align:center; color:#666;">No matching users found.</div>`;
                return;
            }

            filtered.forEach((u) => {
                const originalIdx = dbData.Users.indexOf(u);
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);
                const displayID = u.DeviceID ? u.DeviceID : "NO DEVICE ID";
                
                const html = `
                <div class="card user-item ${isBanned ? 'banned' : ''}">
                    <div class="user-top">
                        <div>
                            <div class="user-name">${u.Username}</div>
                            <span class="user-device">${displayID}</span>
                        </div>
                        <div>
                             <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="badges">
                        <span class="badge"><i class="fas fa-key"></i> ${u.Password}</span>
                        <span class="badge"><i class="far fa-clock"></i> ${u.Expiry}</span>
                    </div>

                    <div class="controls">
                        <span style="font-size:0.7rem; color:#666; font-weight:bold;">${isBanned ? 'BANNED' : 'ACTIVE'}</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon btn-edit" onclick="openModal(${originalIdx})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-del" onclick="deleteUser(${originalIdx})"><i class="fas fa-tr
