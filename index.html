<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods Ultimate Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-deep: #050505;
            --primary: #00f2ff; /* Cyan Neon */
            --primary-dim: rgba(0, 242, 255, 0.1);
            --secondary: #7000ff; /* Purple Neon */
            --danger: #ff0055;
            --success: #00ff99;
            --glass-bg: rgba(20, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 100px; /* Space for Nav */
        }

        /* --- PARTICLE BACKGROUND CANVAS --- */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        
        /* --- LAYOUT CONTAINER --- */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 50;
        }
        
        .logo { font-size: 1.2rem; color: var(--text-main); text-shadow: 0 0 10px var(--primary); display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.5; transform: scale(0.9); } }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, border-color 0.3s ease;
            animation: slideUp 0.5s ease forwards;
        }
        
        .glass-card:hover { border-color: var(--primary-dim); transform: translateY(-2px); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- USER LIST ITEMS --- */
        .user-item {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .user-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--primary); box-shadow: 0 0 10px var(--primary);
        }
        .user-item.expired::before { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        .user-details h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; }
        .user-details p { margin: 5px 0 0; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .badge-active { background: rgba(0, 255, 153, 0.15); color: var(--success); border: 1px solid rgba(0, 255, 153, 0.3); }
        .badge-expired { background: rgba(255, 0, 85, 0.15); color: var(--danger); border: 1px solid rgba(255, 0, 85, 0.3); }

        /* --- BUTTONS & ACTIONS --- */
        .action-group { display: flex; gap: 10px; }
        
        .btn-icon {
            width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-edit { background: rgba(0, 242, 255, 0.1); color: var(--primary); }
        .btn-edit:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .btn-delete { background: rgba(255, 0, 85, 0.1); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: #fff; box-shadow: 0 0 15px var(--danger); }

        /* --- FORMS --- */
        label { display: block; color: var(--primary); margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.5px; }
        
        input, textarea {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            padding: 14px; border-radius: 8px; color: #fff; font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px var(--primary-dim); }

        .btn-main {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #fff; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4); }

        /* --- BOTTOM NAV --- */
        nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 10px 30px;
            display: flex; gap: 30px; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }
        
        .nav-item {
            color: var(--text-muted); font-size: 1.4rem; cursor: pointer; position: relative;
            transition: 0.3s; display: flex; flex-direction: column; align-items: center;
        }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }
        .nav-item.active::after {
            content: ''; width: 5px; height: 5px; background: var(--primary);
            border-radius: 50%; position: absolute; bottom: -8px; box-shadow: 0 0 8px var(--primary);
        }
        
        .fab-add {
            background: var(--primary); color: #000; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 20px var(--primary);
            transition: 0.3s; margin: 0 10px;
        }
        .fab-add:hover { transform: scale(1.1) rotate(90deg); }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 200; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #12121a; border: 1px solid var(--glass-border);
            width: 90%; max-width: 400px; padding: 25px; border-radius: 20px;
            position: relative; animation: zoomIn 0.3s ease;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- DATE SHORTCUTS --- */
        .shortcuts { display: flex; gap: 8px; margin-bottom: 10px; }
        .chip {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; color: #fff; cursor: pointer; transition: 0.2s;
        }
        .chip:hover { background: var(--primary); color: #000; }

    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo">
            <span class="status-dot"></span>
            DPMODS PANEL
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace;">V3.0</div>
    </header>

    <div class="container">
        <div id="tabDevices">
            <h2 style="margin-bottom: 20px; text-shadow: 0 0 15px var(--primary);">Active Users</h2>
            <div id="userList">
                <div class="glass-card" style="text-align: center; padding: 40px;">
                    <i class="fas fa-satellite-dish fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                    <p>Connecting to Satellite...</p>
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="margin-bottom: 20px; color: var(--secondary); text-shadow: 0 0 15px var(--secondary);">System Config</h2>
            <div class="glass-card">
                <label><i class="fab fa-telegram-plane"></i> Admin Contact URL</label>
                <input type="text" id="confAdminUrl" placeholder="https://t.me/yourname">
                
                <label style="margin-top: 15px;"><i class="fas fa-bullhorn"></i> Marquee Message</label>
                <textarea id="confMarquee" rows="4" placeholder="Enter the scrolling text displayed in the app..."></textarea>
                
                <button class="btn-main" onclick="saveGlobalSettings()">Update Cloud Config</button>
            </div>
        </div>
        
        <div id="tabGuide" style="display: none;">
            <h2 style="margin-bottom: 20px;">Setup Guide</h2>
            <div class="glass-card">
                <p><strong>Current Database:</strong></p>
                <code style="background: rgba(0,0,0,0.5); padding: 5px; color: var(--success); display:block; margin-bottom: 15px; word-break: break-all;">https://awesome-6004e.firebaseio.com</code>
                <p style="font-size: 0.9rem; color: #aaa;">If you need to change this, edit the <code>DATABASE_URL</code> variable inside the HTML file using a text editor.</p>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--primary); margin-bottom: 20px;">Add New Access</h3>
            <input type="hidden" id="editIndex">
            
            <label>Device ID / Key</label>
            <input type="text" id="inpID" placeholder="Enter Unique ID">
            
            <label style="margin-top: 15px;">Expiry Date</label>
            <div class="shortcuts">
                <div class="chip" onclick="setExpiry(30)">+30 Days</div>
                <div class="chip" onclick="setExpiry(90)">+3 Mos</div>
                <div class="chip" onclick="setExpiry(365)">+1 Year</div>
            </div>
            <input type="date" id="inpExpiry">
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-main" style="background: #333;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" onclick="saveUser()">Save Access</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices">
            <i class="fas fa-microchip"></i>
        </div>
        <div class="fab-add" onclick="openModal()">
            <i class="fas fa-plus"></i>
        </div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings">
            <i class="fas fa-sliders-h"></i>
        </div>
        <div class="nav-item" onclick="switchTab('Guide')" id="navGuide">
            <i class="fas fa-book-open"></i>
        </div>
    </nav>

    <script>
        // ==========================================
        // 1. PARTICLE SYSTEM (Background Animation)
        // ==========================================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
                this.color = 'rgba(0, 242, 255, ' + Math.random() * 0.5 + ')'; // Cyan particles
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 80; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        initParticles();
        animateParticles();

        // ==========================================
        // 2. FIREBASE LOGIC (REST API)
        // ==========================================
        
        // !!! IMPORTANT: THIS IS YOUR LINK !!!
        const DATABASE_URL = "https://awesome-6004e.firebaseio.com"; 

        let dbData = { Users: [], AdminUrl: "", Marquee: "" };

        async function fetchData() {
            try {
                // Fetching JSON data
                const response = await fetch(`${DATABASE_URL}/.json`);
                if (!response.ok) throw new Error("Connection Error");
                const val = await response.json();

                if (val) {
                    let usersList = val.Users || [];
                    if (typeof usersList === 'object' && !Array.isArray(usersList)) {
                        usersList = Object.values(usersList);
                    }

                    dbData = {
                        Users: usersList,
                        AdminUrl: val.AdminUrl || "",
                        Marquee: val.Marquee || ""
                    };
                    renderUsers();
                    fillSettings();
                } else {
                    document.getElementById('userList').innerHTML = 
                        `<div class="glass-card" style="text-align:center; color:#aaa;">Database is empty. Add a user +</div>`;
                }
            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        // Auto-refresh every 2 seconds
        setInterval(fetchData, 2000);
        fetchData(); 

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (dbData.Users.length === 0) {
                list.innerHTML = `<div class="glass-card" style="text-align:center; color:#aaa;">No users found.</div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                // Date Check Logic
                const parts = u.Expiry.split('/'); 
                let isExpired = false;
                if(parts.length === 3) {
                    const isoDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    isExpired = new Date(isoDate) < new Date(new Date().setHours(0,0,0,0));
                }

                const div = document.createElement('div');
                div.className = `glass-card user-item ${isExpired ? 'expired' : ''}`;
                
                div.innerHTML = `
                    <div class="user-details">
                        <h4>${u.ID}</h4>
                        <p>
                            <span class="badge ${isExpired ? 'badge-expired' : 'badge-active'}">
                                ${isExpired ? 'EXPIRED' : 'ACTIVE'}
                            </span>
                            <i class="far fa-calendar-alt"></i> ${u.Expiry}
                        </p>
                    </div>
                    <div class="action-group">
                        <button class="btn-icon btn-edit" onclick="openModal(${index})">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="btn-icon btn-delete" onclick="deleteUser(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function saveData(path, data) {
            try {
                await fetch(`${DATABASE_URL}/${path}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
                // Optimistic UI update or wait for fetch loop
            } catch (e) {
                alert("Save Failed: " + e.message);
            }
        }

        async function updateSettings(data) {
             try {
                await fetch(`${DATABASE_URL}/.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(data)
                });
                alert("✅ Cloud Config Updated!");
                fetchData();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        // ==========================================
        // 3. UI INTERACTION
        // ==========================================

        function switchTab(tabName) {
            ['Devices', 'Settings', 'Guide'].forEach(t => {
                document.getElementById('tab' + t).style.display = 'none';
                document.getElementById('nav' + t).classList.remove('active');
            });
            document.getElementById('tab' + tabName).style.display = 'block';
            document.getElementById('nav' + tabName).classList.add('active');
        }

        function fillSettings() {
            const adminInput = document.getElementById('confAdminUrl');
            const marqInput = document.getElementById('confMarquee');
            if(document.activeElement !== adminInput) adminInput.value = dbData.AdminUrl;
            if(document.activeElement !== marqInput) marqInput.value = dbData.Marquee;
        }

        function saveGlobalSettings() {
            const newUrl = document.getElementById('confAdminUrl').value;
            const newMarq = document.getElementById('confMarquee').value;
            updateSettings({ AdminUrl: newUrl, Marquee: newMarq });
        }

        function openModal(index = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const idxInput = document.getElementById('editIndex');
            const idInput = document.getElementById('inpID');
            const dateInput = document.getElementById('inpExpiry');

            modal.style.display = 'flex';

            if (index !== null) {
                const u = dbData.Users[index];
                title.innerText = "Edit Access";
                idxInput.value = index;
                idInput.value = u.ID;
                
                // Convert DD/MM/YYYY to YYYY-MM-DD
                const parts = u.Expiry.split('/');
                if(parts.length === 3) dateInput.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            } else {
                title.innerText = "Add New Access";
                idxInput.value = "";
                idInput.value = "";
                setExpiry(30);
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function setExpiry(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            document.getElementById('inpExpiry').value = d.toISOString().split('T')[0];
        }

        function saveUser() {
            const id = document.getElementById('inpID').value;
            const dateVal = document.getElementById('inpExpiry').value;
            const index = document.getElementById('editIndex').value;

            if (!id || !dateVal) return alert("Please fill all fields");

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}/${month}/${year}`;

            const newUser = { ID: id, Expiry: formattedDate };
            let newUsersList = [...dbData.Users];

            if (index !== "") {
                newUsersList[parseInt(index)] = newUser;
            } else {
                newUsersList.push(newUser);
            }

            saveData('Users', newUsersList).then(() => {
                closeModal();
                fetchData();
            });
        }

        function deleteUser(index) {
            if(confirm("Confirm deletion of this user?")) {
                let newUsersList = [...dbData.Users];
                newUsersList.splice(index, 1);
                saveData('Users', newUsersList).then(() => fetchData());
            }
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
