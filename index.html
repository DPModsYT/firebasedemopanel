<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods V9 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #050508;
            --bg-card: #0f0f16;
            --primary: #00e5ff; 
            --primary-dark: #00b8cc;
            --primary-glow: rgba(0, 229, 255, 0.25);
            --secondary: #7000ff; 
            --danger: #ff0055;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse-red {
            0% { border-left-color: var(--danger); box-shadow: -2px 0 10px rgba(255, 0, 85, 0.2); }
            50% { border-left-color: #ff4d88; box-shadow: -2px 0 20px rgba(255, 0, 85, 0.5); }
            100% { border-left-color: var(--danger); box-shadow: -2px 0 10px rgba(255, 0, 85, 0.2); }
        }

        /* --- HEADER --- */
        header {
            padding: 18px 20px;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 12px; letter-spacing: 1px; }
        .status-dot { width: 8px; height: 8px; background: #00ff9d; border-radius: 50%; box-shadow: 0 0 12px #00ff9d; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* --- SEARCH & CHIPS --- */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666; font-size: 1.1rem; }
        .search-input { width: 100%; background: #12121a; border: 1px solid #333; padding: 16px 16px 16px 50px; border-radius: 16px; color: white; font-family: 'Poppins', sans-serif; font-size: 0.95rem; transition: 0.3s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }

        .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 25px; scrollbar-width: none; }
        .chip { padding: 8px 20px; background: #161620; border-radius: 50px; font-size: 0.85rem; color: #888; border: 1px solid #2a2a35; white-space: nowrap; transition: 0.3s; font-weight: 500; }
        .chip.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); font-weight: 600; }

        /* --- CARDS --- */
        .card { background: var(--bg-card); border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 16px; position: relative; transition: transform 0.2s; overflow: hidden; }
        .card:active { transform: scale(0.99); }
        
        /* STATUS INDICATORS */
        .card.active { border-left: 4px solid var(--primary); }
        .card.banned { border-left: 4px solid var(--danger); animation: pulse-red 2s infinite; }
        .card.noid { border-left: 4px solid #555; }
        .card.expired { border-left: 4px solid #ffb700; }

        .user-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .u-name { font-weight: 700; font-size: 1.3rem; font-family: 'Rajdhani', sans-serif; color: #fff; }
        .u-status { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .info-box { background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 12px; font-size: 0.9rem; color: #ccc; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .u-dev { font-family: monospace; font-size: 0.8rem; color: #666; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .u-dev.linked { color: var(--primary); }

        .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }

        /* --- ACTION BUTTONS --- */
        .btn-icon { width: 42px; height: 42px; background: rgba(255,255,255,0.05); border-radius: 12px; color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); }
        .btn-del:hover { background: rgba(255, 0, 85, 0.2); color: var(--danger); }
        .btn-copy:hover { background: rgba(0, 229, 255, 0.2); color: var(--primary); }

        /* --- SWITCH --- */
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background: var(--danger); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- NAV BAR --- */
        .nav-bar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #161621; border: 1px solid rgba(255,255,255,0.1); 
            padding: 0 30px; height: 75px; border-radius: 60px; 
            display: flex; align-items: center; justify-content: space-between; 
            width: 90%; max-width: 400px; z-index: 99; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); 
        }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
        
        .fab { 
            width: 65px; height: 65px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; color: #000; 
            position: absolute; left: 50%; top: -30px; transform: translateX(-50%); 
            border: 6px solid var(--bg-body); cursor: pointer; 
            box-shadow: 0 0 25px var(--primary-glow); 
        }
        .fab:active { transform: translateX(-50%) scale(0.95); }

        /* --- MODAL --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1a1a24; width: 85%; max-width: 360px; padding: 25px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.5rem; margin: 0; color: white; }

        .tool-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-tool { 
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--primary); 
            background: rgba(0, 229, 255, 0.05); color: var(--primary); font-size: 0.8rem; 
            font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-tool:active { background: var(--primary); color: #000; }

        .inp-group { margin-bottom: 15px; }
        .inp-label { display: block; color: var(--primary); font-size: 0.7rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .inp { width: 100%; background: #0f0f15; border: 1px solid #333; padding: 14px; color: white; border-radius: 14px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; }
        .inp:focus { border-color: var(--secondary); background: #14141e; }

        .btn-row { display: flex; gap: 12px; margin-top: 25px; }
        .btn-save { flex: 1; padding: 15px; background: linear-gradient(90deg, var(--secondary), var(--primary)); border: none; font-weight: 700; border-radius: 14px; color: white; cursor: pointer; font-size: 1rem; }
        .btn-cancel { flex: 1; padding: 15px; background: #2a2a35; border: none; font-weight: 600; border-radius: 14px; color: #ccc; cursor: pointer; font-size: 1rem; }

        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; z-index: 300; opacity: 0; pointer-events: none; transition: 0.3s; }
        .toast.show { opacity: 1; bottom: 130px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><div id="statusDot" class="status-dot"></div> DPMODS V9</div>
    </header>

    <div class="container">
        <div id="loader" style="text-align: center; padding: 80px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.2rem; color: var(--primary);"></i>
            <p style="color: #666; margin-top: 15px; font-size: 0.9rem;">Connecting...</p>
        </div>

        <div id="errorMsg" class="hidden" style="background: rgba(255,0,85,0.1); border: 1px solid var(--danger); padding: 20px; border-radius: 16px; text-align: center; color: var(--danger);">
            <i class="fas fa-wifi" style="font-size: 1.5rem; margin-bottom: 10px;"></i><br><strong>Connection Failed</strong><br>
            <small id="errorDetail">Check URL or Internet</small><br>
            <button onclick="window.location.reload()" style="background: #333; color: white; border: none; padding: 8px 20px; margin-top: 15px; border-radius: 8px; cursor: pointer;">Retry</button>
        </div>

        <div id="contentArea" class="hidden">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search" class="search-input" placeholder="Search..." onkeyup="render()">
            </div>

            <div class="chips">
                <div class="chip active" onclick="setFilter('all', this)">All</div>
                <div class="chip" onclick="setFilter('active', this)">Active</div>
                <div class="chip" onclick="setFilter('banned', this)">Banned</div>
            </div>

            <div id="list"></div>
        </div>

        <div id="settingsArea" class="hidden">
            <h2 style="color:white; margin-bottom:20px;">Settings</h2>
            <div class="card" style="border:1px solid #333;">
                <div class="inp-group">
                    <label class="inp-label">Firebase Database URL</label>
                    <input type="text" class="inp" id="confUrl">
                </div>
                <button class="btn-save" onclick="saveSettings()">Save Configuration</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal-wrap">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">User Details</h3>
                <i class="fas fa-times" onclick="closeModal()" style="color:#666; cursor:pointer;"></i>
            </div>
            
            <input type="hidden" id="editIdx">
            
            <div class="tool-bar">
                <button class="btn-tool" onclick="randomGen()">
                    <i class="fas fa-dice"></i> Randomize
                </button>
                <button class="btn-tool" onclick="makeSame()">
                    <i class="fas fa-clone"></i> Same
                </button>
            </div>

            <div class="inp-group">
                <label class="inp-label">Username</label>
                <input type="text" class="inp" id="uName" placeholder="Enter username">
            </div>
            
            <div class="inp-group">
                <label class="inp-label">Password</label>
                <input type="text" class="inp" id="uPass" placeholder="Enter password">
            </div>
            
            <div class="inp-group">
                <label class="inp-label">Device ID</label>
                <input type="text" class="inp" id="uDev" placeholder="Device ID (Optional)">
            </div>
            
            <div class="inp-group">
                <label class="inp-label">Expiry Date</label>
                <input type="date" class="inp" id="uExp">
            </div>

            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard</div>

    <div class="nav-bar">
        <div class="nav-item active" id="navHome" onclick="switchTab('home')"><i class="fas fa-home"></i></div>
        <div class="fab" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" id="navSet" onclick="switchTab('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        // CONFIG
        const DEFAULT_URL = "https://awesome-6004e.firebaseio.com/.json";
        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        let localData = { users: [], banned: [] };
        let currentFilter = 'all';

        // --- FETCH LOGIC ---
        async function fetchData() {
            document.getElementById('loader').style.display = 'block';
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000); 

                const response = await fetch(dbUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                processData(data);
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('contentArea').classList.remove('hidden');
                document.getElementById('errorMsg').classList.add('hidden');

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('contentArea').classList.add('hidden');
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('errorDetail').innerText = error.message;
            }
        }

        function processData(data) {
            if (!data) { localData.users = []; localData.banned = []; return; }

            let bans = data.BannedDevices;
            if (typeof bans === 'object' && !Array.isArray(bans)) bans = Object.values(bans);
            localData.banned = bans ? bans.filter(x => x) : [];

            let users = data.Users;
            if (typeof users === 'object' && !Array.isArray(users)) users = Object.values(users);
            localData.users = users ? users.map(u => ({
                username: u.Username || u.name || "Unknown",
                password: u.Password || u.pass || "---",
                deviceID: u.DeviceID || u.ID || u.id || "",
                expiry: u.Expiry || u.expiry || ""
            })) : [];

            document.getElementById('confUrl').value = dbUrl;
            render();
        }

        // --- RENDER LOGIC ---
        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const search = document.getElementById('search').value.toLowerCase();

            localData.users.forEach((u, index) => {
                const isBanned = localData.banned.includes(u.deviceID);
                const hasID = u.deviceID && u.deviceID.length > 2;
                const isExpired = checkExpired(u.expiry);
                
                // --- FILTER LOGIC ---
                // Active = ONLY checks Date (as requested)
                if (currentFilter === 'active' && isExpired) return;
                
                // Banned = Only Banned
                if (currentFilter === 'banned' && !isBanned) return;
                
                // Search
                if (search && !u.username.toLowerCase().includes(search)) return;

                // --- VISUAL STYLING ---
                let cardClass = 'active'; // Default Blue
                let statusTxt = 'ACTIVE';
                let statusColor = '#00ff9d';
                let devText = u.deviceID || "NO ID";
                let devClass = hasID ? 'linked' : '';

                if (isBanned) { 
                    cardClass = 'banned'; statusTxt = 'BANNED'; statusColor = '#ff0055'; 
                } else if (!hasID) {
                    // Even if NO ID, if it's not expired, it shows in Active tab
                    // But visually we can style it gray or keep it blue. 
                    // Let's keep card blue (Active) but show "NO ID" text.
                    statusTxt = 'WAITING...'; statusColor = '#00e5ff';
                    if(currentFilter === 'all') cardClass = 'noid'; // In 'All', show gray
                } 
                
                if (isExpired) {
                    cardClass = 'expired'; statusTxt = 'EXPIRED'; statusColor = '#ffb700'; 
                }

                const html = `
                <div class="card ${cardClass}">
                    <div class="user-top">
                        <div class="u-name">${u.username}</div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.deviceID}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <span class="u-dev ${devClass}">${devText}</span>

                    <div class="info-box">
                        <span><i class="fas fa-key"></i> ${u.password}</span>
                        <span><i class="far fa-clock"></i> ${u.expiry}</span>
                    </div>

                    <div class="actions">
                        <span class="u-status" style="color:${statusColor}; margin-right:auto;">${statusTxt}</span>
                        
                        <button class="btn-icon btn-copy" onclick="copyCreds('${u.username}', '${u.password}')">
                            <i class="fas fa-copy"></i>
                        </button>
                        
                        <button class="btn-icon" onclick="openModal(${index})">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="btn-icon
