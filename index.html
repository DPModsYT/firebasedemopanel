<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods Ultimate Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-deep: #050505;
            --primary: #00c6ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;  
            --grad-main: linear-gradient(135deg, #7000ff, #00c6ff);
            --grad-glass: linear-gradient(145deg, rgba(20,20,35,0.7), rgba(10,10,20,0.8));
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        /* --- BACKGROUND --- */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%);
        }

        .container { max-width: 700px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 4px 20px rgba(112, 0, 255, 0.1);
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #00ff99; border-radius: 50%; box-shadow: 0 0 10px #00ff99; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: var(--grad-glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px; margin-bottom: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }
        .slide-in { animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- USER ITEMS --- */
        .user-item {
            display: flex; flex-direction: column; gap: 10px;
            border-left: 4px solid var(--primary);
            position: relative;
        }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.7; }
        
        .user-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .user-info h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff; }
        .user-info small { color: var(--text-muted); font-size: 0.8rem; }
        
        .user-meta {
            display: flex; gap: 15px; font-size: 0.85rem; color: #aaa;
            background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;
            align-items: center;
        }
        .meta-tag { display: flex; align-items: center; gap: 5px; }

        /* --- BAN TOGGLE SWITCH --- */
        .ban-control { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid #555;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        .ban-label { font-size: 0.65rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        /* --- ACTIONS --- */
        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .btn-icon {
            width: 35px; height: 35px; border-radius: 8px; border: none; cursor: pointer;
            background: rgba(255,255,255,0.05); color: #fff; transition: 0.3s;
        }
        .btn-edit:hover { background: var(--primary); color: #000; }
        .btn-delete:hover { background: var(--accent); }

        /* --- FORMS --- */
        label { display: block; color: var(--primary); margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-top: 15px; }
        input, textarea, select {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 8px; color: #fff; font-family: 'Poppins', sans-serif;
        }
        input:focus { border-color: var(--secondary); outline: none; }

        .btn-main {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--grad-main); color: #fff; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; margin-top: 20px;
            box-shadow: 0 5px 15px rgba(112, 0, 255, 0.3);
        }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #110e1c; border: 1px solid rgba(112, 0, 255, 0.3);
            width: 90%; max-width: 400px; padding: 25px; border-radius: 20px;
            position: relative; box-shadow: 0 0 50px rgba(112, 0, 255, 0.15);
        }

        /* --- NAV --- */
        nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; padding: 10px 30px;
            display: flex; gap: 35px; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 100;
        }
        .nav-item { color: #666; font-size: 1.4rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 15px var(--primary); }
        .fab-add {
            background: var(--grad-main); color: #fff; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; margin-top: -30px; border: 4px solid var(--bg-deep);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.5);
        }

        .check-group { display: flex; align-items: center; gap: 10px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .check-group input { width: auto; margin: 0; }
        .check-group label { margin: 0; color: #fff; font-size: 0.9rem; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS PANEL</div>
        <div style="font-size: 0.8rem; color: #888;">STATUS: LIVE</div>
    </header>

    <div class="container">
        
        <div id="tabDevices">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem; color: #fff;">
                <i class="fas fa-users" style="color: var(--primary);"></i> User Database
            </h2>
            <div id="userList">
                <div class="glass-card" style="text-align: center; color: #aaa; padding: 40px;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 10px; color: var(--secondary);"></i>
                    <br>Connecting to Firebase...
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem; color: #fff;">
                <i class="fas fa-cogs" style="color: var(--secondary);"></i> Configuration
            </h2>
            <div class="glass-card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl" placeholder="https://t.me/...">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout" placeholder="e.g. 1m, 30s">

                <div class="check-group">
                    <input type="checkbox" id="confShowAnnounce">
                    <label for="confShowAnnounce">Show Announcement Dialog</label>
                </div>

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3" placeholder="Enter message..."></textarea>

                <button class="btn-main" onclick="saveSettings()">Save Configuration</button>
            </div>
        </div>

    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #fff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">User Details</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label>
            <input type="text" id="inpUser" placeholder="Username">

            <label>Password</label>
            <input type="text" id="inpPass" placeholder="Password">

            <label>Device ID</label>
            <input type="text" id="inpDevice" placeholder="Device Key">

            <label>Expiry Date</label>
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <button onclick="setExpiry(30)" style="padding:6px; background:#333; color:#fff; border:none; border-radius:4px; font-size:0.75rem; cursor:pointer;">+1 Month</button>
                <button onclick="setExpiry(365)" style="padding:6px; background:#333; color:#fff; border:none; border-radius:4px; font-size:0.75rem; cursor:pointer;">+1 Year</button>
            </div>
            <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-main" style="background:#222; width:40%; margin-top:0;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" style="width:60%; margin-top:0;" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-users"></i></div>
        <div class="fab-add" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-sliders-h"></i></div>
    </nav>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIG
        // ==========================================
        const DATABASE_URL = "https://awesome-6004e.firebaseio.com";
        
        let dbData = {
            AdminUrl: "",
            DialogTimeout: "1m",
            ShowAnnouncement: false,
            Announcement: "",
            BannedDevices: [],
            Users: []
        };
        
        let lastJsonString = "";

        // ==========================================
        // 2. LOGIC
        // ==========================================
        async function fetchData() {
            try {
                const response = await fetch(`${DATABASE_URL}/.json`);
                const val = await response.json();

                // FIX: If null (empty DB), initialize default structure
                if (!val) {
                    renderUsers(); // Shows empty state
                    return;
                }

                const newJson = JSON.stringify(val);
                if (newJson === lastJsonString) return; // No change, don't re-render
                lastJsonString = newJson;

                // Safely parse data
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";
                dbData.BannedDevices = val.BannedDevices || [];
                
                let usersList = val.Users || [];
                if (typeof usersList === 'object' && !Array.isArray(usersList)) {
                    usersList = Object.values(usersList);
                }
                dbData.Users = usersList;

                renderUsers();
                fillSettings();

            } catch (error) { 
                console.error(error); 
                // Show error in UI so user knows
                document.getElementById('userList').innerHTML = `<div class="glass-card" style="text-align:center; color:var(--accent);">Connection Error. Retrying...</div>`;
            }
        }

        // Poll every 2 seconds
        setInterval(fetchData, 2000);
        fetchData();

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (dbData.Users.length === 0) {
                list.innerHTML = `<div class="glass-card" style="text-align:center; color:#aaa; padding: 30px;">
                    <i class="fas fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i><br>
                    No users found. Add one +</div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);

                const div = document.createElement('div');
                div.className = `glass-card user-item slide-in ${isBanned ? 'banned' : ''}`;
                
                div.innerHTML = `
                    <div class="user-header">
                        <div class="user-info">
                            <h4>${u.Username} <small style="opacity:0.6;">(${u.Password})</small></h4>
                            <div style="color:var(--primary); font-size:0.75rem; font-family:monospace; margin-top:2px;">
                                <i class="fas fa-mobile-alt"></i> ${u.DeviceID}
                            </div>
                        </div>
                        <div class="ban-control">
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                            ${isBanned ? '<span class="ban-label">BANNED</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="user-meta">
                        <span class="meta-tag"><i class="far fa-calendar-alt"></i> Exp: ${u.Expiry}</span>
                    </div>

                    <div class="action-row">
                        <span style="font-size:0.7rem; color:#666; text-transform:uppercase; font-weight:bold;">Actions</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon btn-edit" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-delete" onclick="deleteUser(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function toggleBan(deviceID) {
            const index = dbData.BannedDevices.indexOf(deviceID);
            if (index > -1) {
                dbData.BannedDevices.splice(index, 1);
            } else {
                dbData.BannedDevices.push(deviceID);
            }
            
            renderUsers(); // Update UI instantly
            
            await fetch(`${DATABASE_URL}/BannedDevices.json`, {
                method: 'PUT',
                body: JSON.stringify(dbData.BannedDevices)
            });
            lastJsonString = ""; // Force refresh
        }

        function fillSettings() {
            const adminUrl = document.getElementById('confAdminUrl');
            const timeout = document.getElementById('confTimeout');
            const announceCheck = document.getElementById('confShowAnnounce');
            const announceMsg = document.getElementById('confAnnounceMsg');
            
            if(document.activeElement !== adminUrl) adminUrl.value = dbData.AdminUrl;
            if(document.activeElement !== timeout) timeout.value = dbData.DialogTimeout;
            if(document.activeElement !== announceMsg) announceMsg.value = dbData.Announcement;
            announceCheck.checked = dbData.ShowAnnouncement;
        }

        async function saveSettings() {
            const newData = {
                AdminUrl: document.getElementById('confAdminUrl').value,
                DialogTimeout: document.getElementById('confTimeout').value,
                ShowAnnouncement: document.getElementById('confShowAnnounce').checked,
                Announcement: document.getElementById('confAnnounceMsg').value,
                BannedDevices: dbData.BannedDevices,
                Users: dbData.Users
            };

            await fetch(`${DATABASE_URL}/.json`, { method: 'PUT', body: JSON.stringify(newData) });
            alert("Settings Saved!");
            lastJsonString = "";
            fetchData();
        }

        async function saveUser() {
            const user = document.getElementById('inpUser').value;
            const pass = document.getElementById('inpPass').value;
            const device = document.getElementById('inpDevice').value;
            const dateVal = document.getElementById('inpExpiry').value;
            const index = document.getElementById('editIndex').value;

            if (!user || !pass || !device || !dateVal) return alert("All fields required");

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}/${month}/${year}`;

            const userObj = {
                Username: user,
                Password: pass,
                DeviceID: device,
                Expiry: formattedDate
            };

            let newList = [...dbData.Users];
            if (index !== "") newList[parseInt(index)] = userObj;
            else newList.push(userObj);

            const fullPayload = { ...dbData, Users: newList };

            await fetch(`${DATABASE_URL}/.json`, { method: 'PUT', body: JSON.stringify(fullPayload) });
            closeModal();
            lastJsonString = "";
            fetchData();
        }

        async function deleteUser(index) {
            if(confirm("Delete this user?")) {
                let newList = [...dbData.Users];
                newList.splice(index, 1);
                
                const fu
