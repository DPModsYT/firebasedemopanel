<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DYNAMIC THEME VARIABLES --- */
        :root {
            /* Default: Cyberpunk */
            --bg-body: #050508;
            --bg-card: #0e0e14;
            --bg-nav: #161621;
            --primary: #00e5ff;
            --primary-dim: rgba(0, 229, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #00ff9d;
            --danger: #ff0055;
        }

        /* THEME: BLOOD */
        [data-theme="blood"] {
            --bg-body: #1a0505;
            --bg-card: #2b0a0a;
            --bg-nav: #360000;
            --primary: #ff0033;
            --primary-dim: rgba(255, 0, 51, 0.15);
            --text-main: #ffcccc;
            --text-muted: #cc8888;
            --border: #4a1111;
            --success: #ff3333;
        }

        /* THEME: MATRIX */
        [data-theme="matrix"] {
            --bg-body: #000000;
            --bg-card: #051a05;
            --bg-nav: #001100;
            --primary: #00ff00;
            --primary-dim: rgba(0, 255, 0, 0.1);
            --text-main: #ccffcc;
            --text-muted: #448844;
            --border: #003300;
            --success: #00ff00;
            --danger: #008800;
        }

        /* THEME: CHERRY */
        [data-theme="cherry"] {
            --bg-body: #1a0f14;
            --bg-card: #26161c;
            --bg-nav: #331e26;
            --primary: #ff66b2;
            --primary-dim: rgba(255, 102, 178, 0.15);
            --text-main: #ffccdd;
            --text-muted: #aa6680;
            --border: #4d2636;
            --success: #ff99cc;
            --danger: #ff3366;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* --- BACKGROUND PARTICLES --- */
        #particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        /* --- HEADER --- */
        header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 50;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
        .logo i { color: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }
        
        .header-actions { display: flex; gap: 10px; }
        .head-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .head-btn:hover { border-color: var(--primary); color: var(--primary); }
        .head-btn:active { transform: scale(0.95); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* --- CONTROLS BAR (SEARCH + GEN) --- */
        .controls-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); padding: 12px 12px 12px 42px; color: var(--text-main); border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: 0.2s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-dim); }

        .btn-gen { background: var(--primary); color: #000; border: none; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 0 15px var(--primary-dim); white-space: nowrap; }
        .btn-gen:active { transform: scale(0.96); }

        /* --- CARDS --- */
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 12px; 
            position: relative; 
            transition: all 0.2s; 
            display: flex; flex-direction: column; gap: 8px;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-2px); }
        
        /* Key Styling */
        .key-top { display: flex; justify-content: space-between; align-items: center; }
        .key-text { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; }
        
        .key-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding-top: 10px; border-top: 1px solid var(--border); }
        .time-tag { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .time-tag i { font-size: 0.7rem; }

        .actions { display: flex; gap: 8px; }
        .act-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .act-btn:hover { background: var(--primary-dim); color: var(--text-main); border-color: var(--primary); }
        .act-btn.del:hover { background: rgba(255, 0, 85, 0.1); color: var(--danger); border-color: var(--danger); }

        /* Toggle Switch */
        .user-row { display: flex; justify-content: space-between; align-items: center; }
        .user-id { font-weight: 600; font-size: 0.95rem; }
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 24px; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--danger); border-color: var(--danger); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- THEME MENU --- */
        .theme-menu { 
            position: absolute; top: 65px; right: 20px; 
            background: var(--bg-card); border: 1px solid var(--border); 
            border-radius: 12px; padding: 10px; width: 160px;
            display: none; flex-direction: column; gap: 5px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }
        .theme-menu.show { display: flex; animation: slideDown 0.2s; }
        @keyframes slideDown { from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)} }

        .theme-opt { padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-muted); transition: 0.2s; }
        .theme-opt:hover { background: var(--border); color: var(--text-main); }
        .theme-opt.active { background: var(--primary-dim); color: var(--primary); font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        /* --- NAV BAR --- */
        .nav-wrap { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 99; }
        .nav-bar { 
            background: var(--bg-nav); border: 1px solid var(--border); 
            padding: 0 15px; height: 60px; border-radius: 20px; 
            display: flex; align-items: center; width: 90%; max-width: 400px; 
            justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); text-shadow: 0 0 10px var(--primary-dim); }
        .nav-lbl { font-size: 0.65rem; margin-top: 4px; font-weight: 600; }

        /* --- MODAL --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: var(--bg-card); width: 90%; max-width: 320px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        
        .inp-group { margin-bottom: 15px; }
        .inp-label { display: block; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .inp { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; color: var(--text-main); border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 0.95rem; }
        .inp:focus { border-color: var(--primary); }

        .btn-full { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 5px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-muted); margin-top: 10px; cursor: pointer; }

        /* Utils */
        .hidden { display: none !important; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--bg-card); border: 1px solid var(--primary); color: var(--text-main); padding: 12px 25px; border-radius: 30px; z-index: 300; transition: 0.4s; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><i class="fas fa-cube"></i> GATEWAY</div>
        <div class="header-actions">
            <div class="head-btn" onclick="toggleThemeMenu()"><i class="fas fa-palette"></i></div>
            <div class="head-btn" onclick="init()"><i class="fas fa-sync-alt"></i></div>
        </div>
    </header>

    <div id="themeMenu" class="theme-menu">
        <div class="theme-opt" onclick="setTheme('cyberpunk')"><div class="dot" style="background:#00e5ff"></div> Cyberpunk</div>
        <div class="theme-opt" onclick="setTheme('blood')"><div class="dot" style="background:#ff0033"></div> Blood</div>
        <div class="theme-opt" onclick="setTheme('matrix')"><div class="dot" style="background:#00ff00"></div> Matrix</div>
        <div class="theme-opt" onclick="setTheme('cherry')"><div class="dot" style="background:#ff66b2"></div> Cherry</div>
    </div>

    <div class="container">
        
        <div id="loader" style="text-align: center; padding: 100px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            <p style="color: var(--text-muted); margin-top: 15px; font-size: 0.9rem;">SYNCING DATABASE...</p>
        </div>

        <div id="errorMsg" class="hidden" style="text-align: center; padding: 40px; border: 1px solid var(--danger); border-radius: 16px; background: rgba(255, 0, 85, 0.05); margin-top: 50px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger); margin-bottom: 15px;"></i>
            <h3 style="margin: 0 0 10px 0; color: var(--danger);">Connection Failed</h3>
            <p id="errorTxt" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Unable to fetch data.</p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="act-btn" style="width:auto; padding:0 20px; color:white; border-color:var(--border);" onclick="resetApp()">Reset URL</button>
                <button class="btn-full" style="width:auto; padding:10px 30px; margin:0;" onclick="window.location.reload()">Retry</button>
            </div>
        </div>

        <div id="mainContent" class="hidden">
            
            <div id="tabKeys">
                <div class="controls-bar">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input" id="searchKey" placeholder="Search Keys..." onkeyup="renderKeys()">
                    </div>
                    <button class="btn-gen" onclick="openKeyModal()"><i class="fas fa-plus"></i> Generate</button>
                </div>
                <div id="keyList"></div>
            </div>

            <div id="tabDevices" class="hidden">
                <div class="controls-bar">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input" id="searchDev" placeholder="Search Devices..." onkeyup="renderUsers()">
                    </div>
                </div>
                <div id="userList"></div>
            </div>

            <div id="tabSettings" class="hidden">
                <h3 style="color:var(--text-main); margin-bottom:15px;">Configuration</h3>
                <div class="card" style="display:block;">
                    <div class="inp-group"><label class="inp-label">Title</label><input type="text" class="inp" id="cfgTitle"></div>
                    <div class="inp-group"><label class="inp-label">Subtitle</label><input type="text" class="inp" id="cfgSub"></div>
                    <div class="inp-group"><label class="inp-label">Admin URL</label><input type="text" class="inp" id="cfgAdminUrl"></div>
                    <button class="btn-full" onclick="saveConfig()">SAVE SETTINGS</button>
                    <button class="btn-full btn-cancel" onclick="resetApp()">RESET LINK</button>
                </div>
            </div>

        </div>
    </div>

    <div id="modalKey" class="modal-wrap">
        <div class="modal-box">
            <h3 style="color:var(--text-main); margin-top:0;">Generate Keys</h3>
            <div class="inp-group"><label class="inp-label">Prefix</label><input type="text" class="inp" id="keyPrefix" placeholder="VIP"></div>
            <div class="inp-group"><label class="inp-label">Quantity</label><input type="number" class="inp" id="keyQty" value="1"></div>
            <button class="btn-full" onclick="generateKeys()">GENERATE</button>
            <button class="btn-full btn-cancel" onclick="closeModal('modalKey')">CANCEL</button>
        </div>
    </div>

    <div id="modalEdit" class="modal-wrap">
        <div class="modal-box">
            <h3 style="color:var(--text-main); margin-top:0;">Edit Key</h3>
            <input type="hidden" id="editOldKey">
            <div class="inp-group"><label class="inp-label">Key String</label><input type="text" class="inp" id="editNewKey"></div>
            <button class="btn-full" onclick="saveEditedKey()">SAVE CHANGES</button>
            <button class="btn-full btn-cancel" onclick="closeModal('modalEdit')">CANCEL</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Success</span></div>

    <div class="nav-wrap">
        <div class="nav-bar">
            <div class="nav-item active" id="navKeys" onclick="switchTab('keys')"><i class="fas fa-key"></i><span class="nav-lbl">KEYS</span></div>
            <div class="nav-item" id="navDev" onclick="switchTab('devices')"><i class="fas fa-mobile-alt"></i><span class="nav-lbl">DEVICES</span></div>
            <div class="nav-item" id="navSet" onclick="switchTab('settings')"><i class="fas fa-sliders-h"></i><span class="nav-lbl">CONFIG</span></div>
        </div>
    </div>

    <script>
        // CONFIG
        const DEFAULT_URL = "https://appurl-8eec4-default-rtdb.firebaseio.com/.json";
        const DEFAULT_JSON = {
            "Config": { "Title": "Gateway VIP", "Subtitle": "ONLINE", "AdminUrl": "", "UpdateUrl": "" },
            "BannedDevices": { "test_ban": "banned" },
            "ActivatedUsers": { "placeholder": "active" },
            "ValidKeys": { "VIP-DEMO": new Date().toISOString() }
        };

        // --- ROBUST URL HANDLING ---
        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        
        let dbData = null;
        let currentTheme = localStorage.getItem('theme') || 'cyberpunk';

        // --- THEME ENGINE ---
        function setTheme(t) {
            currentTheme = t;
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            toggleThemeMenu(false);
            const rootStyle = getComputedStyle(document.documentElement);
            const color = rootStyle.getPropertyValue('--primary').trim();
            updateParticlesColor(color);
        }
        setTheme(currentTheme);

        function toggleThemeMenu(forceState) {
            const m = document.getElementById('themeMenu');
            if(forceState !== undefined) {
                if(forceState) m.classList.add('show'); else m.classList.remove('show');
            } else {
                m.classList.toggle('show');
            }
        }

        // --- CORE (FIXED INIT) ---
        async function init() {
            // Reset UI
            document.getElementById('loader').style.display = 'block';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');

            try {
                // Ensure URL ends in .json
                let urlToFetch = dbUrl;
                if (!urlToFetch.endsWith('.json')) urlToFetch += '.json';

                // Fetch with Timeout protection
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout
                
                const res = await fetch(urlToFetch, { signal: controller.signal });
                clearTimeout(timeoutId);

                if(!res.ok) throw new Error(`HTTP Error ${res.status}`);

                let data = await res.json();
                
                // Initialize if empty
                if(!data) {
                    await fetch(urlToFetch, { method: 'PUT', body: JSON.stringify(DEFAULT_JSON) });
                    data = DEFAULT_JSON;
                }

                dbData = data;
                ensureStructure();
                render();

                // Success
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden');

            } catch(e) {
                console.error(e);
                // Stop loader and show error screen
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('errorTxt').innerText = e.message || "Network Error";
            }
        }

        function ensureStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_JSON.Config;
        }

        async function saveData() {
            let urlToSave = dbUrl;
            if (!urlToSave.endsWith('.json')) urlToSave += '.json';
            try {
                await fetch(urlToSave, { method: 'PUT', body: JSON.stringify(dbData) });
                showToast("Saved");
            } catch(e) { showToast("Save Failed"); }
        }

        function render() {
            renderKeys();
            renderUsers();
            if(dbData.Config) {
                document.getElementById('cfgTitle').value = dbData.Config.Title || "";
                document.getElementById('cfgSub').value = dbData.Config.Subtitle || "";
                document.getElementById('cfgAdminUrl').value = dbData.Config.AdminUrl || "";
            }
        }

        // --- KEYS ---
        function renderKeys() {
            const list = document.getElementById('keyList');
            list.innerHTML = "";
            const search = document.getElementById('searchKey').value.toLowerCase();
            const keys = Object.keys(dbData.ValidKeys).reverse();

            keys.forEach(k => {
                if(search && !k.toLowerCase().includes(search)) return;
                
                let timeStr = "Unknown Date";
                const rawTime = dbData.ValidKeys[k];
                if(rawTime && rawTime.length > 10) {
                    try {
                        const d = new Date(rawTime);
                        timeStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ", " + d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
                    } catch(e){}
                }

                list.innerHTML += `
                <div class="card">
                    <div class="key-top">
                        <span class="key-text" onclick="copyTxt('${k}')">${k}</span>
                        <div class="actions">
                            <div class="act-btn" onclick="openEditKey('${k}')"><i class="fas fa-pen"></i></div>
                            <div class="act-btn del" onclick="deleteKey('${k}')"><i class="fas fa-trash"></i></div>
                        </div>
                    </div>
                    <div class="key-meta">
                        <div class="time-tag"><i class="far fa-clock"></i> ${timeStr}</div>
                        <span style="font-size:0.7rem; color:var(--success); font-weight:600;">ACTIVE</span>
                    </div>
                </div>`;
            });
            if(!list.innerHTML) list.innerHTML = "<p style='text-align:center; color:var(--text-muted)'>No keys found</p>";
        }

        function generateKeys() {
            const qty = document.getElementById('keyQty').value;
            const pre = document.getElementById('keyPrefix').value.toUpperCase() || "KEY";
            for(let i=0; i<qty; i++) {
                const rnd = Math.random().toString(36).substring(2,8).toUpperCase();
                const k = `${pre}-${rnd}`;
                dbData.ValidKeys[k] = new Date().toISOString();
            }
            closeModal('modalKey');
            renderKeys();
            saveData();
        }

        function openEditKey(k) {
            document.getElementById('editOldKey').value = k;
            document.getElementById('editNewKey').value = k;
            document.getElementById('modalEdit').style.display = 'flex';
        }

        function saveEditedKey() {
            const oldK = document.getElementById('editOldKey').value;
            const newK = document.getElementById('editNewKey').value;
            if(newK && newK !== oldK) {
                const val = dbData.ValidKeys[oldK];
                delete dbData.ValidKeys[oldK];
                dbData.ValidKeys[newK] = val;
                renderKeys();
                saveData();
            }
            closeModal('modalEdit');
        }

        // --- USERS (Corrected Toggle Logic) ---
        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            const search = document.getElementById('searchDev').value.toLowerCase();
            
            const allUsers = [...Object.keys(dbData.ActivatedUsers || {}), ...Object.keys(dbData.BannedDevices || {})];
            const uniqueUsers = [...new Set(allUsers)];

            uniqueUsers.forEach(u => {
                if(u === 'placeholder' || u === 'test_ban') return;
                if(search && !u.toLowerCase().includes(search)) return;

                // Check ban status safely
                const isBanned = dbData.BannedDevices && dbData.BannedDevices[u] !== undefined;
                
                list.innerHTML += `
                <div class="card" style="border-left: 3px solid ${isBanned ? 'var(--danger)' : 'var(--success)'}">
                    <div class="user-row">
                        <div class="user-id" onclick="copyTxt('${u}')">${u}</div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="key-meta" style="border:none; padding-top:5px; margin-top:0;">
                        <span style="font-size:0.75rem; color:${isBanned?'var(--danger)':'var(--success)'}">
                            <i class="fas ${isBanned?'fa-ban':'fa-check-circle'}"></i> ${isBanned ? 'BANNED' : 'ALLOWED'}
                        </span>
                    </div>
                </div>`;
            });
            if(uniqueUsers.length === 0) list.innerHTML = "<p style='text-align:center; color:var(--text-muted)'>No devices found</p>";
        }

        function toggleBan(u) {
            if(dbData.BannedDevices && dbData.BannedDevices[u]) {
                delete dbData.BannedDevices[u]; // Unban
                dbData.ActivatedUsers[u] = "active";
            } else {
                dbData.BannedDevices[u] = "banned"; // Ban
            }
            saveData();
            renderUsers();
        }

        // --- UTILS ---
        function switchTab(t) {
            document.getElementById('tabKeys').classList.add('hidden');
            document.getElementById('tabDevices').classList.add('hidden');
            document.getElementById('tabSettings').classList.add('hidden');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if(t === 'keys') { document.getElementById('tabKeys').classList.remove('hidden'); document.getElementById('navKeys').classList.add('active'); }
            if(t === 'devices') { document.getElementById('tabDevices').classList.remove('hidden'); document.getElementById('navDev').classList.add('active'); }
            if(t === 'settings') { document.getElementById('tabSettings').classList.remove('hidden'); document.getElementById('navSet').classList.add('active'); }
        }

        function openKeyModal() { document.getElementById('modalKey').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function deleteKey(k) { if(confirm("Delete?")) { delete dbData.ValidKeys[k]; renderKeys(); saveData(); } }
        function saveConfig() { 
            dbData.Config.Title = document.getElementById('cfgTitle').value;
            dbData.Config.Subtitle = document.getElementById('cfgSub').value;
            dbData.Config.AdminUrl = document.getElementById('cfgAdminUrl').value;
            saveData();
        }
        function resetApp() { if(confirm("Reset URL?")) { localStorage.removeItem("dbUrl"); location.reload(); } }
        function copyTxt(t) { navigator.clipboard.writeText(t); showToast("Copied"); }
        function showToast(m) { const t = document.getElementById('toast'); document.getElementById('toastMsg').innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

        // --- PARTICLES ---
        const cvs = document.getElementById('particles');
        const ctx = cvs.getContext('2d');
        let parts = [];
        let pColor = "rgba(0, 229, 255, 0.2)";

        function resize() { cvs.width=window.innerWidth; cvs.height=window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function updateParticlesColor(hex) {
            pColor = hex; 
        }

        class P {
            constructor(){ this.reset(); }
            reset(){ this.x=Math.random()*cvs.width; this.y=Math.random()*cvs.height; this.v=(Math.random()*0.5)+0.2; this.s=Math.random()*2; }
            up(){ this.y-=this.v; if(this.y<0) this.reset(); }
            dr(){ ctx.fillStyle=pColor; ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<50; i++) parts.push(new P());
        function anim(){ ctx.clearRect(0,0,cvs.width,cvs.height); parts.forEach(p=>{p.up();p.dr()}); requestAnimationFrame(anim); }
        anim();

        init();
    </script>
</body>
</html>
