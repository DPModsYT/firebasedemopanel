<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods V9 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #050508;
            --bg-card: #0e0e14;
            --primary: #00e5ff; 
            --primary-dark: #00b8cc;
            --secondary: #7000ff; 
            --danger: #ff0055;
            --text-main: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --nav-bg: #161621;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px; /* Space for Nav */
        }

        /* --- HEADER --- */
        header {
            padding: 18px 24px;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
        .status-dot { width: 8px; height: 8px; background: #00ff9d; border-radius: 50%; box-shadow: 0 0 12px #00ff9d; transition: 0.3s; }
        .status-dot.offline { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* --- SEARCH & CHIPS --- */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666; font-size: 1.1rem; }
        .search-input { width: 100%; background: #12121a; border: 1px solid #333; padding: 16px 16px 16px 50px; border-radius: 14px; color: white; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 25px; scrollbar-width: none; }
        .chip { padding: 8px 20px; background: #1a1a24; border-radius: 50px; font-size: 0.85rem; color: #888; border: 1px solid #333; white-space: nowrap; transition: 0.3s; font-weight: 500; }
        .chip.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 600; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }

        /* --- CARDS --- */
        .card { background: var(--bg-card); border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 16px; position: relative; transition: transform 0.2s; }
        .card:active { transform: scale(0.99); }
        
        .card.active { border-left: 4px solid var(--primary); }
        .card.banned { border-left: 4px solid var(--danger); animation: pulse 2s infinite; }
        .card.expired { border-left: 4px solid #ffb700; }
        
        @keyframes pulse { 0% { box-shadow: inset 2px 0 0 var(--danger); } 50% { box-shadow: inset 2px 0 15px var(--danger); } 100% { box-shadow: inset 2px 0 0 var(--danger); } }

        .user-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .u-name { font-weight: 700; font-size: 1.25rem; font-family: 'Rajdhani', sans-serif; color: #fff; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .info-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; font-size: 0.85rem; color: #ccc; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.05); }
        
        .actions { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .btn-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 12px; color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); }
        .btn-copy { color: var(--primary); }
        .btn-del { color: var(--danger); }

        /* --- SETTINGS INPUTS --- */
        .inp-group { margin-bottom: 15px; }
        .inp-label { display: block; color: var(--primary); font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .inp { width: 100%; background: #0a0a10; border: 1px solid #333; padding: 14px; color: white; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
        .inp:focus { border-color: var(--secondary); }

        /* --- SWITCH --- */
        .switch { position: relative; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background: var(--danger); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- NAV BAR (Fixed Position) --- */
        .nav-bar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: var(--nav-bg); border: 1px solid rgba(255,255,255,0.1); 
            padding: 0 35px; height: 75px; border-radius: 50px; 
            display: flex; align-items: center; justify-content: space-between; 
            width: 90%; max-width: 400px; z-index: 99; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
        }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
        
        /* Floating Button Centered */
        .fab { 
            width: 65px; height: 65px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; color: #000; 
            position: absolute; left: 50%; top: -25px; transform: translateX(-50%); 
            border: 6px solid var(--bg-body); cursor: pointer; 
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4); 
        }
        .fab:active { transform: translateX(-50%) scale(0.95); }

        /* --- MODAL --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1a1a24; width: 85%; max-width: 360px; padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.7); }

        .tool-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-tool { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--primary); background: rgba(0, 229, 255, 0.05); color: var(--primary); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .btn-row { display: flex; gap: 12px; margin-top: 25px; }
        .btn-save { flex: 1; padding: 15px; background: linear-gradient(90deg, var(--secondary), var(--primary)); border: none; font-weight: 700; border-radius: 14px; color: white; cursor: pointer; font-size: 1rem; }
        .btn-cancel { flex: 1; padding: 15px; background: #2a2a35; border: none; font-weight: 600; border-radius: 14px; color: #ccc; cursor: pointer; font-size: 1rem; }

        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; z-index: 300; opacity: 0; pointer-events: none; transition: 0.3s; }
        .toast.show { opacity: 1; bottom: 130px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><div id="statusDot" class="status-dot"></div> DPMODS V9</div>
    </header>

    <div class="container">
        <div id="loader" style="text-align: center; padding: 80px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.2rem; color: var(--primary);"></i>
            <p style="color: #666; margin-top: 15px;">Connecting to Firebase...</p>
        </div>

        <div id="errorMsg" class="hidden" style="background: rgba(255,0,85,0.1); border: 1px solid var(--danger); padding: 20px; border-radius: 16px; text-align: center; color: var(--danger);">
            <i class="fas fa-wifi" style="font-size: 1.5rem; margin-bottom: 10px;"></i><br><strong>Connection Failed</strong><br>
            <small id="errorDetail">Database Unreachable</small><br>
            <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
                <button onclick="resetUrl()" style="background:#444; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">Reset URL</button>
                <button onclick="window.location.reload()" style="background:var(--danger); color:white; border:none; padding:8px 20px; border-radius:8px; cursor:pointer;">Retry</button>
            </div>
        </div>

        <div id="tabHome" class="hidden">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search" class="search-input" placeholder="Search..." onkeyup="render()">
            </div>

            <div class="chips">
                <div class="chip active" onclick="setFilter('all', this)">All</div>
                <div class="chip" onclick="setFilter('active', this)">Active</div>
                <div class="chip" onclick="setFilter('banned', this)">Banned</div>
            </div>

            <div id="list"></div>
        </div>

        <div id="tabSettings" class="hidden">
            <h2 style="color:white; margin-bottom:20px;">Configuration</h2>
            <div class="card" style="border:1px solid #333;">
                
                <div class="inp-group">
                    <label class="inp-label">Firebase URL</label>
                    <input type="text" class="inp" id="confUrl">
                </div>

                <div class="inp-group">
                    <label class="inp-label">Admin Contact URL</label>
                    <input type="text" class="inp" id="confAdmin">
                </div>

                <div class="inp-group">
                    <label class="inp-label">Dialog Timeout</label>
                    <input type="text" class="inp" id="confTime">
                </div>

                <div class="inp-group">
                    <label class="inp-label">Announcement</label>
                    <textarea class="inp" id="confMsg" rows="3"></textarea>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background:#111; padding:10px; border-radius:10px;">
                    <span style="color:#aaa; font-size:0.9rem;">Show Announcement</span>
                    <label class="switch">
                        <input type="checkbox" id="confShow">
                        <span class="slider"></span>
                    </label>
                </div>

                <button class="btn-save" onclick="saveSettings()">Save Configuration</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal-wrap">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="margin:0; font-family:'Rajdhani', sans-serif; color:white;">User Details</h3>
                <i class="fas fa-times" onclick="closeModal()" style="color:#666; cursor:pointer;"></i>
            </div>
            
            <input type="hidden" id="editIdx">
            <div class="tool-bar">
                <button class="btn-tool" onclick="randomGen()"><i class="fas fa-dice"></i> Randomize</button>
                <button class="btn-tool" onclick="makeSame()"><i class="fas fa-clone"></i> Same</button>
            </div>

            <div class="inp-group"><label class="inp-label">Username</label><input type="text" class="inp" id="uName"></div>
            <div class="inp-group"><label class="inp-label">Password</label><input type="text" class="inp" id="uPass"></div>
            <div class="inp-group"><label class="inp-label">Device ID</label><input type="text" class="inp" id="uDev" placeholder="Optional"></div>
            <div class="inp-group"><label class="inp-label">Expiry</label><input type="date" class="inp" id="uExp"></div>

            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard</div>

    <div class="nav-bar">
        <div class="nav-item active" id="navHome" onclick="switchTab('home')"><i class="fas fa-home"></i></div>
        <div class="fab" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" id="navSet" onclick="switchTab('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        // --- 1. CONFIG & DEFAULTS ---
        const DEFAULT_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        // The default structure you requested
        const DEFAULT_DB_DATA = {
            "AdminUrl": "https://t.me/dp_mods",
            "DialogTimeout": "1m",
            "ShowAnnouncement": true,
            "Announcement": "New Update V2.0 is coming soon! Stay tuned.",
            "Users": [],
            "BannedDevices": []
        };

        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        let localData = { users: [], banned: [] };
        let settings = {};
        let currentFilter = 'all';

        // --- 2. FETCH LOGIC (ANTI-STUCK) ---
        async function fetchData() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('tabHome').classList.add('hidden');
            document.getElementById('tabSettings').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500); // 3.5s Timeout

            try {
                const response = await fetch(dbUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const data = await response.json();
                
                // AUTO-INITIALIZE: If DB is null, upload defaults
                if(data === null) {
                    await uploadDefaults();
                    return; // Recursion will happen inside uploadDefaults
                }

                processData(data);
                
                // Show UI
                document.getElementById('loader').style.display = 'none';
                if(document.getElementById('navHome').classList.contains('active')){
                    document.getElementById('tabHome').classList.remove('hidden');
                } else {
                    document.getElementById('tabSettings').classList.remove('hidden');
                }
                document.getElementById('statusDot').classList.remove('offline');

            } catch (error) {
                console.error(error);
                // Force Stop Loading
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('errorDetail').innerText = error.name === 'AbortError' ? "Connection Timed Out" : error.message;
                document.getElementById('statusDot').classList.add('offline');
            }
        }

        async function uploadDefaults() {
            try {
                await fetch(dbUrl, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(DEFAULT_DB_DATA)
                });
                fetchData(); // Reload after init
            } catch(e) { alert("Failed to Initialize DB"); }
        }

        // --- 3. DATA PROCESSING ---
        function processData(data) {
            // 1. Settings
            settings.AdminUrl = data.AdminUrl || "";
            settings.DialogTimeout = data.DialogTimeout || "1m";
            settings.Announcement = data.Announcement || "";
            settings.ShowAnnouncement = data.ShowAnnouncement || false;

            // Update Settings UI
            document.getElementById('confUrl').value = dbUrl;
            document.getElementById('confAdmin').value = settings.AdminUrl;
            document.getElementById('confTime').value = settings.DialogTimeout;
            document.getElementById('confMsg').value = settings.Announcement;
            document.getElementById('confShow').checked = settings.ShowAnnouncement;

            // 2. Users & Bans
            let bans = data.BannedDevices || [];
            if (typeof bans === 'object' && !Array.isArray(bans)) bans = Object.values(bans);
            localData.banned = bans.filter(x => x);

            let users = data.Users || [];
            if (typeof users === 'object' && !Array.isArray(users)) users = Object.values(users);
            
            localData.users = users.map(u => ({
                username: u.Username || u.name || "Unknown",
                password: u.Password || u.pass || "---",
                deviceID: u.DeviceID || u.ID || u.id || "",
                expiry: u.Expiry || u.expiry || ""
            }));

            render();
        }

        // --- 4. RENDER UI ---
        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const search = document.getElementById('search').value.toLowerCase();

            localData.users.forEach((u, index) => {
                const isBanned = localData.banned.includes(u.deviceID);
                const hasID = u.deviceID && u.deviceID.length > 2;
                const isExpired = checkExpired(u.expiry);
                
                // FILTER: Active = Check Date Only
                if (currentFilter === 'active' && isExpired) return;
                
                // FILTER: Banned
                if (currentFilter === 'banned' && !isBanned) return;

                // Search
                if (search && !u.username.toLowerCase().includes(search)) return;

                // VISUALS
                let cardClass = 'active'; 
                let statusTxt = 'ACTIVE';
                let statusColor = '#00ff9d';
                let devText = u.deviceID || "NO ID";
                let devClass = hasID ? 'linked' : '';

                if (isBanned) { 
                    cardClass = 'banned'; statusTxt = 'BANNED'; statusColor = '#ff0055'; 
                } 
                else if (!hasID) { 
                    statusTxt = 'WAITING'; statusColor = '#00e5ff'; 
                } 
                
                if (isExpired) { 
                    cardClass = 'expired'; statusTxt = 'EXPIRED'; statusColor = '#ffb700'; 
                }

                const html = `
                <div class="card ${cardClass}">
                    <div class="user-head">
                        <div class="u-name">${u.username}</div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.deviceID}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <span class="u-dev" style="font-family:monospace; color:${hasID ? 'var(--primary)' : '#555'}; display:block; margin-bottom:10px;">
                        ${devText}
                    </span>

                    <div class="info-grid">
                        <div class="info-item"><i class="fas fa-key"></i> ${u.password}</div>
                        <div class="info-item"><i class="far fa-clock"></i> ${u.expiry}</div>
                    </div>

                    <div class="actions">
                        <span style="color:${statusColor}; font-weight:bold; font-size:0.8rem; margin-right:auto; align-self:center;">${statusTxt}</span>
                        <button class="btn-icon btn-copy" onclick="copyCreds('${u.username}', '${u.password}')"><i class="fas fa-copy"></i></button>
                        <button class="btn-icon" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon btn-del" onclick="delUser(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
                list.innerHTML += html;
            });

            if (list.innerHTML === "") list.innerHTML = "<div style='text-align:center; color:#555; margin-top:50px;'>No Users Found</div>";
        }

        // --- 5. ACTIONS & SAVING ---
        async function saveData() {
            // Reconstruct full JSON
            const payload = {
                AdminUrl: document.getElementById('confAdmin').value,
                DialogTimeout: document.getElementById('confTime').value,
                Announcement: document.getElementById('confMsg').value,
                ShowAnnouncement: document.getElementById('confShow').checked,
                BannedDevices: localData.banned,
                Users: localData.users.map(u => ({
                    Username: u.username, Password: u.password,
                    DeviceID: u.deviceID, ID: u.deviceID, Expiry: u.expiry
                }))
            };

            try {
                await fetch(dbUrl, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                fetchData();
            } catch (e) { alert("Save Failed"); }
        }

        function toggleBan(id) {
            if(!id || id.length < 3) return alert("User has no Device ID.");
            const idx = localData.banned.indexOf(id);
            if(idx > -1) localData.banned.splice(idx, 1);
            else localData.banned.push(id);
            saveData();
        }

        function delUser(idx) {
            if(confirm("Delete User?")) {
                localData.users.splice(idx, 1);
                saveData();
            }
        }

        function saveUser() {
            const idx = document.getElementById('editIdx').value;
            const u = {
                username: document.getElementById('uName').value,
                password: document.getElementById('uPass').value,
                deviceID: document.getElementById('uDev').value,
                expiry: formatDate(document.getElementById('uExp').value)
            };

            if(!u.username) return alert("Username Required");
            if(!u.expiry) {
                 const d = new Date(); d.setDate(d.getDate() + 30);
                 const day = String(d.getDate()).padStart(2,'0');
                 const mo = String(d.getMonth()+1).padStart(2,'0');
                 u.expiry = `${day}/${mo}/${d.getFullYear()}`;
            }

            if(idx !== "") localData.users[idx] = u;
            else localData.users.push(u);

            document.getElementById('modal').style.display = 'none';
            saveData();
        }

        function saveSettings() {
            const newUrl = document.getElementById('confUrl').value;
            if(newUrl) {
                dbUrl = newUrl;
                localStorage.setItem("dbUrl", newUrl);
            }
            saveData(); // Saves specific settings + Users
        }

        // --- 6. UTILITIES ---
        function randomGen() {
            const rnd = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('uName').value = rnd;
            document.getElementById('uPass').value = rnd;
        }
        function makeSame() { document.getElementById('uPass').value = document.getElementById('uName').value; }
        
        function copyCreds(u, p) {
            navigator.clipboard.writeText(`${u}:${p}`).then(() => {
                const t = document.getElementById('toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            });
        }

        function checkExpired(dateStr) {
            if(!dateStr) return false;
            const [d, m, y] = dateStr.split('/');
            return new Date(`${y}-${m}-${d}`) < new Date();
        }

        function resetUrl() { localStorage.removeItem("dbUrl"); window.location.reload(); }

        function formatDate(dateStr) {
            if(!dateStr) return "";
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function switchTab(t) {
            const home = document.getElementById('tabHome');
            const sett = document.getElementById('tabSettings');
            const navH = document.getElementById('navHome');
            const navS = document.getElementById('navSet');

            if(t === 'home') { 
                home.classList.remove('hidden'); sett.classList.add('hidden'); 
                navH.classList.add('active'); navS.classList.remove('active');
            } else { 
                home.classList.add('hidden'); sett.classList.remove('hidden'); 
                navH.classList.remove('active'); navS.classList.add('active');
            }
        }

        function openModal(idx = null) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('editIdx').value = "";
            document.getElementById('uName').value = "";
            document.getElementById('uPass').value = "";
            document.getElementById('uDev').value = "";
            document.getElementById('uExp').value = "";

            if(idx !== null) {
                const u = localData.users[idx];
                document.getElementById('editIdx').value = idx;
                document.getElementById('uName').value = u.username;
                document.getElementById('uPass').value = u.password;
                document.getElementById('uDev').value = u.deviceID;
                if(u.expiry.includes('/')) {
                    const [d,m,y] = u.expiry.split('/');
                    document.getElementById('uExp').value = `${y}-${m}-${d}`;
                }
            }
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        // INIT
        fetchData();
        setInterval(() => { if(document.getElementById('modal').style.display === 'none') fetchData(); }, 10000);
    </script>
</body>
</html>
