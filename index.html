<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- PREMIUM THEME --- */
        :root {
            --bg-body: #0f172a;       /* Deep Slate */
            --bg-card: #1e293b;       /* Lighter Slate */
            --bg-nav: #0f172a;
            --primary: #3b82f6;       /* Professional Blue */
            --primary-light: #60a5fa;
            --success: #10b981;       /* Green */
            --danger: #ef4444;        /* Red */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            position: sticky; top: 0; z-index: 50;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .logo { font-size: 1.1rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .refresh-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .refresh-btn:active { transform: scale(0.95); background: var(--primary); border-color: var(--primary); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* --- STATS BAR --- */
        .stats-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary-light); display: block; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; }

        /* --- CARDS --- */
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 12px; 
            position: relative; 
            transition: all 0.2s; 
            cursor: pointer;
        }
        .card:active { transform: scale(0.99); background: #263345; }
        
        /* Key Card Style */
        .key-row { display: flex; justify-content: space-between; align-items: center; }
        .key-text { font-family: 'Inter', monospace; font-size: 1rem; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
        .badge { font-size: 0.7rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: #334155; color: #cbd5e1; }
        .badge.success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* User Card Style */
        .user-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .user-id { font-weight: 600; color: white; font-size: 0.95rem; }
        .bind-status { font-size: 0.75rem; color: var(--success); display: flex; align-items: center; gap: 5px; font-weight: 500; }
        
        /* --- TOGGLE SWITCH --- */
        .toggle-wrap { display: flex; align-items: center; gap: 8px; }
        .toggle-label { font-size: 0.75rem; color: var(--text-muted); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--danger); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- INPUTS --- */
        .inp-group { margin-bottom: 15px; }
        .inp-label { display: block; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
        .inp { width: 100%; background: #0f172a; border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: 0.2s; }
        .inp:focus { border-color: var(--primary); outline: none; }

        /* --- BUTTONS --- */
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-cancel { background: #334155; margin-top: 10px; }
        .btn-delete { background: none; border: none; color: var(--danger); padding: 5px; cursor: pointer; font-size: 1rem; }

        /* --- NAV BAR --- */
        .nav-container {
            position: fixed; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 100;
        }
        .nav-bar { 
            background: rgba(30, 41, 59, 0.95); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border); 
            padding: 0 10px; height: 65px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            width: 90%; max-width: 400px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
        }
        
        /* Flex fix for icons */
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; transition: 0.3s; height: 100%; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { margin-bottom: 2px; }
        .nav-text { font-size: 0.65rem; font-weight: 600; }

        .fab-wrap { width: 60px; height: 60px; position: relative; display: flex; justify-content: center; }
        .fab { 
            width: 50px; height: 50px; 
            background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.4rem; color: white; 
            position: absolute; top: -20px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); 
            cursor: pointer; transition: 0.2s;
        }
        .fab:active { transform: scale(0.95); }

        /* --- MODAL --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-box { background: var(--bg-card); width: 90%; max-width: 350px; padding: 25px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: white; margin-top: 0; margin-bottom: 20px; }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        
        .toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); 
            background: #1e293b; border: 1px solid var(--primary); color: white; 
            padding: 12px 24px; border-radius: 50px; z-index: 300; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 0.9rem; display: flex; align-items: center; gap: 10px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); font-weight: 500;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-shield-alt" style="color:var(--primary)"></i> VIP ADMIN PANEL</div>
        <button class="refresh-btn" onclick="init()"><i class="fas fa-sync-alt"></i></button>
    </header>

    <div class="container">
        
        <div id="loader" style="text-align: center; padding: 100px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            <p style="color: var(--text-muted); margin-top: 15px; font-size: 0.9rem;">Connecting to Database...</p>
        </div>

        <div id="errorMsg" class="hidden" style="text-align: center; padding: 50px 20px; border: 1px solid var(--danger); border-radius: 12px; background: rgba(239, 68, 68, 0.1);">
            <i class="fas fa-wifi" style="font-size: 2rem; color: var(--danger); margin-bottom: 15px;"></i>
            <h3 style="margin:0 0 10px 0;">Connection Failed</h3>
            <button class="btn-primary" onclick="window.location.reload()" style="background: var(--bg-card); border: 1px solid var(--border); width: auto; padding: 8px 20px;">Retry</button>
        </div>

        <div id="mainContent" class="hidden">
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-val" id="countKeys">0</span>
                    <span class="stat-label">Valid Keys</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="countUsers">0</span>
                    <span class="stat-label">Online Devices</span>
                </div>
            </div>

            <div id="tabKeys">
                <h3 style="margin: 0 0 15px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">Manage Keys</h3>
                <div id="keyList"></div>
            </div>

            <div id="tabUsers" class="hidden">
                 <h3 style="margin: 0 0 15px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">Device Management</h3>
                <div id="userList"></div>
            </div>

            <div id="tabSettings" class="hidden">
                <h3 style="margin: 0 0 15px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">System Config</h3>
                <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                    
                    <div class="inp-group"><label class="inp-label">App Title</label><input type="text" class="inp" id="cfgTitle"></div>
                    <div class="inp-group"><label class="inp-label">Status Message</label><input type="text" class="inp" id="cfgSub"></div>
                    
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="inp-group"><label class="inp-label">Version</label><input type="number" class="inp" id="cfgVer"></div>
                        <div class="inp-group"><label class="inp-label">Duration (Hrs)</label><input type="number" class="inp" id="cfgDur"></div>
                    </div>

                    <div class="inp-group"><label class="inp-label">Admin URL</label><input type="text" class="inp" id="cfgAdminUrl"></div>
                    <div class="inp-group"><label class="inp-label">Update URL</label><input type="text" class="inp" id="cfgUpdUrl"></div>
                    
                    <button class="btn-primary" onclick="saveConfig()">Save Settings</button>
                    
                    <div style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
                        <button class="btn-primary" style="background:#334155;" onclick="resetApp()">Reset Database Link</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modalKey" class="modal-wrap">
        <div class="modal-box">
            <h3 class="modal-title">Generate Keys</h3>
            
            <div class="inp-group">
                <label class="inp-label">Prefix (Optional)</label>
                <input type="text" class="inp" id="keyPrefix" placeholder="VIP">
            </div>

            <div class="inp-group">
                <label class="inp-label">Quantity</label>
                <input type="number" class="inp" id="keyQty" value="1" min="1" max="50">
            </div>

            <button class="btn-primary" onclick="generateKeys()">Generate & Add</button>
            <button class="btn-primary btn-cancel" onclick="document.getElementById('modalKey').style.display='none'">Close</button>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle" style="color:var(--success)"></i>
        <span id="toastMsg">Action Successful</span>
    </div>

    <div class="nav-container">
        <div class="nav-bar">
            <div class="nav-item active" id="navKeys" onclick="switchTab('keys')">
                <i class="fas fa-key"></i>
                <span class="nav-text">Keys</span>
            </div>
            
            <div class="fab-wrap">
                <div class="fab" onclick="openKeyModal()">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            
            <div class="nav-item" id="navUsers" onclick="switchTab('users')">
                <i class="fas fa-users"></i>
                <span class="nav-text">Devices</span>
            </div>
            
            <div class="nav-item" id="navSet" onclick="switchTab('settings')">
                <i class="fas fa-cog"></i>
                <span class="nav-text">Settings</span>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const DEFAULT_URL = "https://appurl-8eec4-default-rtdb.firebaseio.com/.json";
        const DEFAULT_JSON = {
            "Config": { "Title": "DPMods VIP", "Subtitle": "ONLINE", "AppVersion": 1, "KeyDurationHours": 4, "AdminUrl": "", "UpdateUrl": "" },
            "BannedDevices": { "test_ban": "banned" },
            "ActivatedUsers": { "placeholder_user": "active" },
            "ValidKeys": { "VIP-DEMO-KEY": "placeholder" }
        };

        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        let dbData = null;

        // INIT
        async function init() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');

            try {
                const res = await fetch(dbUrl);
                if(!res.ok) throw new Error("Network Error");
                
                let data = await res.json();
                if(data === null) {
                    await fetch(dbUrl, { method: 'PUT', body: JSON.stringify(DEFAULT_JSON) });
                    data = DEFAULT_JSON;
                }
                
                dbData = data;
                ensureStructure();
                render();
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function ensureStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_JSON.Config;
        }

        async function saveData() {
            try {
                await fetch(dbUrl, { method: 'PUT', body: JSON.stringify(dbData) });
                showToast("Database Synced");
            } catch(e) { showToast("Sync Failed"); }
        }

        // RENDER LOGIC
        function render() {
            renderKeys();
            renderUsers();
            fillSettings();
        }

        // --- KEYS ---
        function renderKeys() {
            const list = document.getElementById('keyList');
            list.innerHTML = "";
            const keys = Object.keys(dbData.ValidKeys).reverse();
            document.getElementById('countKeys').innerText = keys.length - (keys.includes('do_not_delete') ? 1 : 0);

            if(keys.length === 0) { list.innerHTML="<p style='text-align:center;color:#666'>No Keys Available</p>"; return; }

            keys.forEach(k => {
                if(k === "do_not_delete") return;
                list.innerHTML += `
                <div class="card" onclick="copyTxt('${k}')">
                    <div class="key-row">
                        <div>
                            <div class="key-text">${k}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Tap to copy</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="badge success">Active</span>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteKey('${k}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function generateKeys() {
            const qty = parseInt(document.getElementById('keyQty').value);
            const prefix = document.getElementById('keyPrefix').value.toUpperCase() || "KEY";
            const chars = "ABCDEF0123456789";

            for(let i=0; i<qty; i++) {
                let rnd = "";
                for(let j=0; j<6; j++) rnd += chars.charAt(Math.floor(Math.random() * chars.length));
                const key = `${prefix}-${rnd}`;
                dbData.ValidKeys[key] = "placeholder";
            }

            document.getElementById('modalKey').style.display = 'none';
            renderKeys();
            saveData();
            showToast(`Generated ${qty} Keys`);
        }

        function deleteKey(k) {
            if(confirm("Delete this key?")) {
                delete dbData.ValidKeys[k];
                renderKeys();
                saveData();
            }
        }

        // --- USERS ---
        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            
            const active = Object.keys(dbData.ActivatedUsers);
            const banned = Object.keys(dbData.BannedDevices);
            
            // Merge lists for display, prioritize display
            const allDevices = [...new Set([...active, ...banned])];
            document.getElementById('countUsers').innerText = active.length;

            if(allDevices.length === 0) { list.innerHTML="<p style='text-align:center;color:#666'>No Devices Found</p>"; return; }

            allDevices.forEach(d => {
                if(d === "do_not_delete" || d === "placeholder_user" || d === "test_ban") return;

                const isBanned = dbData.BannedDevices.hasOwnProperty(d);
                
                list.innerHTML += `
                <div class="card">
                    <div class="user-head">
                        <span class="user-id">${d}</span>
                        <div class="toggle-wrap">
                            <span class="toggle-label">${isBanned ? 'BANNED' : 'ALLOWED'}</span>
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${d}')">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="bind-status">
                        <i class="fas fa-link"></i> Device Bound Successfully
                    </div>
                </div>`;
            });
        }

        function toggleBan(deviceId) {
            const isBanned = dbData.BannedDevices.hasOwnProperty(deviceId);
            
            if(isBanned) {
                // Unban: Remove from banned, ensure in Active
                delete dbData.BannedDevices[deviceId];
                dbData.ActivatedUsers[deviceId] = "active";
                showToast("Device Unbanned");
            } else {
                // Ban: Add to banned, remove from Active (optional, but keeps clean)
                dbData.BannedDevices[deviceId] = "banned";
                // We usually keep them in ActivatedUsers too so we know they were valid once, 
                // but usually banning overrides.
                showToast("Device Banned");
            }
            renderUsers();
            saveData();
        }

        // --- SETTINGS ---
        function fillSettings() {
            const c = dbData.Config;
            document.getElementById('cfgTitle').value = c.Title || "";
            document.getElementById('cfgSub').value = c.Subtitle || "";
            document.getElementById('cfgVer').value = c.AppVersion || 1;
            document.getElementById('cfgDur').value = c.KeyDurationHours || 4;
            document.getElementById('cfgAdminUrl').value = c.AdminUrl || "";
            document.getElementById('cfgUpdUrl').value = c.UpdateUrl || "";
        }

        function saveConfig() {
            const c = dbData.Config;
            c.Title = document.getElementById('cfgTitle').value;
            c.Subtitle = document.getElementById('cfgSub').value;
            c.AppVersion = parseInt(document.getElementById('cfgVer').value);
            c.KeyDurationHours = parseInt(document.getElementById('cfgDur').value);
            c.AdminUrl = document.getElementById('cfgAdminUrl').value;
            c.UpdateUrl = document.getElementById('cfgUpdUrl').value;
            saveData();
        }

        // --- UTILS ---
        function switchTab(t) {
            document.getElementById('tabKeys').classList.add('hidden');
            document.getElementById('tabUsers').classList.add('hidden');
            document.getElementById('tabSettings').classList.add('hidden');
            
            document.getElementById('navKeys').classList.remove('active');
            document.getElementById('navUsers').classList.remove('active');
            document.getElementById('navSet').classList.remove('active');

            if(t === 'keys') {
                document.getElementById('tabKeys').classList.remove('hidden');
                document.getElementById('navKeys').classList.add('active');
            } else if(t === 'users') {
                document.getElementById('tabUsers').classList.remove('hidden');
                document.getElementById('navUsers').classList.add('active');
            } else {
                document.getElementById('tabSettings').classList.remove('hidden');
                document.getElementById('navSet').classList.add('active');
            }
        }

        function openKeyModal() {
            document.getElementById('modalKey').style.display = 'flex';
        }

        function copyTxt(txt) {
            navigator.clipboard.writeText(txt).then(() => showToast("Copied to Clipboard"));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function resetApp() {
            if(confirm("Disconnect from current database?")) {
                localStorage.removeItem("dbUrl");
                window.location.reload();
            }
        }

        // START
        init();
    </script>
</body>
</html>
