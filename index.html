<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Admin V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --bg: #050508; --card: #0e0e14; --nav: #161621; 
            --accent: #00e5ff; --text: #ffffff; --muted: #94a3b8; 
            --border: rgba(255, 255, 255, 0.08); 
            --green: #00ff9d; --red: #ff0055;
        }
        [data-theme="blood"] { --bg:#1a0505; --card:#2b0a0a; --nav:#360000; --accent:#ff0033; --green:#ff3333; --red:#ff0033; }
        [data-theme="matrix"] { --bg:#000000; --card:#051a05; --nav:#001100; --accent:#00ff00; --green:#00ff00; --red:#008800; }
        [data-theme="cherry"] { --bg:#1a0f14; --card:#26161c; --nav:#331e26; --accent:#ff66b2; --green:#ff99cc; --red:#ff3366; }
        [data-theme="naruto"] { --bg:#0a0500; --card:rgba(40, 20, 0, 0.8); --nav:#1a0d00; --accent:#ff9100; --green:#ffae00; --red:#ff4500; }
        [data-theme="itachi"] { --bg:#080000; --card:rgba(30, 0, 0, 0.8); --nav:#1a0000; --accent:#ff0000; --green:#ff3333; --red:#880000; }
        [data-theme="demonslayer"] { --bg:#000805; --card:rgba(0, 30, 20, 0.8); --nav:#001a14; --accent:#00ffaa; --green:#00e676; --red:#ff0055; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; transition: background 0.3s; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* HEADER */
        header { position: sticky; top: 0; z-index: 50; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--accent); }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.95); background: var(--accent); color: #000; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }

        /* CONTROLS */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .search { position: relative; flex: 1; }
        .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .input-std { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 12px 12px 12px 42px; color: var(--text); border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        
        .btn-main { background: var(--accent); color: #000; border: none; padding: 0 16px; height: 42px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 0.85rem; }
        .btn-danger { background: rgba(255, 0, 85, 0.15); color: var(--red); border: 1px solid var(--red); padding: 0 14px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-danger:active { background: var(--red); color: white; }

        /* CARDS */
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .item-card.selected { border-color: var(--accent); background: rgba(0, 229, 255, 0.05); }
        
        .row-top { display: flex; align-items: center; gap: 12px; }
        .mono-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 0.95rem; word-break: break-all; flex: 1; }
        
        /* CUSTOM CHECKBOX */
        .chk-wrap { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
        .custom-chk { appearance: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 6px; background: transparent; cursor: pointer; position: relative; transition: 0.2s; }
        .custom-chk:checked { background: var(--accent); border-color: var(--accent); }
        .custom-chk:checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: #000; font-size: 12px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .meta-row { border-top: 1px solid var(--border); padding-top: 10px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); align-items: center; }
        .badge { font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; }
        .badge.active { background: rgba(0, 255, 157, 0.15); color: var(--green); }
        .badge.banned { background: rgba(255, 0, 85, 0.15); color: var(--red); }

        /* SWITCH */
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #222; border-radius: 24px; transition: .3s; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: rgba(255, 0, 85, 0.2); border-color: var(--red); }
        input:checked + .slider:before { transform: translateX(20px); background: var(--red); }
        
        /* BULK ACTION BAR */
        .bulk-bar { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--nav); border: 1px solid var(--red); padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 98; opacity: 0; transition: 0.4s; }
        .bulk-bar.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .bulk-btn { background: var(--red); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        /* NAV */
        .nav-fixed { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 99; }
        .nav-inner { background: var(--nav); border: 1px solid var(--border); padding: 0 20px; height: 70px; border-radius: 24px; width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 1.2rem; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); transform: translateY(-3px); }
        
        /* ERROR & MODAL */
        .error-box { text-align: center; padding: 40px 20px; border: 1px solid var(--red); border-radius: 24px; background: rgba(255, 0, 85, 0.08); margin-top: 50px; }
        .debug-box { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; margin: 20px 0; text-align: left; word-break: break-all; font-family: monospace; color: #ddd; font-size: 0.75rem; border: 1px solid var(--border); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card); width: 90%; max-width: 340px; padding: 30px; border-radius: 24px; border: 1px solid var(--border); }
        .inp-group { margin-bottom: 15px; }
        .inp-label { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 800; margin-bottom: 6px; }
        .btn-block { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 800; margin-top: 10px; cursor: pointer; }
        .btn-text { background: transparent; color: var(--muted); margin-top: 10px; width: 100%; border: none; padding: 10px; cursor: pointer; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--nav); border: 1px solid var(--accent); color: var(--text); padding: 12px 25px; border-radius: 50px; z-index: 300; transition: 0.4s; display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="brand"><i class="fas fa-cube"></i> GATEWAY V5</div>
        <div style="display:flex; gap:10px">
            <div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-palette"></i></div>
            <div class="icon-btn" onclick="appInit()"><i class="fas fa-sync-alt"></i></div>
        </div>
    </header>

    <div class="container">
        
        <div id="viewLoader" style="text-align: center; padding: 100px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent);"></i>
            <p style="color: var(--muted); margin-top: 20px; font-weight: 600;">ESTABLISHING UPLINK...</p>
        </div>

        <div id="viewError" class="hidden error-box">
            <i class="fas fa-wifi" style="font-size: 3rem; color: var(--red); margin-bottom: 15px;"></i>
            <h3 style="color: var(--red); margin: 0;">Connection Failed</h3>
            <p style="color: var(--muted); margin: 10px 0;" id="errorText">Network Error</p>
            <div class="debug-box">
                <strong>TARGET:</strong><br><span id="debugUrl" style="color: var(--accent);">...</span>
            </div>
            <button class="btn-block" style="background: #222; color: white; border:1px solid #444;" onclick="hardReset()">HARD RESET URL</button>
        </div>

        <div id="viewDashboard" class="hidden">
            
            <div class="stats-row" style="display:flex; gap:10px; margin-bottom:20px;">
                <div class="stat-card" style="flex:1; background:var(--card); padding:15px; border-radius:16px; border:1px solid var(--border); text-align:center;">
                    <span style="font-size:1.8rem; font-weight:800; color:var(--accent);" id="statKeys">0</span>
                    <span style="font-size:0.7rem; font-weight:700; color:var(--muted); text-transform:uppercase;">Keys</span>
                </div>
                <div class="stat-card" style="flex:1; background:var(--card); padding:15px; border-radius:16px; border:1px solid var(--border); text-align:center;">
                    <span style="font-size:1.8rem; font-weight:800; color:var(--green);" id="statDevs">0</span>
                    <span style="font-size:0.7rem; font-weight:700; color:var(--muted); text-transform:uppercase;">Devices</span>
                </div>
            </div>

            <div id="tabKeys">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchKeys" placeholder="Search Keys..." onkeyup="renderKeys()"></div>
                    <button class="btn-danger" onclick="nukeAllKeys()"><i class="fas fa-trash"></i></button>
                    <button class="btn-main" onclick="openModal('modalKey')"><i class="fas fa-plus"></i> NEW</button>
                </div>
                <div id="listKeys"></div>
            </div>

            <div id="tabDevices" class="hidden">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchDevs" placeholder="Search Devices..." onkeyup="renderDevices()"></div>
                    <button class="btn-danger" onclick="nukeAllDevices()"><i class="fas fa-trash"></i></button>
                </div>
                <div class="chips" style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn-main" style="height:30px; font-size:0.75rem; background:var(--card); border:1px solid var(--border); color:var(--muted);" onclick="setDevFilter('all', this)">All</button>
                    <button class="btn-main" style="height:30px; font-size:0.75rem; background:var(--card); border:1px solid var(--border); color:var(--muted);" onclick="setDevFilter('allowed', this)">Allowed</button>
                    <button class="btn-main" style="height:30px; font-size:0.75rem; background:var(--card); border:1px solid var(--border); color:var(--muted);" onclick="setDevFilter('banned', this)">Banned</button>
                </div>
                <div id="listDevices"></div>
            </div>

            <div id="tabConfig" class="hidden">
                <h3 style="margin-bottom:15px; color:var(--text); font-weight:800;">System Config</h3>
                <div class="item-card">
                    <div class="inp-group"><label class="inp-label">APP TITLE</label><input type="text" class="input-std" id="confTitle"></div>
                    <div class="inp-group"><label class="inp-label">SUBTITLE</label><input type="text" class="input-std" id="confSub"></div>
                    <div class="inp-group"><label class="inp-label">ADMIN CONTACT</label><input type="text" class="input-std" id="confUrl"></div>
                    <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                    <div class="inp-group"><label class="inp-label">API BASE URL</label><input type="text" class="input-std" id="confApiUrl"></div>
                    <div class="inp-group"><label class="inp-label">API TOKEN</label><input type="text" class="input-std" id="confApiToken"></div>
                    <div class="inp-group"><label class="inp-label">SECRET KEY</label><input type="text" class="input-std" id="confApiSecret"></div>
                    <button class="btn-block" onclick="saveConfig()">SAVE CHANGES</button>
                    <button class="btn-text" onclick="hardReset()">RESET CONNECTION</button>
                </div>
            </div>

        </div>
    </div>

    <div id="bulkBar" class="bulk-bar">
        <span style="color:white; font-size:0.8rem; font-weight:600;"><span id="selCount">0</span> Selected</span>
        <button class="bulk-btn" onclick="deleteSelectedItems()"><i class="fas fa-trash"></i> DELETE</button>
    </div>

    <div id="modalKey" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0;">Generate Keys</h3>
            <div class="inp-group"><label class="inp-label">PREFIX</label><input type="text" class="input-std" id="keyPrefix" value="VIP"></div>
            <div class="inp-group"><label class="inp-label">QUANTITY</label><input type="number" class="input-std" id="keyQty" value="1"></div>
            <button class="btn-block" onclick="generateKeys()">GENERATE</button>
            <button class="btn-text" onclick="closeModal('modalKey')">CANCEL</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle" style="color:var(--green)"></i><span>Action Successful</span></div>

    <div class="nav-fixed">
        <div class="nav-inner">
            <div class="nav-btn active" id="navKey" onclick="switchTab('keys')"><i class="fas fa-key"></i><span class="nav-lbl">KEYS</span></div>
            <div class="nav-btn" id="navDev" onclick="switchTab('devices')"><i class="fas fa-mobile-alt"></i><span class="nav-lbl">DEVICES</span></div>
            <div class="nav-btn" id="navConf" onclick="switchTab('config')"><i class="fas fa-sliders-h"></i><span class="nav-lbl">CONFIG</span></div>
        </div>
    </div>

    <script>
        // --- 1. SAFE VARS ---
        const HARDCODED_URL = "https://appurl-8eec4-default-rtdb.firebaseio.com";
        const DEFAULT_DATA = { 
            "Config": { "Title": "Gateway VIP", "Subtitle": "ONLINE", "AdminUrl": "", "UpdateUrl": "", "Api": { "BaseUrl": "", "Token": "", "Secret": "" } }, 
            "BannedDevices": { "test_ban": "banned" }, 
            "ActivatedUsers": { "placeholder": "active" }, 
            "ValidKeys": { "VIP-DEMO": new Date().toISOString() } 
        };

        let dbUrl = localStorage.getItem("dbUrl") || HARDCODED_URL;
        let dbData = null;
        let devFilter = 'all';
        let themes = ['cyberpunk', 'blood', 'matrix', 'cherry', 'naruto', 'itachi', 'demonslayer'];
        let curThemeIdx = 0;
        let selectedKeys = new Set();
        let selectedDevs = new Set();

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let accentColor = "rgba(0, 229, 255, 0.3)";

        // --- 2. URL FIXER ---
        function sanitizeUrl(url) {
            let clean = url ? url.trim() : "";
            if (!clean) return HARDCODED_URL + "/.json";
            if (clean.includes("firebaseio.com")) clean = clean.split("firebaseio.com")[0] + "firebaseio.com";
            return clean + "/.json";
        }
        if (!dbUrl.includes("appurl-8eec4")) { dbUrl = HARDCODED_URL; localStorage.setItem("dbUrl", dbUrl); }

        // --- 3. CORE LOGIC ---
        async function appInit() {
            document.getElementById('viewLoader').classList.remove('hidden');
            document.getElementById('viewError').classList.add('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');

            const finalUrl = sanitizeUrl(dbUrl) + "?t=" + Date.now();
            document.getElementById('debugUrl').innerText = finalUrl;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(finalUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                let data = await response.json();
                if (!data) {
                    await fetch(sanitizeUrl(dbUrl), { method: 'PUT', body: JSON.stringify(DEFAULT_DATA) });
                    data = DEFAULT_DATA;
                }
                dbData = data;
                ensureDataStructure();
                renderAll();
                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewDashboard').classList.remove('hidden');
            } catch (err) {
                console.error(err);
                document.getElementById('errorText').innerText = err.message;
                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewError').classList.remove('hidden');
            }
        }

        function ensureDataStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_DATA.Config;
            if(!dbData.Config.Api) dbData.Config.Api = { BaseUrl: "", Token: "", Secret: "" };
        }

        async function syncDB() {
            try { await fetch(sanitizeUrl(dbUrl), { method: 'PUT', body: JSON.stringify(dbData) }); showToast("Saved"); } 
            catch (e) { showToast("Save Failed"); }
        }

        // --- 4. RENDERERS ---
        function renderAll() {
            renderKeys();
            renderDevices();
            // Config
            document.getElementById('confTitle').value = dbData.Config.Title || "";
            document.getElementById('confSub').value = dbData.Config.Subtitle || "";
            document.getElementById('confUrl').value = dbData.Config.AdminUrl || "";
            document.getElementById('confApiUrl').value = dbData.Config.Api.BaseUrl || "";
            document.getElementById('confApiToken').value = dbData.Config.Api.Token || "";
            document.getElementById('confApiSecret').value = dbData.Config.Api.Secret || "";
            // Stats
            document.getElementById('statKeys').innerText = Object.keys(dbData.ValidKeys).length;
            document.getElementById('statDevs').innerText = Object.keys(dbData.ActivatedUsers).length;
        }

        function renderKeys() {
            const list = document.getElementById('listKeys');
            const search = document.getElementById('searchKeys').value.toLowerCase();
            list.innerHTML = "";
            
            Object.keys(dbData.ValidKeys).reverse().forEach(key => {
                if (search && !key.toLowerCase().includes(search)) return;
                const isSel = selectedKeys.has(key);
                let dateStr = "Manual";
                try { const d = new Date(dbData.ValidKeys[key]); if(!isNaN(d)) dateStr = d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); } catch(e){}

                list.innerHTML += `
                <div class="item-card ${isSel?'selected':''}">
                    <div class="row-top">
                        <div class="chk-wrap" onclick="toggleSelKey('${key}')">
                            <input type="checkbox" class="custom-chk" ${isSel?'checked':''}>
                        </div>
                        <span class="mono-text" onclick="copy('${key}')">${key}</span>
                    </div>
                    <div class="meta-row">
                        <span><i class="far fa-clock"></i> ${dateStr}</span>
                        <span class="badge active">ACTIVE</span>
                    </div>
                </div>`;
            });
            updateBulkBar();
        }

        function renderDevices() {
            const list = document.getElementById('listDevices');
            const search = document.getElementById('searchDevs').value.toLowerCase();
            list.innerHTML = "";
            const allDevs = [...new Set([...Object.keys(dbData.ActivatedUsers), ...Object.keys(dbData.BannedDevices)])];

            allDevs.forEach(dev => {
                if(dev === "placeholder" || dev === "test_ban") return;
                if(search && !dev.toLowerCase().includes(search)) return;
                const isBanned = dbData.BannedDevices[dev] !== undefined;
                if (devFilter === 'allowed' && isBanned) return;
                if (devFilter === 'banned' && !isBanned) return;
                
                const isSel = selectedDevs.has(dev);

                list.innerHTML += `
                <div class="item-card ${isSel?'selected':''}" style="border-left: 3px solid ${isBanned ? 'var(--red)' : 'var(--green)'}">
                    <div class="user-row">
                        <div style="display:flex; align-items:center; gap:10px; flex:1; overflow:hidden;">
                            <div class="chk-wrap" onclick="toggleSelDev('${dev}')">
                                <input type="checkbox" class="custom-chk" ${isSel?'checked':''}>
                            </div>
                            <span class="mono-text" style="color:var(--text); font-size:0.85rem;" onclick="copy('${dev}')">${dev}</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${dev}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="meta-row" style="border:none; padding-top:5px;">
                        <span class="badge ${isBanned?'banned':'active'}">${isBanned ? 'BANNED' : 'ALLOWED'}</span>
                    </div>
                </div>`;
            });
            updateBulkBar();
        }

        // --- 5. SELECTION & BULK ---
        function toggleSelKey(k) {
            if(selectedKeys.has(k)) selectedKeys.delete(k); else selectedKeys.add(k);
            renderKeys();
        }
        function toggleSelDev(d) {
            if(selectedDevs.has(d)) selectedDevs.delete(d); else selectedDevs.add(d);
            renderDevices();
        }
        function updateBulkBar() {
            const count = selectedKeys.size + selectedDevs.size;
            const bar = document.getElementById('bulkBar');
            document.getElementById('selCount').innerText = count;
            if(count > 0) bar.classList.add('show'); else bar.classList.remove('show');
        }
        function deleteSelectedItems() {
            if(!confirm(`Delete ${selectedKeys.size} Keys and ${selectedDevs.size} Devices?`)) return;
            selectedKeys.forEach(k => delete dbData.ValidKeys[k]);
            selectedDevs.forEach(d => { delete dbData.ActivatedUsers[d]; delete dbData.BannedDevices[d]; });
            selectedKeys.clear(); selectedDevs.clear();
            renderAll(); syncDB();
        }
        function nukeAllKeys() {
            if(confirm("DANGER: Delete ALL Keys? This cannot be undone.")) {
                dbData.ValidKeys = { "VIP-DEMO": new Date().toISOString() };
                renderAll(); syncDB();
            }
        }
        function nukeAllDevices() {
            if(confirm("DANGER: Delete ALL Devices? Users will be logged out.")) {
                dbData.ActivatedUsers = { "placeholder": "active" };
                dbData.BannedDevices = { "test_ban": "banned" };
                renderAll(); syncDB();
            }
        }

        // --- 6. ACTIONS ---
        function generateKeys() {
            const qty = document.getElementById('keyQty').value;
            const prefix = document.getElementById('keyPrefix').value.toUpperCase();
            for(let i=0; i<qty; i++) {
                const rnd = Math.random().toString(36).substring(2, 8).toUpperCase();
                dbData.ValidKeys[`${prefix}-${rnd}`] = new Date().toISOString();
            }
            closeModal('modalKey'); renderAll(); syncDB();
        }
        function toggleBan(dev) {
            if (dbData.BannedDevices[dev]) { delete dbData.BannedDevices[dev]; dbData.ActivatedUsers[dev] = "active"; }
            else { dbData.BannedDevices[dev] = "banned"; }
            renderAll(); syncDB();
        }
        function saveConfig() {
            dbData.Config.Title = document.getElementById('confTitle').value;
            dbData.Config.Subtitle = document.getElementById('confSub').value;
            dbData.Config.AdminUrl = document.getElementById('confUrl').value;
            dbData.Config.Api.BaseUrl = document.getElementById('confApiUrl').value;
            dbData.Config.Api.Token = document.getElementById('confApiToken').value;
            dbData.Config.Api.Secret = document.getElementById('confApiSecret').value;
            syncDB();
        }

        // --- 7. UTILS ---
        function hardReset() { localStorage.removeItem("dbUrl"); location.reload(); }
        function showToast(msg) { const t=document.getElementById('toast'); t.querySelector('span').innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
        function copy(txt) { navigator.clipboard.writeText(txt); showToast("Copied"); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function switchTab(tab) {
            ['Keys','Devices','Config'].forEach(t => document.getElementById(`tab${t}`).classList.add('hidden'));
            ['Key','Dev','Conf'].forEach(n => document.getElementById(`nav${n}`).classList.remove('active'));
            if(tab === 'keys') { document.getElementById('tabKeys').classList.remove('hidden'); document.getElementById('navKey').classList.add('active'); }
            else if(tab === 'devices') { document.getElementById('tabDevices').classList.remove('hidden'); document.getElementById('navDev').classList.add('active'); }
            else { document.getElementById('tabConfig').classList.remove('hidden'); document.getElementById('navConf').classList.add('active'); }
        }
        function setDevFilter(f, el) { 
            devFilter=f; document.querySelectorAll('.chip button').forEach(b=>b.style.background='var(--card)'); el.style.background='var(--accent)'; el.style.color='#000'; renderDevices(); 
        }

        // --- 8. ANIMATION ---
        function toggleTheme() {
            curThemeIdx = (curThemeIdx + 1) % themes.length;
            const theme = themes[curThemeIdx];
            document.documentElement.setAttribute('data-theme', theme);
            accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            showToast(`Theme: ${theme.toUpperCase()}`);
        }
        function initParticles() {
            canvas.width=window.innerWidth; canvas.height=window.innerHeight;
            for(let i=0; i<60; i++) parts.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:(Math.random()*0.5)+0.2, s:Math.random()*2 });
            animate();
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle=accentColor; ctx.globalAlpha=0.4;
            parts.forEach(p=>{ p.y-=p.v; if(p.y<0)p.y=canvas.height; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', ()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });

        // START
        document.documentElement.setAttribute('data-theme', 'cyberpunk'); 
        initParticles();
        appInit();
    </script>
</body>
</html>
