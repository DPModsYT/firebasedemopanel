<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods V6 Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;
            --success: #00ff99;
            --glass-bg: linear-gradient(160deg, rgba(30, 30, 45, 0.7) 0%, rgba(10, 10, 20, 0.9) 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --grad-main: linear-gradient(135deg, #7000ff 0%, #00e5ff 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND PARTICLES --- */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 10%, #1a0b2e 0%, #000000 90%);
        }

        .container { max-width: 720px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px;
            background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; 
            display: flex; align-items: center; gap: 12px; letter-spacing: 1px;
        }
        .status-dot { 
            width: 10px; height: 10px; background: var(--success); border-radius: 50%; 
            box-shadow: 0 0 15px var(--success); animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.6; transform: scale(0.9); } }

        /* --- CARDS --- */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 20px; margin-bottom: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
        }
        .glass-card:hover { border-color: rgba(112, 0, 255, 0.3); }

        /* --- USER LIST --- */
        .user-item {
            display: flex; flex-direction: column; gap: 12px;
            border-left: 4px solid var(--primary);
            position: relative; overflow: hidden;
        }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.8; }
        .user-item.banned::after {
            content: 'BANNED'; position: absolute; right: -25px; top: 15px;
            background: var(--accent); color: white; font-size: 0.6rem;
            padding: 5px 30px; transform: rotate(45deg); font-weight: bold;
            box-shadow: 0 0 10px var(--accent);
        }

        .user-header h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; }
        .user-header .device-id { color: var(--text-muted); font-size: 0.85rem; font-family: monospace; display: block; margin-top: 4px; }
        
        .user-badges { display: flex; gap: 8px; margin-top: 5px; }
        .badge { 
            font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; 
            background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid transparent;
        }
        .badge.pass { border-color: #555; }
        .badge.exp { border-color: var(--primary); color: var(--primary); background: rgba(0, 229, 255, 0.1); }

        /* --- ACTION BAR --- */
        .action-row { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); 
        }

        .btn-icon {
            width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
            background: rgba(255,255,255,0.08); color: #fff; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .btn-edit:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        .btn-delete:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); }

        /* --- TOGGLE --- */
        .switch-container { display: flex; align-items: center; gap: 10px; }
        .switch-label { font-size: 0.75rem; color: #888; font-weight: 600; text-transform: uppercase; }
        
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a2a35; transition: .4s; border-radius: 34px; border: 1px solid #444;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: #aaa; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* --- MODALS --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 200;
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal.show { opacity: 1; }
        
        .modal-content {
            background: #151520; border: 1px solid rgba(112, 0, 255, 0.3);
            width: 90%; max-width: 400px; padding: 25px; border-radius: 20px;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.15); transform: scale(0.95); transition: transform 0.3s;
        }
        .modal.show .modal-content { transform: scale(1); }

        label { display: block; color: var(--primary); margin: 15px 0 5px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            padding: 14px; border-radius: 10px; color: #fff; font-family: 'Poppins', sans-serif;
            transition: 0.3s; font-size: 0.95rem;
        }
        input:focus { border-color: var(--secondary); box-shadow: 0 0 15px rgba(112, 0, 255, 0.2); }

        .btn-main {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--grad-main); color: #fff; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; margin-top: 25px;
            box-shadow: 0 8px 20px rgba(112, 0, 255, 0.3); transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.98); }

        /* --- NAV --- */
        nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; padding: 10px 30px;
            display: flex; gap: 40px; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 90;
        }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 15px var(--primary); }
        .fab-add {
            background: var(--grad-main); color: #fff; width: 65px; height: 65px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; cursor: pointer; margin-top: -45px; border: 5px solid var(--bg-deep);
            box-shadow: 0 0 25px rgba(112, 0, 255, 0.6); transition: 0.3s;
        }
        .fab-add:hover { transform: scale(1.1) rotate(90deg); }

        /* --- LOADER --- */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-box { border: 1px solid var(--accent); background: rgba(255, 0, 85, 0.1); color: var(--accent); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.8rem; font-family: monospace; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V6</div>
        <div style="font-size: 0.75rem; color: #aaa; font-weight: 600; letter-spacing: 1px;">ADMIN CONSOLE</div>
    </header>

    <div class="container">
        
        <div id="tabDevices">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-users" style="color: var(--primary)"></i> User Database
            </h2>
            
            <div id="userList">
                <div class="glass-card" style="text-align: center; color: #888; padding: 50px 20px;">
                    <div class="loader"></div>
                    <div id="loadingText">Connecting to Firebase...</div>
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-sliders-h" style="color: var(--secondary)"></i> Configuration
            </h2>
            <div class="glass-card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl" placeholder="https://t.me/...">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout" placeholder="e.g. 1m, 30s">

                <div style="margin-top: 25px; display:flex; align-items:center; gap:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                    <label class="switch" style="margin:0;">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color:#fff; font-size:0.9rem; font-weight:600;">Show Announcement</span>
                </div>

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3" placeholder="Enter message..."></textarea>

                <button class="btn-main" onclick="saveSettings()">Update Config</button>
            </div>
        </div>

    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #fff; margin: 0 0 20px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;">USER DETAILS</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label>
            <input type="text" id="inpUser" placeholder="Enter username">

            <label>Password</label>
            <input type="text" id="inpPass" placeholder="Enter password">

            <label>Device ID</label>
            <input type="text" id="inpDevice" placeholder="Hardware ID">

            <label>Expiry Date</label>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button onclick="setExpiry(30)" style="flex:1; padding:8px; background:#2a2a35; color:#fff; border:1px solid #444; border-radius:6px; cursor:pointer;">+30 Days</button>
                <button onclick="setExpiry(365)" style="flex:1; padding:8px; background:#2a2a35; color:#fff; border:1px solid #444; border-radius:6px; cursor:pointer;">+1 Year</button>
            </div>
            <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-main" style="background:#222; margin-top:0;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" style="margin-top:0;" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-user-shield"></i></div>
        <div class="fab-add" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-cog"></i></div>
    </nav>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIG (STRICT MODE)
        // ==========================================
        // WE FORCE THE .json EXTENSION HERE
        const RAW_URL = "https://awesome-6004e.firebaseio.com";
        const API_URL = RAW_URL.endsWith('/') ? `${RAW_URL}.json` : `${RAW_URL}/.json`;
        
        let dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
        let lastJsonString = "";
        let isModalOpen = false;
        let connectionTimer = null;

        // ==========================================
        // 2. LOGIC
        // ==========================================
        async function fetchData() {
            if(isModalOpen) return;

            // Timeout Check
            const loadText = document.getElementById('loadingText');
            if(loadText) loadText.innerText = "Connecting...";

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const val = await response.json();

                // HANDLE NULL (Empty Database)
                if (!val) {
                    dbData.Users = []; // Initialize empty
                    renderUsers();
                    return;
                }

                const newJson = JSON.stringify(val);
                if (newJson === lastJsonString) return; 
                lastJsonString = newJson;

                // --- DATA NORMALIZATION ---
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";
                dbData.BannedDevices = val.BannedDevices || [];

                // Handle Users Object vs Array
                let usersRaw = val.Users || [];
                if (typeof usersRaw === 'object' && !Array.isArray(usersRaw)) {
                    usersRaw = Object.values(usersRaw);
                }

                // Map fields intelligently
                dbData.Users = usersRaw.map(u => ({
                    Username: u.Username || "User",
                    Password: u.Password || "---",
                    // Prioritize DeviceID, fallback to ID, fallback to placeholder
                    DeviceID: u.DeviceID || u.ID || "No_ID", 
                    Expiry: u.Expiry || ""
                }));

                renderUsers();
                fillSettings();

            } catch (error) {
                console.error("Fetch Error:", error);
                const list = document.getElementById('userList');
                // Only show error if we haven't loaded data yet
                if(dbData.Users.length === 0) {
                     list.innerHTML = `
                    <div class="glass-card status-msg" style="text-align:center; padding:30px;">
                        <i class="fas fa-wifi" style="color: var(--accent); font-size:2rem; margin-bottom:10px;"></i>
                        <div>Connection Failed</div>
                        <div class="error-box">${error.message}<br>Check if Firebase Rules are 'true'</div>
                        <button class="btn-main" onclick="fetchData()" style="padding:10px; margin-top:15px;">Retry</button>
                    </div>`;
                }
            }
        }

        // Poll every 2 seconds
        setInterval(fetchData, 2000);
        // Initial Fetch
        fetchData();

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (!dbData.Users || dbData.Users.length === 0) {
                list.innerHTML = `
                <div class="glass-card" style="text-align: center; padding: 40px; color: #888;">
                    <i class="fas fa-folder-open" style="font-size: 2rem; margin-bottom: 15px; opacity:0.5;"></i><br>
                    No Users Found.<br>Click <strong style="color:var(--primary)">+</strong> to add one.
                </div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);

                const div = document.createElement('div');
                div.className = `glass-card user-item ${isBanned ? 'banned' : ''}`;
                
                div.innerHTML = `
                    <div class="user-header">
                        <div class="user-info">
                            <h4>${u.Username}</h4>
                            <span class="device-id"><i class="fas fa-microchip"></i> ${u.DeviceID}</span>
                            <div class="user-badges">
                                <span class="badge pass"><i class="fas fa-key"></i> ${u.Password}</span>
                                <span class="badge exp"><i class="far fa-clock"></i> ${u.Expiry}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="action-row">
                        <div class="switch-container">
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                            <span class="switch-label">${isBanned ? 'Banned' : 'Active'}</span>
                        </div>
                        
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon btn-edit" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-delete" onclick="deleteUser(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- DATABASE ACTIONS ---
        async function saveData(newData) {
            try {
                await fetch(API_URL, {
                    method: 'PUT', // PUT rep
