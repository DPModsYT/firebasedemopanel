<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #050508; --card: #0e0e14; --nav: #161621; --accent: #00e5ff; --text: #ffffff; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); --green: #00ff9d; --red: #ff0055; }
        [data-theme="blood"] { --bg:#1a0505; --card:#2b0a0a; --nav:#360000; --accent:#ff0033; --green:#ff3333; --red:#ff0033; }
        [data-theme="matrix"] { --bg:#000000; --card:#051a05; --nav:#001100; --accent:#00ff00; --green:#00ff00; --red:#008800; }
        [data-theme="cherry"] { --bg:#1a0f14; --card:#26161c; --nav:#331e26; --accent:#ff66b2; --green:#ff99cc; --red:#ff3366; }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; overflow-x: hidden; transition: background 0.3s; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        header { position: sticky; top: 0; z-index: 50; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--accent); }
        .icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-btn:active { transform: scale(0.95); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }

        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .search { position: relative; flex: 1; }
        .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .input-std { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 12px 12px 12px 42px; color: var(--text); border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        .row-top { display: flex; justify-content: space-between; align-items: center; }
        .mono-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 0.95rem; word-break: break-all; }
        .meta-row { border-top: 1px solid var(--border); padding-top: 10px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
        .badge { color: var(--green); font-weight: 700; text-transform: uppercase; }
        .badge.banned { color: var(--red); }

        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 24px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: var(--red); }
        input:checked + .slider:before { transform: translateX(20px); }

        .nav-fixed { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 99; }
        .nav-inner { background: var(--nav); border: 1px solid var(--border); padding: 0 15px; height: 65px; border-radius: 20px; width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 1.2rem; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); transform: translateY(-2px); text-shadow: 0 0 10px rgba(0,229,255,0.3); }
        .nav-lbl { font-size: 0.65rem; margin-top: 4px; font-weight: 700; }

        .error-box { text-align: center; padding: 30px 20px; border: 1px solid var(--red); border-radius: 16px; background: rgba(255, 0, 85, 0.05); margin-top: 50px; }
        .debug-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; margin: 20px 0; text-align: left; word-break: break-all; font-family: monospace; color: #ddd; font-size: 0.8rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card); width: 90%; max-width: 320px; padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .btn-block { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 700; margin-top: 10px; }
        .btn-text { background: transparent; color: var(--muted); margin-top: 10px; width: 100%; border: none; padding: 10px; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--card); border: 1px solid var(--accent); color: var(--text); padding: 12px 25px; border-radius: 30px; z-index: 300; transition: 0.4s; display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="brand"><i class="fas fa-cube"></i> GATEWAY</div>
        <div style="display:flex; gap:10px">
            <div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-palette"></i></div>
            <div class="icon-btn" onclick="appInit()"><i class="fas fa-sync-alt"></i></div>
        </div>
    </header>

    <div class="container">
        
        <div id="viewLoader" style="text-align: center; padding: 100px 0;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent);"></i>
            <p style="color: var(--muted); margin-top: 20px; font-weight: 600;">SYNCING DATABASE...</p>
        </div>

        <div id="viewError" class="hidden error-box">
            <i class="fas fa-wifi" style="font-size: 3rem; color: var(--red); margin-bottom: 15px;"></i>
            <h3 style="color: var(--red); margin: 0;">Connection Failed</h3>
            <p style="color: var(--muted); margin: 10px 0;" id="errorText">Network Error</p>
            
            <div class="debug-box">
                <strong>TARGET (CHECK SLASH):</strong><br>
                <span id="debugUrl" style="color: var(--accent);">...</span>
            </div>

            <button class="btn-block" style="background: #333; color: white;" onclick="hardReset()">HARD RESET URL</button>
        </div>

        <div id="viewDashboard" class="hidden">
            
            <div id="tabKeys">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchKeys" placeholder="Search Keys..." onkeyup="renderKeys()"></div>
                    <button class="btn-main" onclick="openModal('modalKey')"><i class="fas fa-plus"></i> NEW</button>
                </div>
                <div id="listKeys"></div>
            </div>

            <div id="tabDevices" class="hidden">
                <div class="controls">
                    <div class="search"><i class="fas fa-search"></i><input type="text" class="input-std" id="searchDevs" placeholder="Search Devices..." onkeyup="renderDevices()"></div>
                </div>
                <div id="listDevices"></div>
            </div>

            <div id="tabConfig" class="hidden">
                <h3 style="margin-bottom:15px; color:var(--muted);">App Settings</h3>
                <div class="item-card">
                    <div style="margin-bottom:10px;">
                        <label style="font-size:0.75rem; font-weight:700; color:var(--muted);">APP TITLE</label>
                        <input type="text" class="input-std" id="confTitle" style="margin-top:5px;">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label style="font-size:0.75rem; font-weight:700; color:var(--muted);">SUBTITLE</label>
                        <input type="text" class="input-std" id="confSub" style="margin-top:5px;">
                    </div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:700; color:var(--muted);">ADMIN CONTACT</label>
                        <input type="text" class="input-std" id="confUrl" style="margin-top:5px;">
                    </div>
                    <button class="btn-block" onclick="saveConfig()">SAVE CHANGES</button>
                    <button class="btn-text" onclick="hardReset()">RESET CONNECTION</button>
                </div>
            </div>

        </div>
    </div>

    <div id="modalKey" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0;">Generate Keys</h3>
            <label style="font-size:0.75rem; font-weight:700; color:var(--muted);">PREFIX</label>
            <input type="text" class="input-std" id="keyPrefix" value="VIP" style="margin-bottom:10px;">
            <label style="font-size:0.75rem; font-weight:700; color:var(--muted);">QUANTITY</label>
            <input type="number" class="input-std" id="keyQty" value="1">
            <button class="btn-block" onclick="generateKeys()">GENERATE</button>
            <button class="btn-text" onclick="closeModal('modalKey')">CANCEL</button>
        </div>
    </div>

    <div id="modalEdit" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0;">Edit Key</h3>
            <input type="hidden" id="editOld">
            <input type="text" class="input-std" id="editNew">
            <button class="btn-block" onclick="saveKeyEdit()">SAVE</button>
            <button class="btn-text" onclick="closeModal('modalEdit')">CANCEL</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span>Action Successful</span></div>

    <div class="nav-fixed">
        <div class="nav-inner">
            <div class="nav-btn active" id="navKey" onclick="switchTab('keys')"><i class="fas fa-key"></i><span class="nav-lbl">KEYS</span></div>
            <div class="nav-btn" id="navDev" onclick="switchTab('devices')"><i class="fas fa-mobile-alt"></i><span class="nav-lbl">DEVICES</span></div>
            <div class="nav-btn" id="navConf" onclick="switchTab('config')"><i class="fas fa-sliders-h"></i><span class="nav-lbl">CONFIG</span></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SAFE INIT VARIABLES
        // ==========================================
        const HARDCODED_URL = "https://appurl-8eec4-default-rtdb.firebaseio.com";
        const DEFAULT_DATA = { 
            "Config": { "Title": "Gateway VIP", "Subtitle": "ONLINE", "AdminUrl": "", "UpdateUrl": "" }, 
            "BannedDevices": { "test_ban": "banned" }, 
            "ActivatedUsers": { "placeholder": "active" }, 
            "ValidKeys": { "VIP-DEMO": new Date().toISOString() } 
        };

        // Global State
        let dbUrl = localStorage.getItem("dbUrl") || HARDCODED_URL;
        let dbData = null;
        let themes = ['cyberpunk', 'blood', 'matrix', 'cherry'];
        let curThemeIdx = 0;

        // Canvas
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let accentColor = "rgba(0, 229, 255, 0.3)";

        // ==========================================
        // 2. URL FIXER (CRITICAL FIX FOR FETCH)
        // ==========================================
        function sanitizeUrl(url) {
            let clean = url ? url.trim() : "";
            // Strip everything to get base domain
            if (clean.includes("firebaseio.com")) {
                clean = clean.split("firebaseio.com")[0] + "firebaseio.com";
            }
            // IMPORTANT: Append /.json (The Slash is vital)
            return clean + "/.json";
        }

        // AUTO-RESET IF STORED URL IS BAD
        if (!dbUrl.includes("appurl-8eec4")) {
            dbUrl = HARDCODED_URL;
            localStorage.setItem("dbUrl", dbUrl);
        }

        // ==========================================
        // 3. CORE LOGIC
        // ==========================================
        async function appInit() {
            document.getElementById('viewLoader').classList.remove('hidden');
            document.getElementById('viewError').classList.add('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');

            const finalUrl = sanitizeUrl(dbUrl) + "?t=" + Date.now(); // Cache Bust
            document.getElementById('debugUrl').innerText = finalUrl;

            // 15s Timeout
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                // Fetch
                const response = await fetch(finalUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                let data = await response.json();

                if (!data) {
                    await fetch(sanitizeUrl(dbUrl), {
                        method: 'PUT',
                        body: JSON.stringify(DEFAULT_DATA)
                    });
                    data = DEFAULT_DATA;
                }

                dbData = data;
                ensureDataStructure();
                renderAll();

                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewDashboard').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('errorText').innerText = err.message;
                document.getElementById('viewLoader').classList.add('hidden');
                document.getElementById('viewError').classList.remove('hidden');
            }
        }

        function ensureDataStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_DATA.Config;
        }

        async function syncDB() {
            const finalUrl = sanitizeUrl(dbUrl);
            try {
                await fetch(finalUrl, { method: 'PUT', body: JSON.stringify(dbData) });
                showToast("Saved");
            } catch (e) {
                showToast("Save Failed");
            }
        }

        // ==========================================
        // 4. RENDERERS
        // ==========================================
        function renderAll() {
            renderKeys();
            renderDevices();
            document.getElementById('confTitle').value = dbData.Config.Title || "";
            document.getElementById('confSub').value = dbData.Config.Subtitle || "";
            document.getElementById('confUrl').value = dbData.Config.AdminUrl || "";
        }

        function renderKeys() {
            const list = document.getElementById('listKeys');
            const search = document.getElementById('searchKeys').value.toLowerCase();
            list.innerHTML = "";

            Object.keys(dbData.ValidKeys).reverse().forEach(key => {
                if (search && !key.toLowerCase().includes(search)) return;
                
                let dateStr = "Manual";
                try {
                    const d = new Date(dbData.ValidKeys[key]);
                    if(!isNaN(d)) dateStr = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                } catch(e){}

                list.innerHTML += `
                <div class="item-card">
                    <div class="row-top">
                        <span class="mono-text" onclick="copy('${key}')">${key}</span>
                        <div style="display:flex; gap:8px">
                            <div class="act-btn" onclick="editKey('${key}')"><i class="fas fa-pen"></i></div>
                            <div class="act-btn del" onclick="delKey('${key}')"><i class="fas fa-trash"></i></div>
                        </div>
                    </div>
                    <div class="meta-row">
                        <span><i class="far fa-clock"></i> ${dateStr}</span>
                        <span class="badge">ACTIVE</span>
                    </div>
                </div>`;
            });
        }

        function renderDevices() {
            const list = document.getElementById('listDevices');
            const search = document.getElementById('searchDevs').value.toLowerCase();
            list.innerHTML = "";

            const allDevs = [...new Set([...Object.keys(dbData.ActivatedUsers), ...Object.keys(dbData.BannedDevices)])];

            allDevs.forEach(dev => {
                if(dev === "placeholder" || dev === "test_ban") return;
                if(search && !dev.toLowerCase().includes(search)) return;

                const isBanned = dbData.BannedDevices[dev] !== undefined;

                list.innerHTML += `
                <div class="item-card" style="border-left: 3px solid ${isBanned ? 'var(--red)' : 'var(--green)'}">
                    <div class="user-row">
                        <span class="mono-text" style="color:var(--text); font-size:0.85rem;" onclick="copy('${dev}')">${dev}</span>
                        <label class="switch">
                            <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${dev}')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="meta-row" style="border:none; padding-top:5px;">
                        <span class="badge ${isBanned?'banned':''}">${isBanned ? 'BANNED' : 'ALLOWED'}</span>
                    </div>
                </div>`;
            });
        }

        // ==========================================
        // 5. ACTIONS
        // ==========================================
        function generateKeys() {
            const qty = document.getElementById('keyQty').value;
            const prefix = document.getElementById('keyPrefix').value.toUpperCase();
            
            for(let i=0; i<qty; i++) {
                const rnd = Math.random().toString(36).substring(2, 8).toUpperCase();
                dbData.ValidKeys[`${prefix}-${rnd}`] = new Date().toISOString();
            }
            
            closeModal('modalKey');
            renderAll();
            syncDB();
        }

        function toggleBan(dev) {
            if (dbData.BannedDevices[dev]) {
                delete dbData.BannedDevices[dev];
                dbData.ActivatedUsers[dev] = "active";
            } else {
                dbData.BannedDevices[dev] = "banned";
            }
            renderAll();
            syncDB();
        }

        function saveConfig() {
            dbData.Config.Title = document.getElementById('confTitle').value;
            dbData.Config.Subtitle = document.getElementById('confSub').value;
            dbData.Config.AdminUrl = document.getElementById('confUrl').value;
            syncDB();
        }

        function editKey(key) {
            document.getElementById('editOld').value = key;
            document.getElementById('editNew').value = key;
            openModal('modalEdit');
        }

        function saveKeyEdit() {
            const oldK = document.getElementById('editOld').value;
            const newK = document.getElementById('editNew').value;
            if(newK && newK !== oldK) {
                dbData.ValidKeys[newK] = dbData.ValidKeys[oldK];
                delete dbData.ValidKeys[oldK];
                renderAll();
                syncDB();
            }
            closeModal('modalEdit');
        }

        function delKey(key) {
            if(confirm("Delete Key?")) {
                delete dbData.ValidKeys[key];
                renderAll();
                syncDB();
            }
        }

        // ==========================================
        // 6. UTILITIES
        // ==========================================
        function hardReset() {
            localStorage.removeItem("dbUrl");
            location.reload();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.querySelector('span').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function copy(txt) {
            navigator.clipboard.writeText(txt);
            showToast("Copied");
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function switchTab(tab) {
            ['Keys', 'Devices', 'Config'].forEach(t => {
                document.getElementById(`tab${t}`).classList.add('hidden');
            });
            ['Key', 'Dev', 'Conf'].forEach(n => {
                document.getElementById(`nav${n}`).classList.remove('active');
            });

            if(tab === 'keys') {
                document.getElementById('tabKeys').classList.remove('hidden');
                document.getElementById('navKey').classList.add('active');
            } else if(tab === 'devices') {
                document.getElementById('tabDevices').classList.remove('hidden');
                document.getElementById('navDev').classList.add('active');
            } else {
                document.getElementById('tabConfig').classList.remove('hidden');
                document.getElementById('navConf').classList.add('active');
            }
        }

        // ==========================================
        // 7. VISUALS
        // ==========================================
        function toggleTheme() {
            curThemeIdx = (curThemeIdx + 1) % themes.length;
            const theme = themes[curThemeIdx];
            document.documentElement.setAttribute('data-theme', theme);
            
            const style = getComputedStyle(document.documentElement);
            accentColor = style.getPropertyValue('--primary').trim();
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) {
                parts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    v: (Math.random() * 0.5) + 0.2,
                    s: Math.random() * 2
                });
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = accentColor;
            ctx.globalAlpha = 0.3;
            
            parts.forEach(p => {
                p.y -= p.v;
                if(p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ==========================================
        // 8. STARTUP
        // ==========================================
        document.documentElement.setAttribute('data-theme', 'cyberpunk'); 
        initParticles();
        appInit(); // Start App

    </script>
</body>
</html>
