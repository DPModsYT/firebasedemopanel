<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods V7 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --grad-main: linear-gradient(135deg, #7000ff 0%, #00e5ff 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND --- */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 10%, #1a0b2e 0%, #000000 90%); }

        .container { max-width: 720px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; background: #00ff99; border-radius: 50%; box-shadow: 0 0 15px #00ff99; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* --- CARDS --- */
        .glass-card {
            background: linear-gradient(160deg, rgba(30, 30, 45, 0.6) 0%, rgba(10, 10, 20, 0.8) 100%);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px; margin-bottom: 16px;
            backdrop-filter: blur(20px);
        }

        .user-item { display: flex; flex-direction: column; gap: 12px; border-left: 4px solid var(--primary); position: relative; }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.8; }
        .user-item.banned::after {
            content: 'BANNED'; position: absolute; right: 10px; top: 10px; background: var(--accent);
            color: white; font-size: 0.6rem; padding: 4px 10px; border-radius: 4px; font-weight: bold;
        }

        .user-header h4 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; }
        .user-header .device-id { color: var(--primary); font-size: 0.85rem; font-family: monospace; display: block; margin-top: 4px; }
        
        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-icon { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; background: rgba(255,255,255,0.08); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .btn-edit:hover { background: var(--primary); color: #000; } 
        .btn-delete:hover { background: var(--accent); color: #fff; }

        /* --- SWITCH --- */
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; margin-right: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a2a35; transition: .4s; border-radius: 34px; border: 1px solid #444; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #aaa; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #151520; border: 1px solid rgba(112, 0, 255, 0.3); width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; }
        
        label { display: block; color: var(--primary); margin: 15px 0 5px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        input, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 14px; border-radius: 10px; color: #fff; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--grad-main); color: #fff; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 25px; }

        /* --- NAV --- */
        nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 35, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 10px 30px; display: flex; gap: 40px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 90; }
        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); text-shadow: 0 0 15px var(--primary); }
        .fab-add { background: var(--grad-main); color: #fff; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; margin-top: -45px; border: 5px solid var(--bg-deep); box-shadow: 0 0 25px rgba(112, 0, 255, 0.6); }

        /* --- DEBUG & LOADER --- */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #debugLog {
            font-family: monospace; font-size: 0.7rem; color: #666; 
            margin-top: 10px; text-align: center; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V7</div>
        <div style="font-size: 0.75rem; color: #aaa; font-weight: 600;">ADMIN</div>
    </header>

    <div class="container">
        <div id="tabDevices">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff;">
                <i class="fas fa-users" style="color: var(--primary)"></i> User Database
            </h2>
            
            <div id="userList">
                <div class="glass-card" style="text-align: center; color: #888; padding: 50px 20px;">
                    <div class="loader"></div>
                    <div>Connecting...</div>
                    <div id="debugLog">Initializing...</div>
                </div>
            </div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: #fff;">
                <i class="fas fa-sliders-h" style="color: var(--secondary)"></i> Configuration
            </h2>
            <div class="glass-card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout">

                <div style="margin-top: 25px; display:flex; align-items:center;">
                    <label class="switch">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color:#fff; font-size:0.9rem;">Show Announcement</span>
                </div>

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3"></textarea>

                <button class="btn-main" onclick="saveSettings()">Update Config</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #fff; margin: 0 0 20px; font-family: 'Orbitron', sans-serif;">USER DETAILS</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label>
            <input type="text" id="inpUser">
            <label>Password</label>
            <input type="text" id="inpPass">
            <label>Device ID</label>
            <input type="text" id="inpDevice">
            <label>Expiry Date</label>
            <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-main" style="background:#222; margin-top:0;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" style="margin-top:0;" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-user-shield"></i></div>
        <div class="fab-add" onclick="openModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-cog"></i></div>
    </nav>

    <script>
        // ==========================================
        // 1. CONFIGURATION
        // ==========================================
        const API_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        let dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
        let lastJsonString = "";
        let isModalOpen = false;

        // ==========================================
        // 2. DEBUGGER
        // ==========================================
        function log(msg) {
            const el = document.getElementById('debugLog');
            if(el) el.innerText = msg;
            console.log(msg);
        }

        // ==========================================
        // 3. FETCH LOGIC
        // ==========================================
        async function fetchData() {
            if(isModalOpen) return;

            try {
                log("Fetching data from Firebase...");
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                }
                
                log("Data received. Parsing JSON...");
                const val = await response.json();

                // Handle Empty DB
                if (!val) {
                    log("Database is empty. Initializing...");
                    dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
                    renderUsers();
                    return;
                }

                const newJson = JSON.stringify(val);
                if (newJson === lastJsonString) {
                    log("Data synced. No changes.");
                    return;
                }
                lastJsonString = newJson;

                // --- DATA NORMALIZATION (PREVENT CRASHES) ---
                log("Normalizing data structures...");
                
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";

                // SAFE CONVERSION: BannedDevices (Object -> Array)
                // If index 0 exists but 1 is missing, Firebase returns Object {"0":"ID"}. We need Array.
                let bansRaw = val.BannedDevices || [];
                if (typeof bansRaw === 'object' && !Array.isArray(bansRaw)) {
                    bansRaw = Object.values(bansRaw);
                }
                dbData.BannedDevices = bansRaw.filter(x => x); // Remove nulls

                // SAFE CONVERSION: Users (Object -> Array)
                let usersRaw = val.Users || [];
                if (typeof usersRaw === 'object' && !Array.isArray(usersRaw)) {
                    usersRaw = Object.values(usersRaw);
                }

                dbData.Users = usersRaw.map(u => ({
                    Username: u.Username || "User",
                    Password: u.Password || "---",
                    DeviceID: u.DeviceID || u.ID || "", // Handle empty ID
                    Expiry: u.Expiry || ""
                }));

                log("Rendering UI...");
                renderUsers();
                fillSettings();

            } catch (error) {
                log(`ERROR: ${error.message}`);
            }
        }

        // Start Loop
        setInterval(fetchData, 3000);
        fetchData();

        // ==========================================
        // 4. RENDER UI
        // ==========================================
        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";

            if (!dbData.Users || dbData.Users.length === 0) {
                list.innerHTML = `
                <div class="glass-card" style="text-align: center; padding: 40px; color: #888;">
                    <i class="fas fa-ghost" style="font-size: 2rem; margin-bottom: 15px;"></i><br>
                    No Users Found.
                </div>`;
                return;
            }

            dbData.Users.forEach((u, index) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);
                // Safe check for empty DeviceID
                const displayID = u.DeviceID ? u.DeviceID : "NO DEVICE ID";

                const div = document.createElement('div');
                div.className = `glass-card user-item ${isBanned ? 'banned' : ''}`;
                
                div.innerHTML = `
                    <div class="user-header">
                        <div style="flex:1;">
                            <h4>${u.Username}</h4>
                            <span class="device-id"><i class="fas fa-microchip"></i> ${displayID}</span>
                        </div>
                    </div>
                    
                    <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
                        <span class="badge pass"><i class="fas fa-key"></i> ${u.Password}</span>
                        <span class="badge exp"><i class="far fa-clock"></i> ${u.Expiry}</span>
                    </div>
                    
                    <div class="action-row">
                        <div class="switch-container" style="display:flex; align-items:center;">
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                            <span style="color:#666; font-size:0.8rem; font-weight:bold;">${isBanned ? 'BANNED' : 'ACTIVE'}</span>
                        </div>
                        
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon btn-edit" onclick="openModal(${index})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-delete" onclick="deleteUser(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // ==========================================
        // 5. DATABASE ACTIONS
        // ==========================================
        async function saveData(newData) {
            try {
                log("Saving data...");
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(newData)
                });
                lastJsonString = ""; // Force refresh
                fetchData();
            } catch (e) { alert("Save Error: " + e); }
        }

        async function toggleBan(deviceID) {
            if(!deviceID) return alert("Cannot ban empty Device ID");
            
            const index = dbData.BannedDevices.indexOf(deviceID);
            if (index > -1) dbData.BannedDevices.splice(index, 1);
            else dbData.BannedDevices.push(deviceID);
            
            renderUsers(); // Optimistic update
            
            const payload = { ...dbData };
            await saveData(payload);
        }

        async function saveUser() {
            const user = document.getElementById('inpUser').value;
            const pass = document.getElementById('inpPass').value;
            const device = document.getElementById('inpDevice').value;
            const dateVal = document.getElementById('inpExpiry').value;
            const index = document.getElementById('editIndex').value;

            if (!user || !dateVal) return alert("Username and Expiry are required!");

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}/${month}/${year}`;

            const userObj = {
                Username: user,
                Password: pass,
                DeviceID: device,
                ID: device, // Backward compatibility
                Expiry: formattedDate
            };

            let newList = [...dbData.Users];
            if (index !== "") newList[parseInt(index)] = userObj;
            else newList.push(userObj);

            dbData.Users = newList;
            await saveData(dbData);
            closeModal();
        }

        async function deleteUser(index) {
            if(confirm("Delete this user?")) {
                let newList = [...dbData.Users];
                newList.splice(index, 1);
                dbData.Users = newList;
                await saveData(dbData);
            }
        }

        async function saveSettings() {
            dbData.AdminUrl = document.getElementById('confAdminUrl').value;
            dbData.DialogTimeout = document.getElementById('confTimeout').value;
            dbData.ShowAnnouncement = document.getElementById('confShowAnnounce').checked;
            dbData.Announcement = document.getElementById('confAnnounceMsg').value;
            
            await saveData(dbData);
            alert("Settings Saved!");
        }

        // ==========================================
        // 6. UI HELPERS
        // ==========================================
        function switchTab(tab) {
            document.getElementById('tabDevices').style.display = tab === 'Devices' ? 'block' : 'none';
            document.getElementById('tabSettings').style.display = tab === 'Settings' ? 'block' : 'none';
            document.getElementById('navDevices').classList.toggle('active', tab === 'Devices');
            document.getElementById('navSettings').classList.toggle('active', tab === 'Settings');
        }

        function
