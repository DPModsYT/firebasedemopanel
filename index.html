<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods VIP Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #050508;
            --bg-card: #0e0e14;
            --primary: #00e5ff; 
            --primary-dark: #00b8cc;
            --secondary: #7000ff; 
            --danger: #ff0055;
            --warning: #ffb700;
            --text-main: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --nav-bg: #161621;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND PARTICLES --- */
        #particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: rgba(5, 5, 8, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .status-dot { width: 8px; height: 8px; background: #00ff9d; border-radius: 50%; box-shadow: 0 0 12px #00ff9d; transition: 0.3s; }
        .status-dot.offline { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }

        /* --- SEARCH & CHIPS --- */
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #666; font-size: 1rem; }
        .search-input { width: 100%; background: rgba(18, 18, 26, 0.8); border: 1px solid #333; padding: 12px 12px 12px 40px; border-radius: 12px; color: white; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.3s; backdrop-filter: blur(5px); }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 229, 255, 0.1); }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; scrollbar-width: none; }
        .chip { padding: 6px 16px; background: #1a1a24; border-radius: 50px; font-size: 0.8rem; color: #888; border: 1px solid #333; white-space: nowrap; transition: 0.3s; font-weight: 500; cursor: pointer; }
        .chip.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 600; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* --- CARDS --- */
        .card { background: rgba(14, 14, 20, 0.7); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; margin-bottom: 10px; position: relative; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        
        .card.key-card { border-left: 3px solid var(--primary); }
        .card.user-card { border-left: 3px solid var(--secondary); }
        .card.banned { border-left: 3px solid var(--danger); opacity: 0.7; }

        .head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .main-text { font-weight: 700; font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; color: #fff; letter-spacing: 1px; word-break: break-all; }
        .sub-text { font-family: monospace; font-size: 0.8rem; color: #666; display: block; }
        
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.05); border-radius: 8px; color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); }
        .btn-copy { color: var(--primary); }
        .btn-del { color: var(--danger); }
        .btn-ban { color: var(--warning); }

        /* --- SETTINGS --- */
        .section-title { color: var(--primary); font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; margin: 20px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .inp-group { margin-bottom: 12px; }
        .inp-label { display: block; color: #888; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        .inp { width: 100%; background: #0a0a10; border: 1px solid #333; padding: 12px; color: white; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.85rem; }
        .inp:focus { border-color: var(--primary); }

        /* --- NAV BAR --- */
        .nav-bar { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(22, 22, 33, 0.95); border: 1px solid rgba(255,255,255,0.1); 
            padding: 0 25px; height: 65px; border-radius: 40px; 
            display: flex; align-items: center; justify-content: space-between; 
            width: 85%; max-width: 380px; z-index: 99; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
        }
        .nav-item { color: #555; font-size: 1.3rem; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
        .fab { 
            width: 55px; height: 55px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.4rem; color: #000; 
            position: absolute; left: 50%; top: -25px; transform: translateX(-50%); 
            border: 5px solid var(--bg-body); cursor: pointer; 
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); 
        }

        /* --- MODAL --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1a1a24; width: 85%; max-width: 320px; padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .btn-full { width: 100%; padding: 12px; background: var(--primary); border: none; font-weight: 700; border-radius: 12px; color: #000; margin-top: 10px; cursor: pointer; }
        .btn-cancel { background: #333; color: white; margin-top: 10px; }

        .hidden { display: none !important; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #161621; border: 1px solid var(--primary); color: white; padding: 10px 20px; border-radius: 10px; z-index: 300; transition: 0.4s; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <header>
        <div class="logo"><div id="statusDot" class="status-dot"></div> VIP GATEWAY</div>
    </header>

    <div class="container">
        <div id="loader" style="text-align: center; padding: 80px 0;">
            <i class="fas fa-satellite-dish fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            <p style="color: #666; margin-top: 15px; font-size: 0.8rem; letter-spacing: 1px;">ESTABLISHING UPLINK...</p>
        </div>

        <div id="errorMsg" class="hidden" style="text-align: center; padding: 40px; color: var(--danger);">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i>
            <p>DATABASE DISCONNECTED</p>
            <button onclick="resetApp()" style="background: #333; color: white; border: none; padding: 8px 15px; border-radius: 8px; margin-top: 10px;">RESET</button>
        </div>

        <div id="tabKeys" class="hidden">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchKey" class="search-input" placeholder="Search Keys..." onkeyup="renderKeys()">
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="color: #666; font-size: 0.8rem; font-weight: 600;">VALID KEYS DATABASE</span>
                <span id="keyCount" style="background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;">0</span>
            </div>

            <div id="keyList"></div>
        </div>

        <div id="tabUsers" class="hidden">
            <div class="chips">
                <div class="chip active" onclick="setFilter('active', this)">Activated</div>
                <div class="chip" onclick="setFilter('banned', this)">Banned</div>
            </div>
            <div id="userList"></div>
        </div>

        <div id="tabSettings" class="hidden">
            <h2 style="color:white; margin:0 0 15px 0; font-size:1.3rem;">App Configuration</h2>
            
            <div class="card" style="border:1px solid #222;">
                <div class="section-title">GENERAL</div>
                <div class="inp-group"><label class="inp-label">App Title</label><input type="text" class="inp" id="cfgTitle"></div>
                <div class="inp-group"><label class="inp-label">Subtitle (Status)</label><input type="text" class="inp" id="cfgSub"></div>
                <div class="inp-group"><label class="inp-label">App Version (Int)</label><input type="number" class="inp" id="cfgVer"></div>
                <div class="inp-group"><label class="inp-label">Key Duration (Hours)</label><input type="number" class="inp" id="cfgDur"></div>

                <div class="section-title">LINKS</div>
                <div class="inp-group"><label class="inp-label">Admin Contact URL</label><input type="text" class="inp" id="cfgAdminUrl"></div>
                <div class="inp-group"><label class="inp-label">Update URL</label><input type="text" class="inp" id="cfgUpdUrl"></div>

                <div class="section-title">INTERFACE TEXTS</div>
                <div class="inp-group"><label class="inp-label">Hint Text</label><input type="text" class="inp" id="txtHint"></div>
                <div class="inp-group"><label class="inp-label">Key Button</label><input type="text" class="inp" id="txtBtnKey"></div>
                <div class="inp-group"><label class="inp-label">Login Button</label><input type="text" class="inp" id="txtBtnLog"></div>
                <div class="inp-group"><label class="inp-label">Admin Button</label><input type="text" class="inp" id="txtBtnAdm"></div>

                <div class="section-title">API INTEGRATION</div>
                <div class="inp-group"><label class="inp-label">Base URL</label><input type="text" class="inp" id="apiBase"></div>
                <div class="inp-group"><label class="inp-label">API Token</label><input type="text" class="inp" id="apiToken"></div>
                
                <button class="btn-full" onclick="saveConfig()">SAVE CONFIGURATION</button>
                
                <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 15px;">
                   <div class="inp-group"><label class="inp-label">Database URL (Admin Only)</label><input type="text" class="inp" id="dbUrlConf"></div>
                   <button class="btn-full btn-cancel" onclick="updateDbUrl()">SWITCH DATABASE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalKey" class="modal-wrap">
        <div class="modal-box">
            <h3 style="color:white; margin-top:0;">Generate Access Key</h3>
            
            <div class="inp-group">
                <label class="inp-label">Key String</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" class="inp" id="newKeyVal" placeholder="Ex: VIP-XXXX">
                    <button onclick="genRandomKey()" style="background:#333; border:none; color:var(--primary); border-radius:8px; width:40px;"><i class="fas fa-dice"></i></button>
                </div>
            </div>

            <button class="btn-full" onclick="addKey()">ADD TO DATABASE</button>
            <button class="btn-full btn-cancel" onclick="document.getElementById('modalKey').style.display='none'">CANCEL</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Saved</span></div>

    <div class="nav-bar">
        <div class="nav-item active" id="navKeys" onclick="switchTab('keys')"><i class="fas fa-key"></i></div>
        <div class="fab" onclick="openKeyModal()"><i class="fas fa-plus"></i></div>
        <div class="nav-item" id="navUsers" onclick="switchTab('users')"><i class="fas fa-users"></i></div>
        <div class="nav-item" id="navSet" onclick="switchTab('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Your specific Firebase URL
        const DEFAULT_URL = "https://appurl-8eec4-default-rtdb.firebaseio.com/.json";
        
        // The exact structure you requested
        const DEFAULT_JSON = {
            "Config": {
                "Title": "DPMods VIP",
                "Subtitle": "GATEWAY V14.0 // ONLINE",
                "AdminUrl": "https://t.me/dpmods",
                "UpdateUrl": "https://google.com",
                "AppVersion": 1,
                "KeyDurationHours": 4,
                "Texts": {
                    "Hint": "ENTER ACCESS KEY",
                    "BtnKey": "GET KEY",
                    "BtnLogin": "ACTIVATE SYSTEM",
                    "BtnAdmin": "ADMIN SUPPORT"
                },
                "Api": {
                    "Token": "e866b423bb5ae2597c657c9fd6288e8e5d113a47",
                    "BaseUrl": "https://xtglinks.com/api"
                }
            },
            "BannedDevices": { "test_device": "banned" },
            "ActivatedUsers": { "do_not_delete": "placeholder" },
            "ValidKeys": { "DEMO-KEY-123": "placeholder" }
        };

        let dbUrl = localStorage.getItem("dbUrl") || DEFAULT_URL;
        let dbData = null; // Stores full JSON object
        let currentTab = 'keys';
        let userFilter = 'active';

        // --- PARTICLE ANIMATION ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        class P {
            constructor(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5; this.s=Math.random()*2; }
            up(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0)this.x=canvas.width; if(this.x>canvas.width)this.x=0; if(this.y<0)this.y=canvas.height; if(this.y>canvas.height)this.y=0; }
            dr(){ ctx.fillStyle=`rgba(0, 229, 255, ${Math.random()*0.3})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
        }
        for(let i=0;i<40;i++) particles.push(new P());
        function anim(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.up();p.dr()}); requestAnimationFrame(anim); }
        anim();

        // --- CORE FUNCTIONS ---
        async function init() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorMsg').classList.add('hidden');
            
            try {
                const res = await fetch(dbUrl);
                if(!res.ok) throw new Error("Net Error");
                let data = await res.json();

                // Auto-upload defaults if empty
                if(data === null) {
                    await fetch(dbUrl, { method:'PUT', body: JSON.stringify(DEFAULT_JSON) });
                    data = DEFAULT_JSON;
                }
                
                dbData = data;
                ensureStructure(); // Fix missing objects if any
                
                populateUI();
                document.getElementById('loader').style.display = 'none';
                document.getElementById('tabKeys').classList.remove('hidden');
                document.getElementById('statusDot').classList.remove('offline');

            } catch(e) {
                console.log(e);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('statusDot').classList.add('offline');
            }
        }

        function ensureStructure() {
            if(!dbData.ValidKeys) dbData.ValidKeys = {};
            if(!dbData.ActivatedUsers) dbData.ActivatedUsers = {};
            if(!dbData.BannedDevices) dbData.BannedDevices = {};
            if(!dbData.Config) dbData.Config = DEFAULT_JSON.Config;
        }

        async function saveData() {
            // Optimistic UI update already happened in local dbData
            // Just push dbData to Firebase
            try {
                await fetch(dbUrl, { method:'PUT', body: JSON.stringify(dbData) });
                showToast("Database Updated");
            } catch(e) {
                showToast("Sync Failed!");
            }
        }

        function populateUI() {
            renderKeys();
            renderUsers();
            fillSettings();
        }

        // --- KEYS TAB ---
        function renderKeys() {
            const list = document.getElementById('keyList');
            list.innerHTML = "";
            const search = document.getElementById('searchKey').value.toLowerCase();
            const keys = Object.keys(dbData.ValidKeys).reverse(); // Newest first usually
            
            document.getElementById('keyCount').innerText = keys.length;

            if(keys.length === 0) { list.innerHTML="<div style='text-align:center;color:#444;margin-top:20px;'>No Keys Found</div>"; return; }

            keys.forEach(k => {
                if(k === "do_not_delete") return; // Skip placeholder
                if(search && !k.toLowerCase().includes(search)) return;

                const val = dbData.ValidKeys[k];
                list.innerHTML += `
                <div class="card key-card">
                    <div class="head-row">
                        <span class="main-text" style="color:var(--primary);">${k}</span>
                        <span class="sub-text">VALID</span>
                    </div>
                    <div class="sub-text" style="font-size:0.75rem;">Status: ${val === 'placeholder' ? 'Unused' : val}</div>
                    <div class="actions">
                        <button class="btn-icon btn-copy" onclick="copyTxt('${k}')"><i class="fas fa-copy"></i></button>
                        <button class="btn-icon btn-del" onclick="deleteKey('${k}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }

        function openKeyModal() {
            document.getElementById('modalKey').style.display = 'flex';
            document.getElementById('newKeyVal').value = "";
        }

        function genRandomKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let res = "VIP-";
            for(let i=0;i<6;i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('newKeyVal').value = res;
        }

        function addKey() {
            const k = document.getElementById('newKeyVal').value.trim();
            if(!k) return alert("Enter a key");
            
            dbData.ValidKeys[k] = "placeholder"; // Default value
            document.getElementById('modalKey').style.display = 'none';
            renderKeys();
            saveData();
        }

        function deleteKey(k) {
            if(confirm("Delete Key: " + k + "?")) {
                delete dbData.ValidKeys[k];
                renderKeys();
                saveData();
            }
        }

        // --- USERS TAB ---
        function setFilter(f, el) {
            userFilter = f;
            document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
            el.classList.add('active');
            renderUsers();
        }

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            
            if(userFilter === 'active') {
                const users = Object.keys(dbData.ActivatedUsers);
                if(users.length === 0 || (users.length===1 && users[0]==='do_not_delete')) {
                    list.innerHTML="<div style='text-align:center;color:#444;margin-top:20px;'>No Active Users</div>"; return;
                }
                users.forEach(u => {
                    if(u === 'do_not_delete') return;
                    list.innerHTML += `
                    <div class="card user-card">
                        <div class="head-row"><span class="main-text">${u}</span></div>
                        <div class="sub-text">DEVICE ID</div>
                        <div class="actions">
                            <button class="btn-icon btn-copy" onclick="copyTxt('${u}')"><i class="fas fa-copy"></i></button>
                            <button class="btn-icon btn-del" onclick="banUser('${u}')" style="width:auto; padding:0 10px; gap:5px;"><i class="fas fa-ban"></i> BAN DEVICE</button>
                        </div>
                    </div>`;
                });
            } else {
                const bans = Object.keys(dbData.BannedDevices);
                if(bans.length === 0) { list.innerHTML="<div style='text-align:center;color:#444;margin-top:20px;'>No Banned Devices</div>"; return; }
                bans.forEach(b => {
                    list.innerHTML += `
                    <div class="card banned">
                        <div class="head-row"><span class="main-text" style="color:var(--danger)">${b}</span></div>
                        <div class="sub-text">BANNED</div>
                        <div class="actions">
                            <button class="btn-icon btn-copy" onclick="copyTxt('${b}')"><i class="fas fa-copy"></i></button>
                            <button class="btn-icon" onclick="unbanUser('${b}')" style="width:auto; padding:0 10px; color:#fff;">UNBAN</button>
                        </div>
                    </div>`;
                });
            }
        }

        function banUser(deviceId) {
            if(confirm("Ban this device?")) {
                delete dbData.ActivatedUsers[deviceId];
                dbData.BannedDevices[deviceId] = "banned";
                renderUsers();
                saveData();
            }
        }

        function unbanUser(deviceId) {
            delete dbData.BannedDevices[deviceId];
            renderUsers();
            saveData();
        }

        // --- SETTINGS TAB ---
        function fillSettings() {
            const c = dbData.Config;
            document.getElementById('cfgTitle').value = c.Title || "";
            document.getElementById('cfgSub').value = c.Subtitle || "";
            document.getElementById('cfgVer').value = c.AppVersion || 1;
            document.getElementById('cfgDur').value = c.KeyDurationHours || 4;
            document.getElementById('cfgAdminUrl').value = c.AdminUrl || "";
            document.getElementById('cfgUpdUrl').value = c.UpdateUrl || "";
            
            if(c.Texts) {
                document.getElementById('txtHint').value = c.Texts.Hint || "";
                document.getElementById('txtBtnKey').value = c.Texts.BtnKey || "";
                document.getElementById('txtBtnLog').value = c.Texts.BtnLogin || "";
                document.getElementById('txtBtnAdm').value = c.Texts.BtnAdmin || "";
            }

            if(c.Api) {
                document.getElementById('apiBase').value = c.Api.BaseUrl || "";
                document.getElementById('apiToken').value = c.Api.Token || "";
            }
            
            document.getElementById('dbUrlConf').value = dbUrl;
        }

        function saveConfig() {
            const c = dbData.Config;
            c.Title = document.getElementById('cfgTitle').value;
            c.Subtitle = document.getElementById('cfgSub').value;
            c.AppVersion = parseInt(document.getElementById('cfgVer').value);
            c.KeyDurationHours = parseInt(document.getElementById('cfgDur').value);
            c.AdminUrl = document.getElementById('cfgAdminUrl').value;
            c.UpdateUrl = document.getElementById('cfgUpdUrl').value;

            if(!c.Texts) c.Texts = {};
            c.Texts.Hint = document.getElementById('txtHint').value;
            c.Texts.BtnKey = document.getElementById('txtBtnKey').value;
            c.Texts.BtnLogin = document.getElementById('txtBtnLog').value;
            c.Texts.BtnAdmin = document.getElementById('txtBtnAdm').value;

            if(!c.Api) c.Api = {};
            c.Api.BaseUrl = document.getElementById('apiBase').value;
            c.Api.Token = document.getElementById('apiToken').value;

            saveData();
        }

        function updateDbUrl() {
            const newUrl = document.getElementById('dbUrlConf').value;
            if(newUrl) {
                localStorage.setItem("dbUrl", newUrl);
                window.location.reload();
            }
        }

        // --- HELPERS ---
        function switchTab(t) {
            currentTab = t;
            document.getElementById('tabKeys').classList.add('hidden');
            document.getElementById('tabUsers').classList.add('hidden');
            document.getElementById('tabSettings').classList.add('hidden');
            
            document.getElementById('navKeys').classList.remove('active');
            document.getElementById('navUsers').classList.remove('active');
            document.getElementById('navSet').classList.remove('active');

            if(t==='keys') {
                document.getElementById('tabKeys').classList.remove('hidden');
                document.getElementById('navKeys').classList.add('active');
            } else if(t==='users') {
                document.getElementById('tabUsers').classList.remove('hidden');
                document.getElementById('navUsers').classList.add('active');
            } else {
                document.getElementById('tabSettings').classList.remove('hidden');
                document.getElementById('navSet').classList.add('active');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'), 3000);
        }

        function copyTxt(txt) {
            navigator.clipboard.writeText(txt).then(() => showToast("Copied!"));
        }

        function resetApp() { localStorage.removeItem("dbUrl"); window.location.reload(); }

        // START
        init();
        setInterval(init, 8000); // Poll every 8s
    </script>
</body>
</html>
