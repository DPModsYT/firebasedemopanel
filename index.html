<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPMods V9 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --primary: #00e5ff; 
            --secondary: #7000ff; 
            --accent: #ff0055;
            --text-main: #ffffff;
            --glass-bg: rgba(20, 20, 35, 0.9);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* --- HEADER --- */
        header {
            padding: 20px;
            background: rgba(10, 10, 20, 0.95);
            border-bottom: var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .status-dot { height: 10px; width: 10px; background-color: #00ff88; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #00ff88; }

        /* --- CONTAINER --- */
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

        /* --- CARDS --- */
        .card {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* --- USER ITEM --- */
        .user-item { border-left: 4px solid var(--primary); }
        .user-item.banned { border-left-color: var(--accent); opacity: 0.8; }
        
        .user-top { display: flex; justify-content: space-between; align-items: center; }
        .user-name { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; }
        .user-device { font-family: monospace; font-size: 0.85rem; color: var(--primary); margin-top: 4px; display: block; }
        
        .badges { display: flex; gap: 10px; margin-top: 10px; }
        .badge { background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; color: #ccc; }

        /* --- CONTROLS --- */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        .btn-icon { background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-icon:hover { background: var(--primary); color: #000; }
        .btn-del:hover { background: var(--accent); color: #fff; }

        /* --- TOGGLE --- */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- NAV --- */
        nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111; border: 1px solid #333; padding: 10px 30px; border-radius: 50px; display: flex; gap: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 99; }
        .nav-item { color: #666; font-size: 1.4rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid var(--secondary); }
        
        input, textarea { width: 100%; background: #0f0f15; border: 1px solid #333; padding: 12px; color: white; border-radius: 8px; margin-top: 5px; margin-bottom: 15px; }
        label { font-size: 0.8rem; color: var(--primary); font-weight: bold; }
        
        .btn-main { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--secondary), var(--primary)); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* --- DEBUG CONSOLE --- */
        #debug-box {
            font-family: monospace; font-size: 0.8rem; color: #00ff88; 
            background: #000; padding: 15px; border-radius: 8px; 
            height: 150px; overflow-y: scroll; margin-top: 20px;
            border: 1px solid #333; display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span class="status-dot"></span> DPMODS V9</div>
    </header>

    <div class="container">
        <div id="tabDevices">
            <h2 style="color: white; margin-bottom: 15px;">User Database</h2>
            
            <div id="loadingState" class="card" style="text-align: center;">
                <i class="fas fa-satellite-dish fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                <h3 style="margin: 0;">Connecting...</h3>
                <p id="statusText" style="color: #888; font-size: 0.9rem;">Initializing System</p>
                <div id="debug-box"></div>
                <button onclick="window.location.reload()" style="background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; margin-top: 10px; cursor: pointer;">Force Refresh</button>
            </div>

            <div id="userList" style="display: none;"></div>
        </div>

        <div id="tabSettings" style="display: none;">
            <h2 style="color: white; margin-bottom: 15px;">Configuration</h2>
            <div class="card">
                <label>Admin Contact URL</label>
                <input type="text" id="confAdminUrl">

                <label>Dialog Timeout</label>
                <input type="text" id="confTimeout">

                <label>Announcement Message</label>
                <textarea id="confAnnounceMsg" rows="3"></textarea>
                
                <div style="display: flex; align-items: center; margin-bottom: 15px;">
                    <label class="switch" style="margin-right: 10px;">
                        <input type="checkbox" id="confShowAnnounce">
                        <span class="slider"></span>
                    </label>
                    <span style="color: white; font-size: 0.9rem;">Show Announcement</span>
                </div>

                <button class="btn-main" onclick="saveSettings()">Save Config</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="color: white; margin-top: 0;">User Details</h3>
            <input type="hidden" id="editIndex">
            
            <label>Username</label> <input type="text" id="inpUser">
            <label>Password</label> <input type="text" id="inpPass">
            <label>Device ID</label> <input type="text" id="inpDevice">
            <label>Expiry Date</label> <input type="date" id="inpExpiry">

            <div style="display: flex; gap: 10px;">
                <button class="btn-main" style="background: #333;" onclick="closeModal()">Cancel</button>
                <button class="btn-main" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('Devices')" id="navDevices"><i class="fas fa-users"></i></div>
        <div class="nav-item" onclick="openModal()"><i class="fas fa-plus-circle" style="color: var(--primary); transform: scale(1.3);"></i></div>
        <div class="nav-item" onclick="switchTab('Settings')" id="navSettings"><i class="fas fa-sliders-h"></i></div>
    </nav>

    <script>
        // ==========================================
        // 1. CONFIGURATION
        // ==========================================
        const FIREBASE_URL = "https://awesome-6004e.firebaseio.com/.json";
        
        let dbData = { Users: [], BannedDevices: [], AdminUrl: "", DialogTimeout: "1m" };
        let isModalOpen = false;

        // ==========================================
        // 2. DEBUG LOGGING
        // ==========================================
        function log(msg) {
            const box = document.getElementById('debug-box');
            const status = document.getElementById('statusText');
            box.style.display = 'block';
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
            if(status) status.innerText = msg;
            console.log(msg);
        }

        // ==========================================
        // 3. CORE LOGIC
        // ==========================================
        async function fetchData() {
            if(isModalOpen) return;

            try {
                // log("Fetching data..."); 
                const res = await fetch(FIREBASE_URL);
                
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const val = await res.json();
                
                if(!val) {
                    log("Database empty. Initializing...");
                    renderUI();
                    return;
                }

                // --- SAFE PARSING ---
                dbData.AdminUrl = val.AdminUrl || "";
                dbData.DialogTimeout = val.DialogTimeout || "1m";
                dbData.ShowAnnouncement = val.ShowAnnouncement || false;
                dbData.Announcement = val.Announcement || "";

                // Fix BannedDevices (Object -> Array)
                let bans = val.BannedDevices || [];
                if(typeof bans === 'object' && !Array.isArray(bans)) bans = Object.values(bans);
                dbData.BannedDevices = bans.filter(x => x); // remove nulls

                // Fix Users (Object -> Array)
                let users = val.Users || [];
                if(typeof users === 'object' && !Array.isArray(users)) users = Object.values(users);

                dbData.Users = users.map(u => ({
                    Username: u.Username || "Unknown",
                    Password: u.Password || "---",
                    DeviceID: u.DeviceID || u.ID || "", // Handle empty ID gracefully
                    Expiry: u.Expiry || ""
                }));

                // If successful, hide loader and show list
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('userList').style.display = 'block';
                
                renderUI();

            } catch (e) {
                log(`ERROR: ${e.message}`);
            }
        }

        function renderUI() {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            
            // Fill Settings Form
            if(document.activeElement.tagName !== 'INPUT') {
                document.getElementById('confAdminUrl').value = dbData.AdminUrl;
                document.getElementById('confTimeout').value = dbData.DialogTimeout;
                document.getElementById('confShowAnnounce').checked = dbData.ShowAnnouncement;
                document.getElementById('confAnnounceMsg').value = dbData.Announcement;
            }

            if(dbData.Users.length === 0) {
                list.innerHTML = `<div class="card" style="text-align:center; color:#666;">No Users Found. Click + to add.</div>`;
                return;
            }

            dbData.Users.forEach((u, idx) => {
                const isBanned = dbData.BannedDevices.includes(u.DeviceID);
                const displayID = u.DeviceID ? u.DeviceID : "NO DEVICE ID";
                
                const html = `
                <div class="card user-item ${isBanned ? 'banned' : ''}">
                    <div class="user-top">
                        <div>
                            <div class="user-name">${u.Username}</div>
                            <span class="user-device">${displayID}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <label class="switch">
                                <input type="checkbox" ${isBanned ? 'checked' : ''} onchange="toggleBan('${u.DeviceID}')">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="badges">
                        <span class="badge"><i class="fas fa-key"></i> ${u.Password}</span>
                        <span class="badge"><i class="far fa-clock"></i> ${u.Expiry}</span>
                    </div>

                    <div class="controls">
                        <span style="font-size:0.75rem; color:#666; font-weight:bold;">${isBanned ? 'BANNED' : 'ACTIVE'}</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-icon" onclick="openModal(${idx})"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon btn-del" onclick="deleteUser(${idx})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
                list.innerHTML += html;
            });
        }

        // ==========================================
        // 4. ACTIONS
        // ==========================================
        async function saveData() {
            try {
                // Save simplified structure back to Firebase
                await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dbData)
                });
                fetchData(); // Refresh
            } catch (e) { alert("Save Error: " + e); }
        }

        function toggleBan(id) {
            if(!id) return alert("Cannot ban user with no Device ID");
            const idx = dbData.BannedDevices.indexOf(id);
            if(idx > -1) dbData.BannedDevices.splice(idx, 1);
            else dbData.BannedDevices.push(id);
            saveData();
        }

        function saveSettings() {
            dbData.AdminUrl = document.getElementById('confAdminUrl').value;
            dbData.DialogTimeout = document.getElementById('confTimeout').value;
            dbData.ShowAnnouncement = document.getElementById('confShowAnnounce').checked;
            dbData.Announcement = document.getElementById('confAnnounceMsg').value;
            saveData();
            alert("Settings Saved!");
        }

        function saveUser() {
            const user = document.getElementById('inpUser').value;
            const pass = document.getElementById('inpPass').value;
            const device = document.getElementById('inpDevice').value;
            const expiry = document.getElementById('inpExpiry').value;
            const editIdx = document.getElementById('editIndex').value;

            if(!user || !expiry) return alert("Username & Expiry Required");

            // Format Date YYYY-MM-DD -> DD/MM/YYYY
            const [y, m, d] = expiry.split('-');
            const fmtDate = `${d}/${m}/${y}`;

            const newUser = {
                Username: user,
                Password: pass,
                DeviceID: device,
                ID: device, // Maintain compatibility
                Expiry: fmtDate
            };

            if(editIdx !== "") dbData.Users[editIdx] = newUser;
            else dbData.Users.push(newUser);

            saveData();
            closeModal();
        }

        function deleteUser(idx) {
            if(confirm("Delete this user?")) {
                dbData.Users.splice(idx, 1);
                saveData();
            }
        }

        // ==========================================
        // 5. NAVIGATION & UTILS
        // ==========================================
        function switchTab(tab) {
            document.getElementById('tabDevices').style.display = tab === 'Devices' ? 'block' : 'none';
            document.getElementById('tabSettings').style.display = tab === 'Settings' ? 'block' : 'none';
            document.getElementById('navDevices').classList.toggle('active', tab === 'Devices');
            document.getElementById('navSettings').classList.toggle('active', tab === 'Settings');
        }

        function openModal(idx = null) {
            isModalOpen = true;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('editIndex').value = "";
            document.getElementById('inpUser').value = "";
            document.getElementById('inpPass').value = "";
            document.getElementById('inpDevice').value = "";
            document.getElementById('inpExpiry').value = "";

            if(idx !== null) {
                const u = dbData.Users[idx];
                document.getElementById('editIndex').value = idx;
                document.getElementById('inpUser').value = u.Username;
                document.getElementById('inpPass').value = u.Password;
                document.getElementById('inpDevice').value = u.DeviceID;
                
                // DD/MM/YYYY -> YYYY-MM-DD
                const parts = u.Expiry.split('/');
                if(parts.length === 3) document.getElementById('inpExpiry').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
        }

        function closeModal() {
            isModalOpen = false;
            document.getElementById('modal').style.display = 'none';
        }

        // Start
        log("System Started. Connecting...");
        setInterval(fetchData, 4000); // Check every 4s
        fetchData();
    </script>
</body>
</html>
